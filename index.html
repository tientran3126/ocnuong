    const canCancel = !done || isManager();
    const cancelBtn = canCancel
      ? '<button class="pillbtn x" data-cancel="' + o.id + '">✕</button>'
      : '<span class="pillbtn" style="opacity:.4">🔒</span>';
    const schedTag = isScheduled(o) ? ' <span class="scheduletag">⏰ ' + fmtDateTime(o.scheduledAt) + '</span>' : '';
    const statusCls = {
      cho_bep:'new', cho_ck:'pending', dang_lam:'cooking',
      hoan_thanh:'st', dang_giao:'delivering', da_giao:'delivered'
    }[o.status] || 'st';
    const statusPrefix = done ? "✅ " : (cooking ? "🔥 " : (pendingCK ? "💳 " : (delivering ? "🚚 " : "")));
    return '<div class="item' + (done ? " served" : "") + '">' +
      '<div class="name" style="flex:1;min-width:0">' +
        statusPrefix + typeBadge + ' ' + esc(o.name) + ' ×' + o.qty +
        (o.note ? ' <span class="notetag">📝 ' + esc(o.note) + '</span>' : '') + schedTag +
        ' <span class="badge ' + statusCls + '">' + statusLabel(o.status) + '</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:.4rem;flex:0 0 auto">' +
        '<span>' + VND(o.qty*o.price) + '</span>' + cancelBtn +
      '</div></div>';
  }).join("");
  const seated = state.tableSessions[id] ? '<div class="muted">' + (isTA?'Tạo':'Ngồi') + ' ' + minsAgo(state.tableSessions[id]) + ' phút</div>' : "";
  const kids = isTA ? [] : mergedChildren(id);
  const kidLine = kids.length ? '<div class="muted">Gộp với: ' + kids.join(", ") + '</div>' : "";
  const noteLine = note ? '<div class="svc-summary" style="border-color:var(--p4)">📌 <b>Ghi chú:</b> ' + esc(note) + '</div>' : "";
  const bookLine = booking ? (function(){
    let h = '<div class="booking-info" style="margin-top:.5rem">' +
      '<div class="bi-title">' + (booking.locked?'🔒 ĐÃ ĐẶT — ĐANG KHÓA':'📅 Đặt bàn (chưa khóa)') + '</div>' +
      (booking.customerName ? '<div class="bi-line"><b>👤 Khách:</b><span>' + esc(booking.customerName) + '</span></div>' : '') +
      (booking.phone ? '<div class="bi-line"><b>📞 SĐT:</b><span>' + esc(booking.phone) + '</span></div>' : '') +
      '<div class="bi-line"><b>👥 Số khách:</b><span>' + (booking.guests||2) + '</span></div>' +
      (booking.date || booking.time ? '<div class="bi-line"><b>🕒 Thời gian:</b><span>' + esc((booking.date||"") + " " + (booking.time||"")) + '</span></div>' : '') +
      (booking.note ? '<div class="bi-line"><b>📝 Ghi chú:</b><span>' + esc(booking.note) + '</span></div>' : '') +
      (booking.mergedTables && booking.mergedTables.length ? '<div class="bi-line"><b>🔗 Ghép:</b><span>' + booking.mergedTables.join(", ") + '</span></div>' : '') +
      '<div class="row" style="gap:.3rem;margin-top:.5rem">' +
        (booking.locked
          ? '<button class="btn ok small" id="mBookUnlock">🔓 Mở bàn</button>'
          : '<button class="btn warn small" id="mBookLock">🔒 Khóa lại</button>') +
        '<button class="btn secondary small" id="mBookEdit">✏️</button>' +
        '<button class="btn danger small" id="mBookDel">🗑️</button>' +
      '</div></div>';
    return h;
  })() : "";
  const svcLine = svcs.length ? '<div class="svc-summary">' +
    '<div class="row" style="margin-bottom:.3rem"><b>➕ Dịch vụ (' + svcs.length + ')</b></div>' +
    svcs.map((s,i)=>'<div class="svc-item"><span>' + esc(s.note || 'DV') + (s.billable === false ? ' <span class="badge paid" style="font-size:.6rem">FREE</span>' : '') + '</span>' +
      '<span><b>' + VND(s.price||0) + '</b> <span class="x" data-svc-del="' + i + '">✕</span></span></div>').join("") +
    '<div class="row" style="margin-top:.3rem;border-top:1px dashed var(--border);padding-top:.3rem"><b>Tổng DV:</b><b>' + VND(isTA ? getTASvcTotal(id) : getTableSvcTotal(id)) + '</b></div>' +
  '</div>' : "";
  const tableCalls = state.calls.filter(c=>c.table === id && !c.handled);
  const callLine = tableCalls.length ? '<div class="card" style="background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-color:var(--danger);margin-top:.6rem">🔔 <b>Khách gọi:</b>' +
    tableCalls.map(c=>{
      const info = callTypeInfo(c.type);
      return '<div style="margin-top:.3rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center">' +
        '<div style="flex:1;min-width:0"><b>' + info.icon + '</b> ' + esc(c.message||info.label) + '</div>' +
        '<button class="btn ok small" data-hc="' + c.id + '">✓</button></div>';
    }).join("") + '</div>' : "";
  let taBlock = "";
  if(isTA){
    const badge = meta.pickup ? '<span class="badge p3">🏃 Tự lấy</span>' : '<span class="badge ta">🛵 Giao</span>';
    const itemTotal = taTotal(id);
    const svcTotal = getTASvcTotal(id);
    const df = meta.deliveryFee || 0;
    const grand = itemTotal + svcTotal + df;
    taBlock = '<div class="card" style="background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 10%,var(--surface)),var(--surface));border-color:var(--ta);margin-top:.5rem">' +
      '<div class="row"><b style="color:var(--ta)">🥡 Đơn ' + id + '</b>' + badge + '</div>' +
      '<div class="row" style="margin-top:.35rem"><span class="muted">👤</span><b>' + esc(meta.name||"—") + '</b></div>' +
      '<div class="row"><span class="muted">📞</span><a href="tel:' + esc(meta.phone) + '" style="color:var(--primary-d);font-weight:700">' + esc(meta.phone||"—") + '</a></div>' +
      (!meta.pickup ? '<div class="row"><span class="muted">📍</span><b style="text-align:right;flex:1">' + esc(meta.address||"—") + '</b></div>' : "") +
      (meta.note ? '<div class="row"><span class="muted">📝</span><span style="text-align:right">' + esc(meta.note) + '</span></div>' : "") +
      '<div class="row" style="border-top:1px dashed var(--border);padding-top:.3rem;margin-top:.3rem"><span>Tổng thanh toán:</span><b style="color:var(--money);font-size:1.05rem">' + VND(grand) + '</b></div>' +
      (df > 0 ? '<div class="tiny muted" style="text-align:right">Đã gồm phí ship: ' + VND(df) + '</div>' : '') +
    '</div>';
    // Fix #2: Nút gọi NV / nhắn NV cho TA — đã có trong banner gọi
    // Fix #1: Nút xác nhận CK toàn đơn
    if(taPendingCK){
      taBlock += '<button class="btn ok" id="mConfirmTA_All" style="width:100%;margin-top:.5rem">✓ Xác nhận CK & cho bếp làm (' + VND(grand) + ')</button>';
    }
    if(taAllDone && !taDelivering && !taDelivered && !meta.pickup){
      taBlock += '<button class="btn blue" id="mStartDelivery" style="width:100%;margin-top:.5rem">🚚 Bắt đầu giao hàng</button>';
    }
    if(taDelivering){
      taBlock += '<button class="btn ok" id="mConfirmDelivered" style="width:100%;margin-top:.5rem">🎉 Xác nhận giao thành công</button>';
    }
    if(taDelivered){
      taBlock += '<div class="svc-summary" style="border-color:var(--ok);text-align:center;margin-top:.5rem">🎉 Đơn đã giao thành công!</div>';
    }
  }
  let actionUI = "";
  if(!isTA && (actionMode === "merge" || actionMode === "transfer")){
    const isMerge = actionMode === "merge";
    const opts = visibleTables().filter(x=>x.id !== id && resolveTable(x.id) !== id)
      .map(x=>'<option value="' + x.id + '">' + x.id + (tableOrders(x.id).length ? " (có khách)" : "") + (isTableLocked(x.id) ? " 🔒" : "") + '</option>').join("");
    actionUI = '<div class="card" style="margin-top:.6rem;background:var(--bg)">' +
      '<div class="muted">' + (isMerge ? '<b>Ghép bàn</b>' : '<b>Chuyển bàn</b>') + '</div>' +
      '<select id="actionTarget" style="width:100%;margin-top:.4rem">' + opts + '</select>' +
      '<div class="row" style="margin-top:.5rem">' +
        '<button class="btn ok" id="doAction">Xác nhận</button>' +
        '<button class="btn secondary" id="cancelAction">Hủy</button>' +
      '</div></div>';
  }
  const svcEnabled = state.settings.serviceFeeEnabled !== false;
  const totalPreview = isTA ? taGrandTotal(id) : (tableTotal(id) + getTableSvcTotal(id));
  const openBtn = (!isTA && !opened) ? '<button class="btn ok" id="mOpenTable" style="width:100%;margin-top:.5rem">🔓 Mở bàn — Khách đã tới</button>' : '';
  root.innerHTML = '<div class="modal-back" id="mb"><div class="modal">' +
    '<button class="close-x" id="mc">✕</button>' +
    '<h3>' + (isTA ? '🥡 ' + id : 'Bàn ' + id) + '</h3>' +
    seated + kidLine + callLine + taBlock + bookLine + noteLine +
    (os.length ? rows : '<div class="empty">Chưa có món</div>') +
    svcLine +
    '<div class="row" style="margin-top:.7rem"><b>Tổng: ' + VND(totalPreview) + '</b>' +
      '<div style="display:flex;gap:.3rem;flex-wrap:wrap">' +
        (!isTA ? '<button class="btn secondary small" id="mNote">📌</button>' : '') +
        (!isTA ? '<button class="btn secondary small" id="mBook">📅</button>' : '') +
        (svcEnabled ? '<button class="btn secondary small" id="mSvc">➕ DV</button>' : '') +
      '</div></div>' +
    actionUI +
    openBtn +
    '<div class="row" style="margin-top:.7rem">' +
      '<button class="btn secondary small" id="mPrint" ' + (os.length ? "" : "disabled") + '>🖨️ Tạm tính</button>' +
      (!isTA ? '<button class="btn secondary small" id="mMerge" ' + (os.length ? "" : "disabled") + '>⇄ Ghép</button>' +
        '<button class="btn secondary small" id="mTransfer" ' + (os.length ? "" : "disabled") + '>🔀 Chuyển</button>' : '') +
      (isTA ? '<button class="btn secondary small" id="mEditTA">✏️</button>' : '') +
      '<button class="btn" id="mPay" ' + ((os.length || (!isTA && svcs.length)) ? "" : "disabled") + '>💳 Thanh toán</button>' +
    '</div></div></div>';
  const closeModal = ()=>{ activeModalTable=null; activeModalTA=null; actionMode=null; renderAll(); };
  document.getElementById("mc").onclick = closeModal;
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb") closeModal(); };
  root.querySelectorAll("[data-cancel]").forEach(b=>{ b.onclick = ()=> requestCancelItem(b.dataset.cancel); });
  root.querySelectorAll("[data-svc-del]").forEach(b=>b.onclick = ()=>{
    const idx = parseInt(b.dataset.svcDel);
    const arr = (isTA ? getTAServices(id) : getTableServices(id)).slice();
    if(idx < 0 || idx >= arr.length) return;
    if(!confirm("Xóa DV này?")) return;
    arr.splice(idx, 1);
    if(isTA) setTAServices(id, arr); else setTableServices(id, arr);
    renderModal(); renderAll();
  });
  root.querySelectorAll("[data-hc]").forEach(b=>b.onclick = ()=>{
    const c = state.calls.find(x=>x.id === b.dataset.hc);
    if(c){ c.handled = true; save(); renderAll(); }
  });
  document.getElementById("mPrint").onclick = ()=>printBill(id, "temp", null, null, false);
  const noteBtn = document.getElementById("mNote");
  if(noteBtn) noteBtn.onclick = ()=>openTableNoteModal(id);
  const bookBtn = document.getElementById("mBook");
  if(bookBtn) bookBtn.onclick = ()=>openBookingModal(id);
  const svcBtn = document.getElementById("mSvc");
  if(svcBtn) svcBtn.onclick = ()=>{
    if(isTA){ actionMode = "svc-ta"; renderModal(); }
    else openSvcModal(id);
  };
  const editTABtn = document.getElementById("mEditTA");
  if(editTABtn) editTABtn.onclick = ()=>openEditTAModal(id);
  const mMerge = document.getElementById("mMerge");
  if(mMerge) mMerge.onclick = ()=>{ actionMode="merge"; renderModal(); };
  const mTransfer = document.getElementById("mTransfer");
  if(mTransfer) mTransfer.onclick = ()=>{ actionMode="transfer"; renderModal(); };
  const cancelAction = document.getElementById("cancelAction");
  if(cancelAction) cancelAction.onclick = ()=>{ actionMode=null; renderModal(); };
  const openTblBtn = document.getElementById("mOpenTable");
  if(openTblBtn) openTblBtn.onclick = ()=>{
    if(!confirm("Xác nhận khách đã tới — MỞ BÀN " + id + "?")) return;
    if(!state.tableSessions[id]) state.tableSessions[id] = nowMs();
    const bk = state.bookings[id];
    if(bk && bk.locked){
      const list = (bk.groupId && bk.mergedTables && bk.mergedTables.length) ? bk.mergedTables : [id];
      list.forEach(tid=>{
        const bkk = state.bookings[tid];
        if(bkk){ bkk.locked = false; state.bookings[tid] = bkk; }
        if(!state.tableSessions[tid]) state.tableSessions[tid] = nowMs();
      });
    }
    save(); renderAll();
  };
  const bUnlock = document.getElementById("mBookUnlock");
  if(bUnlock) bUnlock.onclick = ()=>{
    if(!confirm("Xác nhận khách đã tới — Mở bàn?")) return;
    const bk = state.bookings[id]; if(!bk) return;
    const list = (bk.groupId && bk.mergedTables && bk.mergedTables.length) ? bk.mergedTables : [id];
    list.forEach(tid=>{
      const bkk = state.bookings[tid];
      if(bkk){ bkk.locked = false; state.bookings[tid] = bkk; }
      if(!state.tableSessions[tid]) state.tableSessions[tid] = nowMs();
    });
    save(); renderAll();
  };
  const bLock = document.getElementById("mBookLock");
  if(bLock) bLock.onclick = ()=>{
    const bk = state.bookings[id]; if(!bk) return;
    const list = (bk.groupId && bk.mergedTables && bk.mergedTables.length) ? bk.mergedTables : [id];
    list.forEach(tid=>{ const bkk = state.bookings[tid]; if(bkk){ bkk.locked = true; state.bookings[tid] = bkk; } });
    save(); renderAll();
  };
  const bEdit = document.getElementById("mBookEdit");
  if(bEdit) bEdit.onclick = ()=>openBookingModal(id);
  const bDel = document.getElementById("mBookDel");
  if(bDel) bDel.onclick = ()=>{
    if(!confirm("Xóa đặt bàn?")) return;
    const bk = state.bookings[id];
    const list = (bk && bk.groupId && bk.mergedTables && bk.mergedTables.length) ? bk.mergedTables : [id];
    list.forEach(t=>{ delete state.bookings[t]; });
    save(); renderAll();
  };
  // Fix #1: Nút xác nhận CK toàn đơn TA
  const confirmTABtn = document.getElementById("mConfirmTA_All");
  if(confirmTABtn) confirmTABtn.onclick = ()=>{
    closeModal();
    confirmTACheckout(id);
  };
  const startDelBtn = document.getElementById("mStartDelivery");
  if(startDelBtn) startDelBtn.onclick = ()=>{
    if(!confirm("Bắt đầu giao đơn " + id + "?")) return;
    os.forEach(o=>{
      if(o.status === "hoan_thanh"){ o.status = "dang_giao"; o.deliveryStartedAt = nowMs(); }
    });
    const m2 = getTAMeta(id);
    m2.deliveryStatus = "delivering";
    setTAMeta(id, m2);
    save(); renderAll();
  };
  const confirmDelBtn = document.getElementById("mConfirmDelivered");
  if(confirmDelBtn) confirmDelBtn.onclick = ()=>{
    if(!confirm("Xác nhận giao thành công đơn " + id + "?")) return;
    os.forEach(o=>{
      if(o.status === "dang_giao"){ o.status = "da_giao"; o.deliveredAt = nowMs(); }
    });
    const m2 = getTAMeta(id);
    m2.deliveryStatus = "delivered";
    setTAMeta(id, m2);
    save(); renderAll();
  };
  const doAction = document.getElementById("doAction");
  if(doAction) doAction.onclick = ()=>{
    const target = document.getElementById("actionTarget").value;
    if(!target) return;
    const srcReal = resolveTable(id);
    const dstReal = resolveTable(target);
    if(srcReal === dstReal){ alert("Đã cùng nhóm!"); return; }
    if(actionMode === "merge"){
      if(isTableLocked(dstReal)){ alert("Bàn đang khóa đặt trước!"); return; }
      if(!confirm("Ghép bàn " + id + " vào " + target + "?")) return;
      const s1 = state.tableSessions[srcReal], s2 = state.tableSessions[dstReal];
      const minSes = [s1,s2].filter(Boolean).sort((a,b)=>a-b)[0] || nowMs();
      state.tableSessions[dstReal] = minSes;
      state.orders.forEach(o=>{ if(o.table === srcReal) o.table = dstReal; });
      const srcSvc = getTableServices(srcReal);
      const dstSvc = getTableServices(dstReal);
      if(srcSvc.length){ setTableServices(dstReal, dstSvc.concat(srcSvc)); setTableServices(srcReal, []); }
      state.merges[srcReal] = dstReal;
      Object.keys(state.merges).forEach(k=>{ if(resolveTable(k) === srcReal && k !== srcReal) state.merges[k] = dstReal; });
      delete state.tableSessions[srcReal];
      save(); activeModalTable = dstReal; actionMode = null;
    } else {
      if(isTableLocked(dstReal)){ alert("Bàn đang khóa đặt trước!"); return; }
      if(!confirm("Chuyển món " + id + " sang " + target + "?")) return;
      state.orders.forEach(o=>{ if(o.table === srcReal) o.table = dstReal; });
      if(!state.tableSessions[dstReal] && state.tableSessions[srcReal]) state.tableSessions[dstReal] = state.tableSessions[srcReal];
      delete state.tableSessions[srcReal];
      delete state.merges[srcReal];
      save(); activeModalTable = dstReal; actionMode = null;
    }
    renderAll();
  };
  document.getElementById("mPay").onclick = ()=>{
    actionMode = "pay"; payQtys = {};
    payDiscount = {type:"", value:0, note:""};
    payLoyalty = {phone:"", name:""};
    payDeliveryFee = isTA ? (getTAMeta(id).deliveryFee || 0) : 0;
    tableOrders(id).forEach(o=>{ payQtys[o.id] = o.qty; });
    renderModal();
  };
}

/* ============================================================
   MULTI-SERVICE MODAL (Bàn)
   ============================================================ */
function openSvcModal(tableId){
  const cur = getTableServices(tableId).slice();
  svcDraft = cur.length ? cur.map(x=>({...x})) : [{id: uid("sv"), note:"", price:0, billable:true, ts: nowMs()}];
  renderSvcModalInner(tableId, false);
}
// Fix #2: Service modal cho TA
function renderSvcTAModal(){
  const taId = activeModalTA;
  const cur = getTAServices(taId).slice();
  svcDraft = cur.length ? cur.map(x=>({...x})) : [{id: uid("sv"), note:"", price:0, billable:true, ts: nowMs()}];
  renderSvcModalInner(taId, true);
}
function renderSvcModalInner(id, isTA){
  const root = document.getElementById("modalRoot");
  modalLocked = true;
  root.innerHTML = '<div class="modal-back" id="mb"><div class="modal" style="max-width:600px">' +
    '<button class="close-x" id="mc">✕</button>' +
    '<h3>➕ Dịch vụ — ' + (isTA ? 'Đơn ' + id : 'Bàn ' + id) + '</h3>' +
    '<div class="muted tiny">Thêm nhiều DV. Bỏ tích "Tính phí" cho DV miễn phí.</div>' +
    '<div id="svcRows" style="margin-top:.6rem"></div>' +
    '<button type="button" class="btn secondary small" id="svcAdd" style="margin-top:.5rem">+ Thêm dòng</button>' +
    '<div class="row" style="margin-top:.8rem;border-top:1px dashed var(--border);padding-top:.5rem">' +
      '<b>Tổng tính phí:</b><b id="svcTotal" style="color:var(--money);font-size:1.1rem">' + VND(0) + '</b>' +
    '</div>' +
    '<div class="row" style="margin-top:.8rem">' +
      '<button class="btn secondary" id="svcCancel">← Quay lại</button>' +
      '<button class="btn ok" id="svcSave">💾 Lưu</button>' +
    '</div>' +
    ((isTA ? getTAServices(id) : getTableServices(id)).length ? '<button class="btn danger small" id="svcClearAll" style="width:100%;margin-top:.4rem">🗑️ Xóa tất cả</button>' : '') +
    '</div></div>';
  function renderRows(){
    const box = document.getElementById("svcRows");
    box.innerHTML = svcDraft.map((s,i)=>
      '<div style="padding:.5rem .3rem;border-bottom:1px dashed var(--border)">' +
        '<div style="display:flex;gap:.4rem;align-items:center">' +
          '<input data-sf="note" data-i="' + i + '" placeholder="Tên DV" value="' + esc(s.note||"") + '" style="flex:1" autocomplete="off">' +
          '<button class="row-del" data-sd="' + i + '" style="background:none;border:none;color:var(--danger);font-size:1rem;cursor:pointer">✕</button>' +
        '</div>' +
        '<div style="display:flex;gap:.4rem;align-items:center;margin-top:.35rem">' +
          '<input type="number" data-sf="price" data-i="' + i + '" min="0" step="1000" value="' + (Number(s.price)||0) + '" style="flex:1">' +
          '<label style="display:flex;gap:.25rem;align-items:center;font-size:.78rem;flex:0 0 auto">' +
            '<input type="checkbox" data-sf="billable" data-i="' + i + '" ' + (s.billable !== false ? 'checked':'') + ' style="width:auto"> Tính phí' +
          '</label>' +
        '</div>' +
      '</div>'
    ).join("");
    updateTotal();
    box.querySelectorAll("[data-sf]").forEach(el=>{
      el.oninput = el.onchange = ()=>{
        const i = parseInt(el.dataset.i);
        const f = el.dataset.sf;
        if(!svcDraft[i]) return;
        if(f === "billable") svcDraft[i][f] = el.checked;
        else if(f === "price") svcDraft[i][f] = Math.max(0, parseInt(el.value)||0);
        else svcDraft[i][f] = el.value;
        updateTotal();
      };
    });
    box.querySelectorAll("[data-sd]").forEach(b=>b.onclick = ()=>{
      const i = parseInt(b.dataset.sd);
      svcDraft.splice(i, 1);
      if(!svcDraft.length) svcDraft.push({id: uid("sv"), note:"", price:0, billable:true, ts: nowMs()});
      renderRows();
    });
  }
  function updateTotal(){
    const total = svcDraft.reduce((s,x)=>s + (x.billable === false ? 0 : (Number(x.price)||0)), 0);
    const el = document.getElementById("svcTotal");
    if(el) el.textContent = VND(total);
  }
  renderRows();
  document.getElementById("mc").onclick = ()=>{ actionMode=null; modalLocked=false; root.innerHTML=""; renderAll(); };
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb"){ actionMode=null; modalLocked=false; root.innerHTML=""; renderAll(); } };
  document.getElementById("svcCancel").onclick = ()=>{ actionMode=null; modalLocked=false; root.innerHTML=""; renderModal(); };
  document.getElementById("svcAdd").onclick = ()=>{
    svcDraft.push({id: uid("sv"), note:"", price:0, billable:true, ts: nowMs()});
    renderRows();

function requestCancelItem(orderId){
  const o = state.orders.find(x=>x.id === orderId);
  if(!o) return;
  const isDone = o.status === "hoan_thanh" || o.status === "da_giao";
  const isCooking = o.status === "dang_lam";
  const isPendingCK = o.status === "cho_ck";
  const isDelivering = o.status === "dang_giao";
  if(isDone){
    if(!isManager()){ alert("Cần QL xác nhận."); return; }
    if(!confirm('Món đã hoàn thành. Hủy sẽ HOÀN LẠI NGUYÊN LIỆU. Tiếp tục?')) return;
    const pin = prompt("PIN QL:");
    if(pin !== state.settings.managerPin){ alert("Sai PIN!"); return; }
  } else if(isCooking){
    if(!isManager()){
      const pin = prompt("Món đang chế biến. PIN QL:");
      if(pin !== state.settings.managerPin){ alert("Sai PIN!"); return; }
    }
    if(!confirm('Món đang chế biến. Hủy vẫn tính phí NVL đã dùng?')) return;
  } else if(isPendingCK || isDelivering){
    if(!confirm('Đơn đang ' + (isPendingCK?'chờ CK':'giao') + '. Hủy đơn này?')) return;
  } else {
    if(!confirm('Hủy "' + o.name + '" ×' + o.qty + '?')) return;
    if(state.settings.cancelApproval && !isManager()){
      const pin = prompt("PIN QL:");
      if(pin !== state.settings.managerPin){ alert("Sai PIN!"); return; }
    }
  }
  if(o.deducted && !isCooking){
    const m = state.menu.find(x=>x.id === o.itemId);
    if(m && m.recipe && m.recipe.length){
      m.recipe.forEach(r=>{
        const ing = state.ingredients.find(i=>i.id === r.ingId);
        if(ing) ing.stock = +(ing.stock + r.qty*o.qty).toFixed(3);
      });
    }
  }
  state.orders = state.orders.filter(x=>x.id !== orderId);
  save(); renderAll();
}

      '<b>💳 QR thanh toán</b>' +
      '<img id="payQrImg" src="' + qrUrl + '" class="qr-clickable" data-qr-zoom="' + qrUrl + '" style="width:200px;height:200px;margin:.5rem auto;display:block;background:#fff;border-radius:10px;border:1px solid var(--border);padding:4px" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';document.getElementById(\'payQrFallback\').style.display=\'\'">' +
      '<div id="payQrFallback" style="display:none" class="empty tiny">⚠️ Không tải được QR</div>' +
      '<div class="svc-summary" style="border-color:var(--money);text-align:left;margin-top:.4rem">' +
        '<div class="row"><span>🏦 NH:</span><b>' + esc(bankName) + '</b></div>' +
        '<div class="row"><span>💳 STK:</span><b>' + esc(b.accountNumber||"—") + '</b> <button class="pillbtn" id="payCopySTK" style="font-size:.62rem;padding:.12rem .35rem;background:var(--primary);border:none;color:#fff">📋</button></div>' +
        '<div class="row"><span>👤 Chủ TK:</span><b>' + esc(b.accountHolder||"— chưa nhập —") + '</b></div>' +
      '</div>' +
    '</div>';
  })() : '';
  root.innerHTML = '<div class="modal-back" id="mb"><div class="modal">' +
    '<button class="close-x" id="mc">✕</button>' +
    '<h3>' + title + '</h3>' + taLine +
    '<div class="muted tiny">Chỉnh số lượng thực tế trước khi chốt.</div>' +
    '<div style="margin-top:.6rem">' + os.map(lineHtml).join("") + '</div>' +
    (svcsBillable.length ? '<div class="svc-summary"><div class="row" style="margin-bottom:.3rem"><b>➕ Dịch vụ</b></div>' +
      svcsBillable.map(s=>'<div class="svc-item"><span>' + esc(s.note||"DV") + '</span><span><b>' + VND(s.price) + '</b></span></div>').join("") + '</div>' : '') +
    // Fix #7: NV nhập phí giao cho TA
    (isTADelivery ? '<div class="svc-summary" style="border-color:var(--ta)">' +
      '<div class="row"><b>🛵 Phí giao hàng (NV nhập)</b></div>' +
      '<div style="display:flex;gap:.4rem;align-items:center;margin-top:.3rem">' +
        '<input type="number" id="payDeliveryFeeInput" min="0" step="1000" value="' + (payDeliveryFee||0) + '" style="flex:1;font-size:1rem;font-weight:700">' +
        '<button class="btn small secondary" data-feepreset="0">0</button>' +
        '<button class="btn small secondary" data-feepreset="15000">15K</button>' +
        '<button class="btn small secondary" data-feepreset="20000">20K</button>' +
        '<button class="btn small secondary" data-feepreset="30000">30K</button>' +
      '</div>' +
      '<div class="tiny muted" style="margin-top:.2rem">Phí giao có thể khác nhau tùy khoảng cách</div>' +
    '</div>' : '') +
    '<div class="discount-row" style="margin-top:.6rem">' +
      '<select id="payDiscType">' +
        '<option value="" ' + (payDiscount.type===''?'selected':'') + '>— Giảm —</option>' +
        '<option value="percent" ' + (payDiscount.type==='percent'?'selected':'') + '>Theo %</option>' +
        '<option value="amount" ' + (payDiscount.type==='amount'?'selected':'') + '>Theo tiền</option>' +
      '</select>' +
      '<input type="number" id="payDiscValue" min="0" value="' + (payDiscount.value||0) + '" placeholder="Giá trị" ' + (payDiscount.type===''?'disabled':'') + '>' +
    '</div>' +
    loyaltyHtml +
    bankInfoHtml +
    '<div style="margin-top:.8rem;background:var(--bg);padding:.6rem;border-radius:8px">' +
      '<div class="row"><span>Tạm tính:</span><b id="paySub">' + VND(tt.sub) + '</b></div>' +
      (isTADelivery && tt.df > 0 ? '<div class="row"><span>− Trong đó phí giao:</span><b>' + VND(tt.df) + '</b></div>' : '') +
      (payDiscount.type ? '<div class="row"><span style="color:var(--danger)">− Giảm:</span><b id="payDiscLine" style="color:var(--danger)">' + VND(tt.disc) + '</b></div>' : '') +
      (taxEnabled ? '<div class="row"><span>VAT ' + taxRate + '%:</span><b id="payTax">' + VND(tt.tax) + '</b></div>' : '') +
      '<div class="row" style="font-size:1.15rem;margin-top:.3rem;border-top:1px solid var(--border);padding-top:.35rem"><b>TỔNG:</b><b id="payTotal">' + VND(tt.total) + '</b></div>' +
    '</div>' +
    '<div class="row" style="margin-top:.7rem">' +
      '<button class="btn secondary" id="payCancel">← Quay lại</button>' +
      '<button class="btn warn" id="payLockTemp">📝 Tạm tính</button>' +
    '</div>' +
    '<div class="row" style="margin-top:.4rem"><button class="btn ok" style="width:100%" id="payConfirm">✓ Xác nhận & đóng ' + (isTA?'đơn':'bàn') + '</button></div>' +
  '</div></div>';
  document.getElementById("mc").onclick = ()=>{ actionMode=null; renderModal(); };
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb"){ actionMode=null; renderModal(); } };
  document.getElementById("payCancel").onclick = ()=>{ actionMode=null; renderModal(); };
  function updateTotals(){
    const ntt = calcTotals();
    document.getElementById("paySub").textContent = VND(ntt.sub);
    const dl = document.getElementById("payDiscLine"); if(dl) dl.textContent = VND(ntt.disc);
    const tEl = document.getElementById("payTax"); if(tEl) tEl.textContent = VND(ntt.tax);
    document.getElementById("payTotal").textContent = VND(ntt.total);
    const qrImg = document.getElementById("payQrImg");
    if(qrImg){
      qrImg.src = buildBankQrUrl(ntt.total, "Thanh toan " + id);
      qrImg.dataset.qrZoom = qrImg.src;
    }
  }
  root.querySelectorAll("[data-p]").forEach(el=>{
    const handler = ()=>{
      const oid = el.dataset.id;
      if(el.dataset.p === "inc") payQtys[oid] = (payQtys[oid]||0)+1;
      else if(el.dataset.p === "dec") payQtys[oid] = Math.max(0,(payQtys[oid]||0)-1);
      else if(el.dataset.p === "inp") payQtys[oid] = Math.max(0, parseInt(el.value)||0);
      const o = os.find(x=>x.id === oid);
      if(o){
        const q = payQtys[oid];
        el.closest(".payrow").querySelector(".price").innerHTML = VND(o.price) + ' × <b>' + q + '</b> = <b>' + VND(q*o.price) + '</b>';
        updateTotals();
      }
    };
    if(el.tagName === "INPUT"){ el.oninput = handler; el.onchange = handler; }
    else el.onclick = handler;
  });
  // Fix #7: Input phí giao
  const feeInput = document.getElementById("payDeliveryFeeInput");
  if(feeInput) feeInput.oninput = ()=>{ payDeliveryFee = Math.max(0, parseInt(feeInput.value)||0); updateTotals(); };
  root.querySelectorAll("[data-feepreset]").forEach(b=>b.onclick = ()=>{
    payDeliveryFee = parseInt(b.dataset.feepreset);
    if(feeInput) feeInput.value = payDeliveryFee;
    updateTotals();
  });
  const discTypeEl = document.getElementById("payDiscType");
  const discValEl = document.getElementById("payDiscValue");
  discTypeEl.onchange = ()=>{ payDiscount.type = discTypeEl.value; discValEl.disabled = !payDiscount.type; updateTotals(); };
  discValEl.oninput = ()=>{ payDiscount.value = Math.max(0, parseFloat(discValEl.value)||0); updateTotals(); };
  const lp = document.getElementById("payLoyaltyPhone");
  const ln = document.getElementById("payLoyaltyName");
  if(lp){ lp.oninput = ()=>{ payLoyalty.phone = lp.value.replace(/\s/g,''); }; lp.onchange = ()=> renderPayModal(); }
  if(ln) ln.oninput = ()=>{ payLoyalty.name = ln.value; };
  // Copy STK
  const copySTK = document.getElementById("payCopySTK");
  if(copySTK) copySTK.onclick = ()=>{
    const stk = state.settings.bank.accountNumber || "";
    copyText(stk).then(()=>{
      copySTK.textContent = "✓";
      setTimeout(()=>{ copySTK.textContent = "📋"; }, 1500);
    }).catch(()=>alert("STK: " + stk));
  };
  // Zoom QR
  root.querySelectorAll("[data-qr-zoom]").forEach(img=>{
    img.onclick = ()=>{
      const url = img.dataset.qrZoom;
      if(!url) return;
      const zoom = document.createElement("div");
      zoom.className = "qr-zoom-modal";
      zoom.innerHTML = '<img src="' + url + '" referrerpolicy="no-referrer">';
      zoom.onclick = ()=> zoom.remove();
      document.body.appendChild(zoom);
    };
  });
  document.getElementById("payLockTemp").onclick = ()=>{
    const items = [];
    os.forEach(o=>{
      const q = payQtys[o.id] ?? o.qty;
      if(q > 0){
        const m = state.menu.find(x=>x.id === o.itemId);
        items.push({name:o.name, qty:q, price:o.price, cost: m ? itemCost(m) : 0, note:o.note||"", itemId:o.itemId});
      }
    });
    const df = isTADelivery ? (Number(payDeliveryFee)||0) : 0;
    const sub = items.reduce((s,i)=>s+i.qty*i.price,0) + svcTotal + df;
    const code = genInvoiceCode(Date.now());
    state.invoices.push({
      id: uid("hd"), code: code, table:id, subtotal:sub, tax:0, total:sub, ts:nowMs(), items,
      servicePrice: svcTotal, services: svcs, deliveryFee: df, isTakeaway: isTA, type:"pending", status:"unpaid"
    });
    if(isTA && isTADelivery){
      const m2 = getTAMeta(id); m2.deliveryFee = df; setTAMeta(id, m2);
    }
    save();
    printBill(id, "pending", Object.assign(items, {}), sub, true);
    alert("Đã in phiếu tạm tính.");
    actionMode=null; renderModal();
  };
  document.getElementById("payConfirm").onclick = ()=>{
    const items = [];
    os.forEach(o=>{
      const q = payQtys[o.id] ?? o.qty;
      if(q > 0){
        const m = state.menu.find(x=>x.id === o.itemId);
        items.push({name:o.name, qty:q, price:o.price, cost: m ? itemCost(m) : 0, note:o.note||"", itemId:o.itemId});
      }
    });
    const df = isTADelivery ? (Number(payDeliveryFee)||0) : 0;
    const sub = items.reduce((s,i)=>s+i.qty*i.price, 0) + svcTotal + df;
    let disc = 0;
    if(payDiscount.type === "percent") disc = Math.round(sub * Math.min(100, Math.max(0, payDiscount.value)) / 100);
    else if(payDiscount.type === "amount") disc = Math.min(sub, Math.max(0, payDiscount.value));
    const afterDisc = Math.max(0, sub - disc);
    const tax = Math.round(afterDisc * taxRate / 100);
    const total = afterDisc + tax;
    if(!confirm('Xác nhận thanh toán ' + (isTA?'đơn '+id:'bàn '+id) + ': ' + VND(total) + (disc>0?' (giảm ' + VND(disc) + ')':'') + '?')) return;
    // Fix #7: Lưu phí giao
    if(isTA && isTADelivery){
      const m2 = getTAMeta(id);
      m2.deliveryFee = df;
      m2.deliveryFeeConfirmed = true;
      setTAMeta(id, m2);
    }
    state.invoices.forEach(inv=>{
      if(inv.table === id && inv.type === "pending" && !inv.superseded){ inv.superseded = true; inv.status = "superseded"; }
    });
    const code = genInvoiceCode(Date.now());
    state.invoices.push({
      id: uid("hd"), code: code, table:id, subtotal:sub, discount: disc, discountType: payDiscount.type,
      tax, taxRate, total, ts:nowMs(), items, servicePrice: svcTotal, services: svcs,
      deliveryFee: df, customerPhone: payLoyalty.phone || "",
      isTakeaway: isTA, type:"final", status:"paid"
    });
    if(loyaltyEnabled && payLoyalty.phone){
      const cur = state.customers[payLoyalty.phone] || {name:"", totalSpent:0, lastVisit:0};
      cur.name = (payLoyalty.name || cur.name || "").slice(0,40);
      cur.totalSpent = (cur.totalSpent||0) + total;
      cur.lastVisit = nowMs();
      state.customers[payLoyalty.phone] = cur;
    }
    state.orders = state.orders.filter(o=>o.table !== id);
    if(isTA){
      delete state.tableSessions[id];
      delete state.takeawayMeta[id];
    } else {
      Object.keys(state.merges).forEach(k=>{ if(resolveTable(k) === id){ delete state.merges[k]; delete state.tableSessions[k]; }});
      delete state.tableSessions[id];
      delete state.tableServices[id];
      delete state.tableNotes[id];
      delete state.bookings[id];
    }
    state.calls.forEach(c=>{ if(c.table === id) c.handled = true; });
    archiveOldInvoices();
    activeModalTable = null; activeModalTA = null; actionMode = null;
    save(); renderAll();
    setTimeout(()=>{
      if(confirm("In hóa đơn?")) printBill(id, "final", Object.assign(items, {}), total, true, {amount: disc});
    }, 200);
  };
}

function openTakeawayQRModal(){
  const baseUrl = state.settings.qrUrlBase || (location.origin + location.pathname);
  const url = baseUrl + "?table=TAKEAWAY";
  const custom = state.qrTakeaway || qrImagesCache["TAKEAWAY"] || "";
  const root = document.getElementById("modalRoot");
  modalLocked = true;
  let qrImg = "";
  if(custom){
    qrImg = '<img src="' + esc(custom.startsWith("data:") ? custom : proxiedImgUrl(custom)) + '" referrerpolicy="no-referrer" style="max-width:100%;max-height:280px;border-radius:8px">';
  } else {
    try{ const qr = qrcode(0,"M"); qr.addData(url); qr.make(); qrImg = qr.createImgTag(5,5); }catch(e){}
  }
  const bank = state.settings.bank;
  const bankName = (BANK_LIST.find(x=>x.id===bank.bankId)||{}).name || bank.bankId;
  root.innerHTML = '<div class="modal-back" id="mb"><div class="modal"><button class="close-x" id="mc">✕</button>' +
    '<h3>🥡 QR Đặt mang về</h3>' +
    '<div class="muted tiny">Khách quét QR này để đặt món mang về, không cần bàn.</div>' +
    '<div style="text-align:center;margin:.8rem 0">' +
      '<div style="background:#fff;padding:10px;border-radius:12px;display:inline-block;border:1px solid var(--border)">' + qrImg + '</div>' +
    '</div>' +
    '<div class="tiny" style="text-align:center;word-break:break-all;color:var(--muted);margin-bottom:.4rem">' + esc(url) + '</div>' +
    (custom ? '<div class="tiny" style="color:var(--money);text-align:center">✓ Đang dùng ảnh QR tùy chỉnh</div>' : '') +
    (isBankConfigured() ? '<div class="svc-summary" style="border-color:var(--money);margin-top:.5rem">' +
      '<div class="row"><b>💳 Thông tin CK (khách quét mã QR trên để tự CK)</b></div>' +
      '<div class="row"><span>🏦 NH:</span><b>' + esc(bankName) + '</b></div>' +
      '<div class="row"><span>💳 STK:</span><b>' + esc(bank.accountNumber||"—") + '</b> <button class="pillbtn" id="tqCopySTK" style="font-size:.62rem;padding:.12rem .35rem;background:var(--primary);border:none;color:#fff">📋 Copy</button></div>' +
      '<div class="row"><span>👤 Chủ TK:</span><b>' + esc(bank.accountHolder||"—") + '</b></div>' +
    '</div>' : '') +
    '<div class="row" style="margin-top:.7rem;gap:.3rem;flex-wrap:wrap">' +
      '<label class="btn small secondary" style="cursor:pointer;margin:0;flex:1">🖼️ Upload ảnh<input type="file" id="tqUpload" accept="image/*" style="display:none"></label>' +
      '<button class="btn small warn" id="tqUrl" style="flex:1">🔗 Nhập URL</button>' +
      (custom ? '<button class="btn small danger" id="tqRemove" style="flex:1">🗑️ Xoá ảnh</button>' : '') +
    '</div>' +
    '<div class="row" style="margin-top:.5rem;gap:.3rem">' +
      '<button class="btn secondary" id="tqClose" style="flex:1">← Đóng</button>' +
      '<button class="btn" id="tqPrint" style="flex:1">🖨️ In</button>' +
      '<button class="btn ok" id="tqCopy" style="flex:1">📋 Copy link</button>' +
    '</div>' +
  '</div></div>';
  const close = ()=>{ modalLocked = false; root.innerHTML = ""; renderAll(); };
  document.getElementById("mc").onclick = close;
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb") close(); };
  document.getElementById("tqClose").onclick = close;
  const upInput = document.getElementById("tqUpload");
  if(upInput) upInput.onchange = async ()=>{
    const f = upInput.files[0]; if(!f) return;
    try{
      const dataUrl = await readImageAsResizedDataUrl(f, 500, 500, 0.75);
      state.qrTakeaway = dataUrl;
      saveQrImage("TAKEAWAY", dataUrl);
      save();
      modalLocked = false; root.innerHTML = "";
      renderAll();
      openTakeawayQRModal();
      alert("✓ Đã lưu QR mang về");
    }catch(err){ alert("Lỗi đọc ảnh: " + err.message); }
  };
  document.getElementById("tqUrl").onclick = ()=>{
    const u = prompt("Dán URL ảnh QR (Imgur/Postimages):", state.qrTakeaway||"");
    if(u === null) return;
    const urlVal = u.trim();
    if(!urlVal){ alert("Chưa nhập URL"); return; }
    state.qrTakeaway = urlVal;
    saveQrImage("TAKEAWAY", urlVal);
    save();
    modalLocked = false; root.innerHTML = "";
    renderAll();
    openTakeawayQRModal();
    alert("✓ Đã lưu URL QR");
  };
  const rmBtn = document.getElementById("tqRemove");
  if(rmBtn) rmBtn.onclick = ()=>{
    if(!confirm("Xóa QR tùy chỉnh?")) return;
    state.qrTakeaway = "";
    qrImagesCache["TAKEAWAY"] = "";
    if(fbQrRef) fbQrRef.child("TAKEAWAY").remove().catch(e=>console.error(e));
    save();
    modalLocked = false; root.innerHTML = "";
    renderAll();
    openTakeawayQRModal();
  };
  // Copy STK
  const copySTKBtn = document.getElementById("tqCopySTK");
  if(copySTKBtn) copySTKBtn.onclick = ()=>{
    const stk = state.settings.bank.accountNumber || "";
    copyText(stk).then(()=>{
      copySTKBtn.textContent = "✓ Đã copy";
      setTimeout(()=>{ copySTKBtn.textContent = "📋 Copy"; }, 1500);
    }).catch(()=>alert("STK: " + stk));
  };
  document.getElementById("tqPrint").onclick = ()=>{
    const w = window.open("", "_blank");
    if(!w) return;
    const qrShow = custom
      ? '<img src="' + esc(custom.startsWith("data:") ? custom : proxiedImgUrl(custom)) + '" style="max-width:220px">'
      : (function(){ try{ const qr = qrcode(0,"M"); qr.addData(url); qr.make(); return qr.createImgTag(5,5); }catch(e){ return ""; } })();
    w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>QR Mang về</title>' +
      '<style>@page{size:80mm auto;margin:4mm}body{font-family:Arial,sans-serif;text-align:center;padding:10px;width:72mm;margin:0 auto}h2{color:#9B2A1A;margin:0 0 4px;font-size:15px}.sub{color:#333;font-size:11px;margin-bottom:10px;font-weight:700}.qr{margin:8px auto;padding:8px;border:2px solid #9B2A1A;border-radius:10px;display:inline-block;background:#FFF3E0}.url{font-size:9px;color:#555;word-break:break-all;margin-top:6px}@media print{.noprint{display:none}}</style></head><body>' +
      '<div class="noprint" style="margin-bottom:8px"><button onclick="window.print()" style="padding:6px 14px;font-size:12px">🖨️ In</button></div>' +
      '<h2>' + esc(state.brand.name) + '</h2>' +
      '<div class="sub">🥡 QUÉT QR ĐỂ ĐẶT MÓN MANG VỀ</div>' +
      '<div class="qr">' + qrShow + '</div>' +
      '<div class="url">' + esc(url) + '</div>' +
      '<script>setTimeout(()=>window.print(),500);<\/script></body></html>');
    w.document.close();
  };
  document.getElementById("tqCopy").onclick = ()=>{
    copyText(url).then(()=>alert("✓ Đã copy link")).catch(()=>alert(url));
  };
}

/* ============================================================
   QUẢN LÝ — MAIN
   ============================================================ */
let menuAdminSearch = "";
let finPeriod = "month", finFrom = "", finTo = "";
let rptPeriod = "today", rptFrom = "", rptTo = "", rptTypeFilter = "all", rptView = "overview", rankTab = "best";
let qrSelected = new Set();
let callFilterTab = "pending";

function renderQl(){
  const ael = document.getElementById("menuAdmin");
  if(ael) menuAdminScroll = ael.scrollTop;
  const subnav = document.getElementById("qlSubnav");
  const subs = [
    ["menu","🍽️ Menu"],["kho","📦 Kho"],["report","📊 Báo cáo"],["hoadon","🧾 Hóa đơn"],
    ["call","🔔 Tin"],["qr","🔗 QR"]
  ];
  if(isManager()){
    subs.splice(2, 0, ["finance","💰 Tài chính"]);
    subs.push(["customer","👥 Khách"]);
    subs.push(["settings","⚙️ Cài đặt"]);
  }
  if(!subs.find(s=>s[0] === currentQlTab)) currentQlTab = "menu";
  subnav.innerHTML = subs.map(([id,label])=>'<button class="' + (id===currentQlTab?'active':'') + '" data-sub="' + id + '">' + label + '</button>').join("");
  subnav.querySelectorAll("button").forEach(b=>{ b.onclick = ()=>{ currentQlTab = b.dataset.sub; renderQl(); }; });
  const content = document.getElementById("qlContent");
  content.innerHTML = "";
  if(currentQlTab === "menu") renderQlMenu(content);
  else if(currentQlTab === "kho") renderQlKho(content);
  else if(currentQlTab === "finance") renderQlFinance(content);
  else if(currentQlTab === "report") renderQlReport(content);
  else if(currentQlTab === "hoadon") renderQlHoadon(content);
  else if(currentQlTab === "call") renderQlCall(content);
  else if(currentQlTab === "qr") renderQlQr(content);
  else if(currentQlTab === "customer") renderQlCustomer(content);
  else if(currentQlTab === "settings") renderQlSettings(content);
}
function renderQlMenu(el){
  const showFin = canSeeFinance();
  const search = menuAdminSearch.trim().toLowerCase();
  el.innerHTML = '<div class="card"><div class="row"><b>🍽️ Quản lý menu</b>' +
    '<div style="display:flex;gap:.3rem">' +
      '<button class="btn small secondary" id="btnAddCat" ' + (isManager()?"":"disabled") + '>+ Danh mục</button>' +

      '<tbody id="bulkBody"></tbody>' +
    '</table></div>' +

      '<b>Tổng:</b><b id="bulkTotal" style="color:var(--money);font-size:1.1rem">0đ</b>' +
    '</div>' +
    '<label class="fl">NCC <input id="bulkSupplier" placeholder="VD: Chị Hoa - chợ đầu mối" autocomplete="off"></label>' +
    '<div class="row" style="margin-top:.8rem">' +
      '<button class="btn secondary" id="bulkCancel">Hủy</button>' +
      '<button class="btn money" id="bulkSave">💾 Lưu & cập nhật kho</button>' +
    '</div>' +
  '</div></div>';
  function renderBody(){
    const body = document.getElementById("bulkBody");
    body.innerHTML = purchaseDraft.map((p,i)=>{
      const opts = state.ingredients.map(ing=>'<option value="' + ing.id + '" ' + (p.ingId===ing.id?'selected':'') + '>' + esc(ing.name) + ' (' + esc(ing.unit) + ')</option>').join("");
      const total = (Number(p.qty)||0) * (Number(p.unitPrice)||0);
      return '<tr>' +
        '<td><select data-bf="ingId" data-i="' + i + '">' + opts + '</select></td>' +
        '<td><input type="number" data-bf="qty" data-i="' + i + '" min="0" step="0.1" value="' + (p.qty||0) + '"></td>' +
        '<td><input type="number" data-bf="unitPrice" data-i="' + i + '" min="0" step="1000" value="' + (p.unitPrice||0) + '"></td>' +
        '<td class="bulk-total" data-i="' + i + '" style="text-align:right;font-weight:700;color:var(--money)">' + VND(total) + '</td>' +
        '<td><button class="row-del" data-bd="' + i + '">✕</button></td>' +
      '</tr>';
    }).join("");
    updateTotal();
    body.querySelectorAll("[data-bf='ingId']").forEach(sel=>{
      sel.onchange = ()=>{
        const i = parseInt(sel.dataset.i);
        if(!purchaseDraft[i]) return;
        purchaseDraft[i].ingId = sel.value;
        const ing = state.ingredients.find(x=>x.id === sel.value);
        if(ing){
          purchaseDraft[i].unitPrice = ing.price || 0;
          const row = sel.closest("tr");
          const priceInp = row.querySelector("[data-bf='unitPrice']");
          if(priceInp) priceInp.value = ing.price || 0;
          updateRowTotal(i);
        }
        updateTotal();
      };
    });
    body.querySelectorAll("[data-bf='qty'], [data-bf='unitPrice']").forEach(inp=>{
      inp.oninput = ()=>{
        const i = parseInt(inp.dataset.i);
        const f = inp.dataset.bf;
        if(!purchaseDraft[i]) return;
        purchaseDraft[i][f] = Math.max(0, parseFloat(inp.value)||0);
        updateRowTotal(i);
        updateTotal();
      };
    });
    body.querySelectorAll("[data-bd]").forEach(b=>b.onclick = ()=>{
      const i = parseInt(b.dataset.bd);
      purchaseDraft.splice(i, 1);
      if(!purchaseDraft.length){
        const f = state.ingredients[0];
        purchaseDraft.push({ingId: f ? f.id : "", qty:1, unitPrice: f ? f.price : 0});
      }
      renderBody();
    });
  }
  function updateRowTotal(i){
    const cell = document.querySelector('.bulk-total[data-i="' + i + '"]');
    if(!cell || !purchaseDraft[i]) return;
    const t = (Number(purchaseDraft[i].qty)||0) * (Number(purchaseDraft[i].unitPrice)||0);
    cell.textContent = VND(t);
  }
  function updateTotal(){
    const t = purchaseDraft.reduce((s,p)=>s + (Number(p.qty)||0)*(Number(p.unitPrice)||0), 0);
    const el = document.getElementById("bulkTotal");
    if(el) el.textContent = VND(t);
  }
  renderBody();
  document.getElementById("mc").onclick = ()=>{ modalLocked=false; root.innerHTML=""; renderAll(); };
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb"){ modalLocked=false; root.innerHTML=""; renderAll(); } };
  document.getElementById("bulkCancel").onclick = ()=>{ modalLocked=false; root.innerHTML=""; renderAll(); };
  document.getElementById("bulkAdd").onclick = ()=>{
    const f = state.ingredients[0];
    purchaseDraft.push({ingId: f ? f.id : "", qty:1, unitPrice: f ? f.price : 0});
    renderBody();
  };
  document.getElementById("bulkSave").onclick = ()=>{
    const supplier = document.getElementById("bulkSupplier").value.trim();
    const cleaned = purchaseDraft.filter(p=>p.ingId && (Number(p.qty)||0) > 0 && (Number(p.unitPrice)||0) > 0);
    if(!cleaned.length){ alert("Chưa có dòng hợp lệ"); return; }
    const now = nowMs();
    let total = 0;
    cleaned.forEach(p=>{
      const ing = state.ingredients.find(i=>i.id === p.ingId);
      if(!ing) return;
      const lineTotal = Math.round((Number(p.qty)||0)*(Number(p.unitPrice)||0));
      total += lineTotal;
      state.purchases.push({
        id: uid("pu"), ts: now, ingId: p.ingId, ingName: ing.name, unit: ing.unit,
        qty: p.qty, unitPrice: p.unitPrice, total: lineTotal,
        supplier: supplier, by: isManager() ? "manager" : "staff"
      });
      ing.stock = +(ing.stock + (Number(p.qty)||0)).toFixed(3);
      ing.price = Number(p.unitPrice)||0;
    });
    save();
    modalLocked = false; root.innerHTML = "";
    alert("✓ Đã lưu " + cleaned.length + " dòng — Tổng: " + VND(total));
    renderAll();
  };
}

/* ============================================================
   TÀI CHÍNH
   ============================================================ */
function finGetRange(period, from, to){
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(period === "today") return [todayStart.getTime(), todayStart.getTime() + 86400000 - 1];
  if(period === "week"){ const dow = now.getDay() || 7; const s = new Date(todayStart.getTime() - (dow-1)*86400000); return [s.getTime(), s.getTime() + 7*86400000 - 1]; }
  if(period === "month"){ const s = new Date(now.getFullYear(), now.getMonth(), 1); const e = new Date(now.getFullYear(), now.getMonth()+1, 1).getTime() - 1; return [s.getTime(), e]; }
  if(period === "year"){ const s = new Date(now.getFullYear(), 0, 1); const e = new Date(now.getFullYear()+1, 0, 1).getTime() - 1; return [s.getTime(), e]; }
  if(period === "all") return [0, now.getTime() + 86400000];
  if(period === "custom" && from && to) return [new Date(from).getTime(), new Date(to).getTime() + 86400000 - 1];
  return [todayStart.getTime(), now.getTime()];
}
function daysInRange(a,b){ return Math.max(1, Math.round(Math.max(1, b-a) / 86400000)); }
function recurringCostForRange(fromTs, toTs){
  const days = daysInRange(fromTs, toTs);
  const monthlyTotal = (state.recurringExpenses||[]).reduce((s,r)=>s + (Number(r.amount)||0), 0);
  if(monthlyTotal <= 0) return { total: 0, days, monthlyTotal, dailyAvg: 0 };
  const dailyAvg = monthlyTotal / 30;
  return { total: Math.round(dailyAvg * days), days, monthlyTotal, dailyAvg };
}
function invoicesForRange(fromTs, toTs){
  const now = Date.now();
  const cutoff = now - 90 * 86400000;
  const invs = [];
  toArr(state.invoices).forEach(inv=>{
    if(inv.ts >= fromTs && inv.ts <= toTs && inv.type === "final" && !inv.superseded) invs.push(inv);
  });
  if(fromTs < cutoff){
    Object.entries(state.monthlySummary || {}).forEach(([key, s])=>{
      const [y, m] = key.split("-").map(Number);
      const mStart = new Date(y, m-1, 1).getTime();
      const mEnd = new Date(y, m, 1).getTime() - 1;
      if(mEnd < fromTs || mStart > toTs) return;
      if(mStart >= cutoff) return;
      invs.push({_summary: true, ts: mStart, total: s.revenue||0, _cogs: s.cogs||0, _items: s.items||0, items: [], type:"final"});
    });
  }
  return invs;
}
function calcFinance(fromTs, toTs){
  const invs = invoicesForRange(fromTs, toTs);
  const revenue = invs.reduce((s,i) => s + (Number(i.total)||0), 0);
  const cogs = invs.reduce((s,i) => {
    if(i._summary) return s + (i._cogs||0);
    return s + toArr(i.items).reduce((a,x) => a + (x.qty||0) * (x.cost||0), 0);
  }, 0);
  const purchases = state.purchases.filter(p => p.ts >= fromTs && p.ts <= toTs);
  const totalPurchase = purchases.reduce((s,p) => s + (Number(p.total)||0), 0);
  const expenses = state.expenses.filter(e => e.ts >= fromTs && e.ts <= toTs);
  const totalExpense = expenses.reduce((s,e) => s + (Number(e.amount)||0), 0);
  const rec = recurringCostForRange(fromTs, toTs);
  const netProfit = revenue - cogs - totalExpense - rec.total;
  const allRevenue = state.invoices.filter(i => i.type === "final" && !i.superseded && i.ts <= toTs).reduce((s,i)=>s+(Number(i.total)||0),0)
    + Object.values(state.monthlySummary||{}).reduce((s,x)=>s+(x.revenue||0),0);
  const allPurchase = state.purchases.filter(p => p.ts <= toTs).reduce((s,p)=>s+(Number(p.total)||0),0);
  const allExpense = state.expenses.filter(e => e.ts <= toTs).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const allRecurring = recurringCostForRange(0, toTs).total;
  const balance = (state.settings.openingBalance || 0) + allRevenue - allPurchase - allExpense - allRecurring;
  return {
    revenue, cogs, grossProfit: revenue - cogs, purchases, expenses,
    totalPurchase, totalExpense, totalRecurring: rec.total, rec,
    days: rec.days, netProfit,
    netProfitPerDay: Math.round(netProfit / rec.days),
    balance
  };
}

  const isNeg = fin.netProfit < 0;
  const laborNote = state.settings.laborInPL ? 'Đang TÍNH tiền công vào COGS.' : 'KHÔNG tính tiền công vào COGS.';
  el.innerHTML = '<div class="card"><div class="row"><b>💰 Tài chính</b>' +

    '<div class="stat"><div class="n" style="color:var(--danger)">' + VND(fin.totalRecurring) + '</div><div class="l">📅 CP CĐ</div></div>' +
    '<div class="stat"><div class="n">' + VND(fin.balance) + '</div><div class="l">💼 Quỹ</div></div>' +
  '</div>' +
  '<div class="card"><b>💰 Bảng LN</b>' +
    '<div class="row" style="margin-top:.5rem"><span>DT:</span><b class="fin-money-in">' + VND(fin.revenue) + '</b></div>' +
    '<div class="row"><span>− COGS:</span><b class="fin-money-out">' + VND(fin.cogs) + '</b></div>' +
    '<div class="row" style="border-top:1px dashed var(--border);padding-top:.3rem;margin-top:.3rem"><b>= LN GỘP:</b><b style="color:var(--ok)">' + VND(fin.grossProfit) + '</b></div>' +

function calcStats(fromTs, toTs, typeFilter){
  const inv = invoicesForRange(fromTs, toTs);
  const filtered = inv.map(i=>({
    ...i,
    items: i._summary ? [] : toArr(i.items).filter(it => typeFilter === "all" || typeOfItem(it.itemId) === typeFilter)
  })).filter(i=> i._summary || i.items.length > 0);
  const revenue = filtered.reduce((s,i)=>{
    if(i._summary && typeFilter === "all") return s + (i.total||0);
    return s + i.items.reduce((a,x)=>a + x.qty*x.price, 0);
  }, 0);
  const cost = filtered.reduce((s,i)=>{
    if(i._summary && typeFilter === "all") return s + (i._cogs||0);
    return s + i.items.reduce((a,x)=>a + x.qty*(x.cost||0), 0);
  }, 0);
  const items = filtered.reduce((s,i)=>{
    if(i._summary && typeFilter === "all") return s + (i._items||0);
    return s + i.items.reduce((a,x)=>a + x.qty, 0);
  }, 0);
  const agg = {};
  filtered.forEach(i=>{
    if(i._summary) return;
    i.items.forEach(x=>{
      if(!agg[x.name]) agg[x.name] = {qty:0, rev:0, cost:0};
      agg[x.name].qty += x.qty; agg[x.name].rev += x.qty*x.price; agg[x.name].cost += x.qty*(x.cost||0);
    });
  });
  return {invoices:filtered, revenue, cost, items, agg, count:filtered.length};
}
function exportReportCSV(){
  const [fromTs, toTs] = finGetRange(rptPeriod, rptFrom, rptTo);
  const invs = invoicesForRange(fromTs, toTs).filter(i=>!i._summary);
  if(!invs.length){ alert("Kỳ này chưa có HĐ để xuất."); return; }
  let csv = "\uFEFF";
  csv += "Mã HĐ,Ngày giờ,Bàn/Kênh,Loại,Món,SL,Đơn giá,Thành tiền,Giảm giá,VAT,Tổng HĐ\n";
  invs.forEach(inv=>{
    const d = new Date(inv.ts);
    const dateStr = d.toLocaleString("vi-VN");
    toArr(inv.items).forEach(it=>{
      const name = String(it.name||"").replace(/"/g,'""');
      csv += '"' + (inv.code||"") + '","' + dateStr + '","' + inv.table + '","' + (inv.type||"") + '","' + name + '",' + (it.qty||0) + ',' + (it.price||0) + ',' + ((it.qty||0)*(it.price||0)) + ',' + (inv.discount||0) + ',' + (inv.tax||0) + ',' + (inv.total||0) + '\n';
    });
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "baocao-" + rptPeriod + "-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}
function renderQlReport(el){
  const showFin = isManager();
  const [fromTs, toTs] = finGetRange(rptPeriod, rptFrom, rptTo);
  const [prevFrom, prevTo] = finGetRange(rptPeriod, rptFrom, rptTo).map((v,i,a)=> v - (a[1]-a[0]));
  const cur = calcStats(fromTs, toTs, rptTypeFilter);
  const prev = calcStats(prevFrom, prevTo, rptTypeFilter);
  const fin = calcFinance(fromTs, toTs);
  function delta(c, p){ if(!p) return {txt:"—", cls:""}; const pct = ((c - p) / p) * 100; return {txt:(pct>=0?"▲ ":"▼ ") + Math.abs(pct).toFixed(1) + "%", cls: pct>=0 ? "up" : "down"}; }
  const dRev = delta(cur.revenue, prev.revenue);
  const dItems = delta(cur.items, prev.items);
  const byDay = {};
  cur.invoices.forEach(i=>{
    if(i._summary) return;
    const d = new Date(i.ts);
    const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    if(!byDay[k]) byDay[k] = {rev:0, cost:0, profit:0};
    const rev = i.items.reduce((a,x)=>a + x.qty*x.price, 0);
    const cost = i.items.reduce((a,x)=>a + x.qty*(x.cost||0), 0);
    byDay[k].rev += rev; byDay[k].cost += cost; byDay[k].profit += (rev - cost);
  });
  const sortedDays = Object.keys(byDay).sort();
  const maxVal = Math.max(1, ...sortedDays.flatMap(d=>[byDay[d].rev, byDay[d].cost, Math.abs(byDay[d].profit)]));
  const chartDays = sortedDays.slice(-31);
  const chartHtml = chartDays.length ? '<div class="gchart">' +
    chartDays.map(d=>{
      const v = byDay[d];
      const hR = Math.max(4, Math.round(v.rev / maxVal * 140));
      const hC = showFin ? Math.max(4, Math.round(v.cost / maxVal * 140)) : 0;
      const hP = showFin ? Math.max(4, Math.round(Math.max(0,v.profit) / maxVal * 140)) : 0;
      const day = d.slice(8) + "/" + d.slice(5,7);
      return '<div class="gday"><div style="font-size:.62rem;font-weight:700;color:var(--primary-d);text-align:center;margin-bottom:2px">' + fmtShort(v.rev) + '</div>' +
        '<div class="gbars"><div class="gbar rev" style="height:' + hR + 'px"></div>' +
        (showFin ? '<div class="gbar cost" style="height:' + hC + 'px"></div><div class="gbar profit" style="height:' + hP + 'px"></div>' : '') +
        '</div><div class="glbl">' + day + '</div></div>';
    }).join("") +
    '</div><div class="legend"><span><span class="dot rev"></span>DT</span>' +
    (showFin ? '<span><span class="dot cost"></span>Gốc</span><span><span class="dot profit"></span>Lãi</span>' : '') + '</div>'
    : '<div class="empty">Chưa có dữ liệu</div>';
  const ranking = Object.entries(cur.agg).map(([name,v])=>({name, qty:v.qty, rev:v.rev, cost:v.cost, profit: v.rev - v.cost, margin: v.rev ? (v.rev-v.cost)/v.rev*100 : 0}));
  let ranked = rankTab === "best" ? [...ranking].sort((a,b)=>b.qty - a.qty)
    : rankTab === "highProfit" ? [...ranking].filter(r=>r.profit>0).sort((a,b)=>b.profit - a.profit)
    : [...ranking].sort((a,b)=>a.qty - b.qty);
  ranked = ranked.slice(0, 15);
  const grossProfit = cur.revenue - cur.cost;
  const marginPct = cur.revenue ? Math.round(grossProfit / cur.revenue * 100) : 0;
  el.innerHTML = '<div class="card"><div class="row"><select id="rptPeriod">' +
    ['today|Hôm nay','week|Tuần','month|Tháng','year|Năm','custom|Tùy chọn'].map(s=>{ const [k,v] = s.split("|"); return '<option value="' + k + '" ' + (rptPeriod===k?'selected':'') + '>' + v + '</option>'; }).join("") +
  '</select>' +
  (rptPeriod==="custom" ? '<input type="date" id="rptFrom" value="' + rptFrom + '"><input type="date" id="rptTo" value="' + rptTo + '"><button class="btn small" id="rptApply">Xem</button>' : '') +
  '</div><div class="filter-bar" style="margin-top:.5rem">' +
    ['all|Tất cả','food|🍜 Món','beer|🍺 Bia','softdrink|🥤 Nước','service|🧂 DV'].map(s=>{ const [k,v] = s.split("|"); return '<button class="' + (rptTypeFilter===k?'active':'') + '" data-type="' + k + '">' + v + '</button>'; }).join("") +
  '</div></div>' +
  '<div class="stats">' +
    '<div class="stat"><div class="n">' + VND(cur.revenue) + '</div><div class="l">DT</div><div class="delta ' + dRev.cls + '">' + dRev.txt + '</div></div>' +
    (showFin ? '<div class="stat"><div class="n" style="color:var(--warn)">' + VND(cur.cost) + '</div><div class="l">Gốc</div></div>' +
      '<div class="stat"><div class="n" style="color:var(--ok)">' + VND(grossProfit) + '</div><div class="l">LN gộp</div><div class="delta up">' + marginPct + '%</div></div>' +
      '<div class="stat"><div class="n" style="color:' + (fin.netProfit>=0?'var(--money)':'var(--danger)') + '">' + VND(fin.netProfit) + '</div><div class="l">💰 LN ròng</div><div class="delta ' + (fin.netProfitPerDay>=0?'up':'down') + '">' + VND(fin.netProfitPerDay) + '/ngày</div></div>' : '') +
    '<div class="stat"><div class="n">' + cur.items + '</div><div class="l">Món</div><div class="delta ' + dItems.cls + '">' + dItems.txt + '</div></div>' +
  '</div>' +
  '<div class="card"><div class="row" style="margin-bottom:.3rem"><b>Chi tiết</b>' +
    '<button class="btn small money" id="btnExportCSV">📊 Xuất Excel</button></div>' +
    '<div class="filter-bar">' +
    '<button class="' + (rptView==='overview'?'active':'') + '" data-view="overview">📊 Tổng quan</button>' +
    '<button class="' + (rptView==='ranking'?'active':'') + '" data-view="ranking">🏆 Xếp hạng</button>' +
  '</div>' +
  (rptView === 'overview' ? '<b>📊 DT theo ngày</b>' + chartHtml : '') +
  (rptView === 'ranking' ? '<div class="filter-bar" style="margin-bottom:.5rem">' +
    '<button class="' + (rankTab==='best'?'active':'') + '" data-rank="best">🔥 Best</button>' +
    (showFin ? '<button class="' + (rankTab==='highProfit'?'active':'') + '" data-rank="highProfit">💰 Lãi cao</button><button class="' + (rankTab==='slow'?'active':'') + '" data-rank="slow">🐌 Chậm</button>' : '') +
    '</div>' + (ranked.length ? '<table><thead><tr><th>Món</th><th>SL</th><th>DT</th>' + (showFin?'<th>Lãi</th>':'') + '</tr></thead><tbody>' +
    ranked.map(r=>'<tr><td>' + esc(r.name) + '</td><td><b>' + r.qty + '</b></td><td>' + VND(r.rev) + '</td>' +
      (showFin?'<td style="color:' + (r.profit>=0?'var(--ok)':'var(--danger)') + '"><b>' + VND(r.profit) + '</b></td>':'') + '</tr>').join("") +
    '</tbody></table>' : '<div class="empty">Chưa có dữ liệu</div>') : '') +
  '</div>';
  document.getElementById("rptPeriod").onchange = e=>{ rptPeriod = e.target.value; renderQlReport(el); };
  const ra = document.getElementById("rptApply");
  if(ra) ra.onclick = ()=>{ rptFrom = document.getElementById("rptFrom").value; rptTo = document.getElementById("rptTo").value; renderQlReport(el); };
  el.querySelectorAll("[data-type]").forEach(b=>b.onclick = ()=>{ rptTypeFilter = b.dataset.type; renderQlReport(el); });
  el.querySelectorAll("[data-view]").forEach(b=>b.onclick = ()=>{ rptView = b.dataset.view; renderQlReport(el); });
  el.querySelectorAll("[data-rank]").forEach(b=>b.onclick = ()=>{ rankTab = b.dataset.rank; renderQlReport(el); });
  const csvBtn = document.getElementById("btnExportCSV");
  if(csvBtn) csvBtn.onclick = ()=>exportReportCSV();
}

function printQRCodes(tableIds){
  if(!tableIds.length){ alert("Chưa chọn bàn!"); return; }
  const w = window.open("", "_blank");
  if(!w){ alert("Không mở được cửa sổ in."); return; }
  const baseUrl = state.settings.qrUrlBase || (location.origin + location.pathname);
  let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>In QR</title>' +
    '<style>body{font-family:Arial,sans-serif;margin:10px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}' +
    '.cell{border:2px solid #9B2A1A;padding:10px;text-align:center;page-break-inside:avoid;border-radius:8px;background:#FFF3E0}' +
    '.cell h3{margin:0 0 6px;font-size:15px;color:#6E1A0E}.cell img{width:150px;height:150px;background:#fff;border-radius:6px;object-fit:contain}' +
    '.cell p{font-size:9px;color:#666;margin:6px 0 0;word-break:break-all}.head{text-align:center;margin-bottom:14px}.head h2{margin:0;color:#9B2A1A}' +
    '@media print{.noprint{display:none}}</style></head><body>' +
    '<div class="noprint" style="margin-bottom:8px"><button onclick="window.print()" style="padding:8px 16px;font-size:14px">🖨️ In</button></div>' +
    '<div class="head"><h2>' + esc(state.brand.name) + '</h2><div>' + esc(state.brand.sub) + '</div></div>' +
    '<div class="grid">';
  tableIds.forEach(id=>{
    const custom = state.qrImages[id] || qrImagesCache[id];
    const url = baseUrl + "?table=" + id;
    let qrImg;
    if(custom) qrImg = '<img src="' + esc(custom.startsWith("data:") ? custom : proxiedImgUrl(custom)) + '" referrerpolicy="no-referrer">';
    else { try{ const qr = qrcode(0, "M"); qr.addData(url); qr.make(); qrImg = qr.createImgTag(4,4); }catch(e){ qrImg = ""; } }
    html += '<div class="cell"><h3>BÀN ' + id + '</h3>' + qrImg + '<p>' + url + '</p></div>';
  });
  html += '</div><script>setTimeout(()=>window.print(),500);<\/script></body></html>';
  w.document.write(html); w.document.close();
}

    lines.push("🌐 Kết nối: " + (fbConnected ? "✅" : "❌"));
    try{
      const snap = await fbRef.once("value");
      lines.push("📖 Đọc: ✅ " + (snap.val() ? "OK" : "Trống"));
      await fbRef.child("__test__").set(Date.now());
      await fbRef.child("__test__").remove();
      lines.push("✍️ Ghi: ✅");
      lines.push("\n🎉 Firebase OK!");
    }catch(err){
      lines.push("\n❌ LỖI: " + (err.code || err.message));
      if(err.code === "PERMISSION_DENIED"){
        lines.push('\n👉 Firebase Console → Rules:\n{\n  "rules": {\n    ".read": true,\n    ".write": true\n  }\n}');
      }
    }
    out.textContent = lines.join("\n");

      const snap = await fbRef.once("value");
      const remote = snap.val();
      if(remote){
        suppressWrite = true;
        state = migrateState(remote);
        applyImagesCache();
        applyQrCache();
        saveLocal();
        renderAll();
        setTimeout(()=>{ suppressWrite = false; }, 500);
        alert("✓ Đã kéo");
      } else {
        await fbRef.set(deepClean(stripImagesForSync(migrateState(JSON.parse(JSON.stringify(state))))));
        alert("✓ Đã đẩy lên");
      }
    }catch(err){ alert("Lỗi: " + (err.code || err.message)); }
  };
  document.getElementById("btnExport").onclick = ()=>{

  };

    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const data = JSON.parse(r.result);

        state = migrateState(data); save(); renderAll();
      }catch(err){ alert("File không hợp lệ!"); }
    };
    r.readAsText(f);
  };
  document.getElementById("btnReset").onclick = ()=>{
    if(!confirm("XÓA TOÀN BỘ?")) return;
    state = seed(); save(); renderAll();
  };
}

      if(kb > 30){ if(!confirm("Ảnh ~" + kb + "KB. Dùng URL để nhẹ DB hơn.\nTiếp tục?")){ tempImgData = ""; return; } }
      updatePreview();
    }catch(err){ alert("Lỗi đọc ảnh"); }
  };
  const rmBtn = document.getElementById("mmImgRemove");
  if(rmBtn) rmBtn.onclick = ()=>{ if(confirm("Xoá ảnh?")){ tempImgData = ""; document.getElementById("mmImg").value = ""; updatePreview(); } };
  document.getElementById("mmEmoji").oninput = updatePreview;
  document.getElementById("mmImg").oninput = updatePreview;
  updatePreview();
  const recalc = ()=>{
    const price = Math.max(0, parseInt(document.getElementById("mmPrice").value)||0);
    const labor = Math.max(0, parseInt(document.getElementById("mmLabor").value)||0);
    const other = Math.max(0, parseInt(document.getElementById("mmOther").value)||0);
    let ing = 0;
    root.querySelectorAll("#recipeList .recipe-row").forEach(r=>{
      const ingId = r.querySelector("select[data-rf='ingId']").value;
      const qty = parseFloat(r.querySelector("input[data-rf='qty']").value) || 0;
      const i = state.ingredients.find(x=>x.id === ingId);
      if(i) ing += i.price * qty;
    });
    const laborApplied = state.settings.laborInPL ? labor : 0;
    const total = ing + laborApplied + other;
    document.getElementById("costIng").textContent = VND(ing);
    document.getElementById("costLabor").textContent = VND(labor) + (state.settings.laborInPL ? "" : " (không tính)");
    document.getElementById("costOther").textContent = VND(other);
    document.getElementById("costTotal").textContent = VND(total);
    document.getElementById("costProfit").textContent = VND(price - total);
  };
  const bindRecipe = ()=>{
    const list = document.getElementById("recipeList");
    list.querySelectorAll("[data-rrm]").forEach(b=>b.onclick = ()=>{ b.closest(".recipe-row").remove(); recalc(); });
    list.querySelectorAll("select[data-rf='ingId']").forEach(sel=>{
      sel.onchange = ()=>{
        const ing = state.ingredients.find(i=>i.id === sel.value);
        const u = sel.closest(".recipe-row").querySelector("[data-unit]");
        if(u) u.textContent = ing ? ing.unit : "";
        recalc();
      };
    });
    list.querySelectorAll("input[data-rf='qty']").forEach(inp=>inp.oninput = recalc);
  };
  bindRecipe();
  document.getElementById("btnAddIng2").onclick = ()=>{
    if(!state.ingredients.length){ alert("Chưa có NL"); return; }
    const list = document.getElementById("recipeList");
    const tmp = document.createElement("div");
    tmp.innerHTML = recipeRowHtml({ingId: state.ingredients[0].id, qty: 0.1});
    list.appendChild(tmp.firstChild);
    bindRecipe(); recalc();
  };
  document.getElementById("mmPrice").oninput = recalc;
  document.getElementById("mmLabor").oninput = recalc;
  document.getElementById("mmOther").oninput = recalc;
  recalc();
  document.getElementById("mmSave").onclick = ()=>{
    const name = document.getElementById("mmName").value.trim();
    if(!name){ alert("Nhập tên"); return; }
    let cat = document.getElementById("mmCat").value.trim() || getCats()[0];
    if(!getCats().includes(cat) && !confirm('Tạo danh mục "' + cat + '"?')) return;
    const recipe = [];
    document.querySelectorAll("#recipeList .recipe-row").forEach(r=>{
      const ingId = r.querySelector("select[data-rf='ingId']").value;
      const qty = parseFloat(r.querySelector("input[data-rf='qty']").value) || 0;
      if(ingId && qty > 0) recipe.push({ingId, qty});
    });
    m.name = name; m.cat = cat;
    m.price = Math.max(0, parseInt(document.getElementById("mmPrice").value)||0);
    m.laborCost = Math.max(0, parseInt(document.getElementById("mmLabor").value)||0);
    m.otherCost = Math.max(0, parseInt(document.getElementById("mmOther").value)||0);
    const caseVal = parseInt(document.getElementById("mmCase").value)||0;
    if(caseVal > 0) m.caseSize = caseVal; else delete m.caseSize;
    m.prep = Math.max(1, parseInt(document.getElementById("mmPrep").value)||5);
    m.prio = Math.min(5, Math.max(1, parseInt(document.getElementById("mmPrio").value)||1));
    m.tag = document.getElementById("mmTag").value;
    m.emoji = document.getElementById("mmEmoji").value.trim() || "🍽️";
    m.img = document.getElementById("mmImg").value.trim();
    m.imgData = tempImgData || "";
    m.available = document.getElementById("mmAvail").checked;
    m.billable = document.getElementById("mmBillable").checked;
    m.recipe = recipe;
    if(isNew) state.menu.push(m);
    else { const idx = state.menu.findIndex(x=>x.id === m.id); if(idx >= 0) state.menu[idx] = m; }
    save();
    saveMenuImage(m.id, m.imgData);
    closeEditor(); alert("Đã lưu!");
  };
  const del = document.getElementById("mmDel");
  if(del) del.onclick = ()=>{
    if(!confirm('Xóa món "' + m.name + '"?')) return;
    state.menu = state.menu.filter(x=>x.id !== m.id);
    if(fbImagesRef) fbImagesRef.child(m.id).remove().catch(e=>console.error(e));
    save(); closeEditor();
  };
}

/* ============================================================
   RENDER ALL + INIT + ĐÓNG THẺ
   ============================================================ */
function renderAll(opts){
  opts = opts || {};
  if(MODE === "khach") document.body.classList.add("mode-khach");
  else document.body.classList.remove("mode-khach");
  if(modalLocked && !document.querySelector("#modalRoot .modal-back")) modalLocked = false;
  if(modalLocked){ renderHeader(); renderLowStockBanner(); renderStorageBanner(); renderCallBanner(); renderBookingBanner(); return; }
  renderHeader(); renderNav(); showSection();
  renderLowStockBanner(); renderStorageBanner(); renderCallBanner(); renderBookingBanner(); renderCallButton();
  if(!opts.skipKhach) renderKhach();
  if(!opts.skipModal) renderModal();
  if(MODE === "staff"){
    if(currentTab === "pv") renderPV();
    if(currentTab === "bep") renderBep();
    if(currentTab === "ql") renderQl();
  }
}
initFirebase();
renderAll();
let retryCount = 0;
setInterval(()=>{
  if(firebaseReady && !fbConnected && retryCount < 30){
    retryCount++;
    try{ if(fbRef) fbRef.off(); initFirebase(); }catch(e){ console.error(e); }
  } else if(fbConnected) retryCount = 0;
}, 10000);
setInterval(()=>{
  if(modalLocked) return;
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT");
  const inModal = ae && ae.closest && ae.closest("#modalRoot");
  if(typing || inModal) return;
  renderAll();
}, 20000);
</script>
