<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B4322A">
<title>🏮 Tiểu Nhị — Quán nhậu thông minh</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23B4322A'/><text y='72' x='50' text-anchor='middle' font-size='60'>🏮</text></svg>">
<style>
:root{
  --bg:#FDF6E3;--surface:#FFFBF2;--text:#2B1D14;--muted:#8A7660;
  --primary:#B4322A;--primary-d:#8B231D;--primary-l:#D9564D;
  --gold:#D4A017;--gold-d:#A67C0F;--gold-l:#F2C94C;
  --border:#E8D9BC;--warn:#C97D1F;--danger:#B4322A;--ok:#4A8C5A;
  --p1:#4A8C5A;--p2:#2E6DA4;--p3:#D4A017;--p4:#8B4FB8;--p5:#B4322A;
  --wood:#5A2D1B;--wood-d:#3A1810;--cream:#FDF6E3;--money:#1F8A4C;--ta:#8B4FB8;
  --shadow:0 2px 8px rgba(90,45,27,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A0F0A;--surface:#2A1811;--text:#F5E6D3;--muted:#B8A188;
    --primary:#D9564D;--primary-d:#B4322A;--primary-l:#E87A70;
    --gold:#F2C94C;--gold-d:#D4A017;--gold-l:#FFE082;
    --border:#3D2418;--warn:#E8A03A;--danger:#E87A70;--ok:#5FAE72;
    --p1:#5FAE72;--p2:#5C9FDB;--p3:#F2C94C;--p4:#B98BE0;--p5:#E87A70;
    --wood:#3A1810;--wood-d:#1A0F0A;--cream:#2A1811;--money:#5FAE72;
    --shadow:0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1A0F0A;--surface:#2A1811;--text:#F5E6D3;--muted:#B8A188;
  --primary:#D9564D;--primary-d:#B4322A;--primary-l:#E87A70;
  --gold:#F2C94C;--gold-d:#D4A017;--gold-l:#FFE082;
  --border:#3D2418;--warn:#E8A03A;--danger:#E87A70;--ok:#5FAE72;
  --p1:#5FAE72;--p2:#5C9FDB;--p3:#F2C94C;--p4:#B98BE0;--p5:#E87A70;
  --wood:#3A1810;--wood-d:#1A0F0A;--cream:#2A1811;--money:#5FAE72;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
header{position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,var(--wood-d),var(--wood));
  color:#F5E6D3;border-bottom:3px solid var(--gold);
  padding:.55rem .8rem .4rem;padding-top:calc(.55rem + env(safe-area-inset-top,0px));
  box-shadow:0 2px 12px rgba(58,24,16,.35)}
.header-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem}
.logo{width:48px;height:48px;flex:0 0 auto;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--gold-l),var(--gold) 60%,var(--gold-d));
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.4);
  border:2px solid var(--gold-l);overflow:hidden;position:relative}
.logo svg{width:100%;height:100%;display:block}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.15rem;margin:0;color:var(--gold-l);font-weight:900;letter-spacing:.05em;
  font-family:'Be Vietnam Pro',-apple-system,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.brand .sub{font-size:.68rem;color:#D4C4A8;margin-top:.05rem;font-style:italic}
.brand .contact{font-size:.66rem;color:#F0D8A8;margin-top:.15rem;line-height:1.3}
.brand .contact a{color:var(--gold-l);text-decoration:none}
.brand .dev{font-size:.6rem;color:#A89878;margin-top:.1rem;font-style:italic}
.modebar{font-size:.75rem;color:#D4C4A8;margin-bottom:.45rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.role-badge{background:var(--p2);color:#fff;padding:.12rem .55rem;border-radius:999px;font-size:.68rem;font-weight:700}
.role-badge.mgr{background:var(--primary-d)}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:.25rem;vertical-align:middle}
.sync-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.sync-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pillbtn{font-size:.72rem;padding:.2rem .5rem;border-radius:6px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-weight:600}
.pillbtn.on{background:var(--ok);border-color:var(--ok)}
.pillbtn.off{background:var(--danger);border-color:var(--danger)}
.pillbtn.x{background:transparent;color:var(--danger);border-color:var(--danger);font-weight:700}
nav.main{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.25rem;-webkit-overflow-scrolling:touch}
nav.main::-webkit-scrollbar{display:none}
nav.main button{flex:0 0 auto;padding:.5rem .9rem;border-radius:999px;border:1px solid rgba(212,160,23,.3);
  background:rgba(0,0,0,.2);color:#F0E0C0;font-size:.83rem;cursor:pointer;white-space:nowrap;font-weight:600}
nav.main button.active{background:linear-gradient(135deg,var(--primary),var(--primary-d));
  color:#fff;border-color:var(--gold);font-weight:800;box-shadow:0 2px 8px rgba(180,50,42,.4)}
nav.subnav{display:flex;gap:.35rem;overflow-x:auto;margin-bottom:.6rem;padding-bottom:.2rem;-webkit-overflow-scrolling:touch}
nav.subnav::-webkit-scrollbar{display:none}
nav.subnav button{flex:0 0 auto;padding:.42rem .75rem;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:.78rem;cursor:pointer;white-space:nowrap;font-weight:600}
nav.subnav button.active{background:linear-gradient(135deg,var(--primary-d),var(--primary));
  color:#fff;border-color:var(--primary-d);box-shadow:0 2px 6px rgba(180,50,42,.3)}
main{max-width:960px;margin:0 auto;padding:.9rem;padding-bottom:calc(7rem + env(safe-area-inset-bottom,0px))}
section{display:none}
section.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.85rem;margin-bottom:.7rem;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.82rem}
.note{color:var(--muted);font-size:.76rem;margin:-.3rem 0 .6rem}
select,input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;
  padding:.5rem .65rem;font-size:.9rem;font-family:inherit;max-width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--gold-l);outline-offset:-1px}
.btn{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border:none;border-radius:10px;
  padding:.55rem 1rem;font-size:.85rem;cursor:pointer;text-decoration:none;display:inline-block;font-weight:700;
  box-shadow:0 2px 6px rgba(180,50,42,.25);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.secondary{background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.btn.small{padding:.35rem .65rem;font-size:.78rem}
.btn.ok{background:linear-gradient(135deg,#4A8C5A,#2F6A3E);box-shadow:0 2px 6px rgba(74,140,90,.3)}
.btn.warn{background:linear-gradient(135deg,#D4A017,#A67C0F);box-shadow:0 2px 6px rgba(212,160,23,.3);color:#fff}
.btn.danger{background:linear-gradient(135deg,#B4322A,#8B231D)}
.btn.money{background:linear-gradient(135deg,#1F8A4C,#136436);box-shadow:0 2px 6px rgba(31,138,76,.3)}
.btn.ta{background:linear-gradient(135deg,#8B4FB8,#6A3B8A)}
.btn.blue{background:linear-gradient(135deg,#2E6DA4,#1F4F7A)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.item{display:flex;justify-content:space-between;align-items:flex-start;padding:.55rem 0;
  border-bottom:1px solid var(--border);gap:.5rem}
.item:last-child{border-bottom:none}
.item .name{font-size:.92rem}
.item.served{opacity:.65}
.item.served .name{text-decoration:line-through}
.notetag{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);font-size:.72rem;
  padding:.05rem .35rem;border-radius:5px;margin-left:.25rem;font-weight:600}
.cart-bottom{position:fixed;bottom:0;left:0;right:0;z-index:80;
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--gold) 6%,var(--surface)));
  border-top:2px solid var(--gold);box-shadow:0 -4px 20px rgba(58,24,16,.15);
  padding:.6rem .8rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom,0px))}
.cart-bottom .cb-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:.55rem}
.cart-bottom .cb-cart{flex:0 0 auto;background:var(--surface);border:2px solid var(--primary);
  color:var(--primary-d);border-radius:12px;padding:.7rem .9rem;font-size:1rem;font-weight:800;cursor:pointer;
  position:relative;display:flex;flex-direction:column;align-items:center;min-width:78px}
.cart-bottom .cb-cart:active{transform:scale(.95)}
.cart-bottom .cb-cart .cb-cart-icon{font-size:1.3rem;line-height:1}
.cart-bottom .cb-cart .cb-cart-count{font-size:.72rem;margin-top:.15rem;color:var(--muted);font-weight:600}
.cart-bottom .cb-cart .cb-cart-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;
  border-radius:999px;min-width:22px;height:22px;font-size:.72rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 5px}
.cart-bottom .cb-send{flex:1;background:linear-gradient(135deg,var(--primary),var(--primary-d));
  color:#fff;border:none;border-radius:12px;padding:1rem 1.2rem;font-size:1.08rem;font-weight:800;
  letter-spacing:.03em;cursor:pointer;box-shadow:0 4px 14px rgba(180,50,42,.4)}
.cart-bottom .cb-send:active{transform:scale(.98)}
.cart-bottom .cb-send.ta{background:linear-gradient(135deg,var(--ta),#6A3B8A)}
.cart-bottom .cb-send:disabled{opacity:.5;cursor:not-allowed}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.7rem;
  background:var(--surface);border-radius:14px;padding:.35rem;border:1px solid var(--border)}
.mode-tabs button{padding:.75rem .5rem;border:none;border-radius:10px;background:transparent;color:var(--text);
  font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem}
.mode-tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;box-shadow:0 2px 8px rgba(180,50,42,.3)}
.mode-tabs button.active.ta{background:linear-gradient(135deg,var(--ta),#6A3B8A)}
.ta-info-bar{background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 12%,var(--surface)),var(--surface));
  border:1px solid var(--ta);border-radius:14px;padding:.7rem .85rem;margin-bottom:.7rem}
.tbl-matrix{display:grid;grid-template-columns:24px repeat(4,1fr);gap:.35rem}
.mcell{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);font-weight:800}
.tbl{border-radius:10px;padding:.5rem .25rem;text-align:center;cursor:pointer;border:1.5px solid var(--border);font-size:.74rem;font-weight:600;transition:transform .1s}
.tbl:active{transform:scale(.96)}
.tbl.trong{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.tbl.busy{background:color-mix(in srgb,var(--gold) 25%,var(--surface));border-color:var(--gold)}
.tbl.merged{background:color-mix(in srgb,var(--p4) 18%,var(--surface));opacity:.75}
.tbl.booked{background:color-mix(in srgb,var(--p2) 20%,var(--surface));border-color:var(--p2)}
.badge{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.7rem;color:#fff;font-weight:700}
.badge.p1{background:var(--p1)}.badge.p2{background:var(--p2)}.badge.p3{background:var(--p3)}
.badge.p4{background:var(--p4)}.badge.p5{background:var(--p5)}
.badge.st{background:var(--muted)}.badge.drink{background:var(--p2)}.badge.service{background:var(--gold-d)}
.badge.out{background:var(--danger)}.badge.temp{background:var(--warn)}.badge.paid{background:var(--ok)}
.badge.void{background:var(--muted);text-decoration:line-through}.badge.money{background:var(--money)}
.badge.ta{background:var(--ta)}.badge.new{background:var(--p2)}.badge.cooking{background:var(--warn)}
.badge.music{background:linear-gradient(135deg,#E91E63,#8B4FB8)}
.kgroup{border:1.5px solid var(--border);border-radius:12px;padding:.7rem;margin-bottom:.6rem;background:var(--surface);box-shadow:var(--shadow)}
.kgroup.hot{border-color:var(--danger);box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 18%,transparent)}
.kgroup.cooking{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.kgroup.ta{border-color:var(--ta)}
.khead{display:flex;justify-content:space-between;align-items:center;gap:.7rem}
.kinfo{flex:1;min-width:0}
.kmeta{font-size:.76rem;color:var(--muted);margin-top:.2rem}
.knote{font-size:.78rem;color:var(--warn);margin-top:.2rem;font-weight:600}
.kbtn{font-size:1.02rem !important;padding:.85rem 1.5rem !important;font-weight:800;flex-shrink:0}
.kbtns{display:flex;flex-direction:column;gap:.35rem;flex-shrink:0}
.kbtn.small-k{font-size:.85rem !important;padding:.55rem 1rem !important}
.ksec-title{font-weight:800;margin:.9rem 0 .4rem;padding:.45rem .75rem;border-radius:10px;display:inline-block;font-size:.9rem}
.ksec-title.food{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.ksec-title.drink{background:color-mix(in srgb,var(--p2) 20%,transparent);color:var(--p2)}
.ksec-title.service{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold-d)}
.ksec-title.music{background:linear-gradient(135deg,color-mix(in srgb,#E91E63 20%,transparent),color-mix(in srgb,#8B4FB8 20%,transparent));color:#C2185B}
.ksec-title.done{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:1.15rem;font-weight:800;color:var(--primary-d)}
.stat .l{font-size:.74rem;color:var(--muted)}
.stat .delta{font-size:.74rem;font-weight:700;margin-top:.2rem}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:.4rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.45rem .3rem;border-bottom:1px solid var(--border);vertical-align:middle}
.modal-back{position:fixed;inset:0;background:rgba(58,24,16,.65);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(3px)}
.modal{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:1rem;
  max-height:92vh;overflow:auto;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));
  border-top:3px solid var(--gold);box-shadow:0 -8px 32px rgba(58,24,16,.3)}
.close-x{float:right;background:none;border:none;font-size:1.3rem;color:var(--muted);cursor:pointer;padding:.2rem .5rem}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:1.2rem 0}
label.fl{display:block;font-size:.8rem;color:var(--muted);margin:.55rem 0 .15rem;font-weight:600}
label.fl input,label.fl select,label.fl textarea{width:100%}
.tiny{font-size:.74rem}
.alert-banner{background:color-mix(in srgb,var(--danger) 12%,var(--surface));border:1.5px solid var(--danger);
  border-radius:12px;padding:.7rem .9rem;margin-bottom:.7rem;font-size:.85rem;color:var(--danger);font-weight:600}
.alert-banner.warn{background:color-mix(in srgb,var(--gold) 15%,var(--surface));border-color:var(--gold);color:var(--gold-d)}
.alert-banner.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border-color:var(--ok);color:var(--ok)}
.call-btn{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom,0px));right:14px;z-index:75;
  background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border:none;border-radius:999px;
  padding:.7rem 1.1rem;font-size:.85rem;font-weight:800;box-shadow:0 6px 18px rgba(180,50,42,.5);cursor:pointer}
.call-btn.called{background:var(--muted);box-shadow:none}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px dashed var(--border)}
.payrow .qq{display:flex;align-items:center;gap:.25rem;flex:0 0 auto}
.payrow .qq button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;cursor:pointer;font-weight:700}
.payrow .qq input{width:56px;text-align:center;padding:.3rem}
input[type="number"]{text-align:right}
.ing-row{display:grid;grid-template-columns:1fr 70px 90px 70px 70px 30px;gap:.35rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.8rem}
.ing-row.header{font-weight:800;color:var(--muted);font-size:.72rem;border-bottom:2px solid var(--border)}
.ing-row input{padding:.25rem .35rem;font-size:.8rem}
.gchart{display:flex;gap:6px;align-items:flex-end;height:200px;padding:.4rem 0 .2rem;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:.3rem}
.gday{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;min-width:48px}
.gbars{display:flex;gap:1px;align-items:flex-end;height:140px}
.gbar{width:11px;border-radius:3px 3px 0 0}
.gbar.rev{background:linear-gradient(to top,var(--primary),var(--primary-l))}
.gbar.cost{background:linear-gradient(to top,var(--gold-d),var(--gold))}
.gbar.profit{background:linear-gradient(to top,#2F6A3E,#5FAE72)}
.gday .glbl{font-size:.62rem;color:var(--muted);white-space:nowrap;font-weight:600}
.legend{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.75rem;margin-top:.3rem}
.legend span{display:flex;align-items:center;gap:.3rem}
.legend .dot{width:10px;height:10px;border-radius:2px}
.legend .dot.rev{background:var(--primary)}.legend .dot.cost{background:var(--gold)}.legend .dot.profit{background:var(--ok)}
.filter-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.filter-bar button{font-size:.75rem;padding:.35rem .75rem;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-weight:600}
.filter-bar button.active{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-color:var(--primary)}
.menu-cat{margin-bottom:1.2rem}
.menu-cat-h{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 .6rem;padding:.6rem .85rem;
  border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--wood),var(--wood-d));
  border-left:4px solid var(--gold);box-shadow:0 2px 8px rgba(58,24,16,.2)}
.menu-cat-h .ci{font-size:1.3rem}
.menu-cat-h .cn{font-weight:900;font-size:1rem;letter-spacing:.05em;text-transform:uppercase}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem}
.menu-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.menu-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(58,24,16,.15)}
.menu-card .m-img{height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 25% 25%,var(--gold-l) 0%,transparent 55%),
    radial-gradient(circle at 80% 80%,var(--gold) 0%,transparent 60%),
    linear-gradient(135deg,#F5D4A8,#E8B878)}
.menu-card .m-img img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:4px}
.menu-card .m-img .emoji{font-size:4rem;line-height:1}
.menu-card .m-body{padding:.7rem .8rem .8rem}
.menu-card .m-name{font-weight:800;font-size:1rem;margin:0 0 .25rem;color:var(--primary-d);line-height:1.3}
.menu-card .m-price{font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
.menu-card .m-tag-best{display:inline-block;font-size:.62rem;padding:.15rem .5rem;border-radius:999px;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;font-weight:800;margin-left:.3rem;vertical-align:middle}
.menu-card .m-note{font-size:.73rem;color:var(--muted);margin:.25rem 0}

function deepClean(obj){
  if(obj === null || obj === undefined) return obj;
  if(Array.isArray(obj)) return obj.map(deepClean).filter(v => v !== undefined);
  if(typeof obj === "object"){
    const out = {};
    for(const k of Object.keys(obj)){
      if(obj[k] === undefined) continue;
      out[k] = deepClean(obj[k]);
    }
    return out;
  }
  return obj;
}
function toArr(v){
  if(Array.isArray(v)) return v;
  if(v && typeof v === "object"){
    return Object.keys(v)
      .sort((a,b)=>{const na=Number(a),nb=Number(b); if(!isNaN(na)&&!isNaN(nb)) return na-nb; return String(a).localeCompare(String(b));})
      .map(k=>v[k]);
  }
  return [];
}
function fmtShort(n){
  if(Math.abs(n) >= 1000000) return (n/1000000).toFixed(1) + "M";
  if(Math.abs(n) >= 1000) return Math.round(n/1000) + "K";
  return String(Math.round(n));
}
function proxiedImgUrl(raw){
  if(!raw) return "";
  if(raw.startsWith("data:")) return raw;
  if(raw.startsWith("http")) return `https://images.weserv.nl/?url=${encodeURIComponent(raw)}&w=600&output=jpg&q=80`;
  return raw;
}
function readImageAsResizedDataUrl(file, maxW, maxH, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const ratio = Math.min(maxW/w, maxH/h, 1);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL("image/jpeg", quality || 0.6)); } catch(e){ reject(e); }
      };
      img.onerror = ()=>reject(new Error("Không đọc được ảnh"));
      img.src = ev.target.result;
    };
    reader.onerror = ()=>reject(new Error("Lỗi đọc file"));
    reader.readAsDataURL(file);
  });
}
function dataUrlSizeKB(dataUrl){
  if(!dataUrl || !dataUrl.startsWith("data:")) return 0;
  const i = dataUrl.indexOf(",");
  if(i < 0) return 0;
  return Math.round(dataUrl.length * 0.75 / 1024);
}
function extractYouTubeId(url){
  if(!url) return "";
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : "";
}

let archiveCache = {};

function stripImagesForSync(st){
  st.menu = (st.menu||[]).map(m=>{ const c = {...m}; delete c.imgData; return c; });
  return st;
}
function applyImagesCache(){
  if(!state.menu) return;
  state.menu.forEach(m=>{
    if(Object.prototype.hasOwnProperty.call(imagesCache, m.id)){
      m.imgData = imagesCache[m.id] || "";
    }
  });
}
function saveMenuImage(id, dataUrl){
  imagesCache[id] = dataUrl || "";
  if(!firebaseReady || !fbImagesRef) return;
  fbImagesRef.child(id).set(dataUrl || null).catch(err=>{
    console.error("[Firebase] Lỗi lưu ảnh:", err);
  });
}
function totalImagesSizeKB(){
  return Object.values(imagesCache).reduce((s,v)=>s + dataUrlSizeKB(v), 0);
}

    customers: {},
    monthlySummary: {},
    musicQueue: [],
    bookings: [],
    shifts: [],
    reactions: {},
    seq: 1,
    tableSessions: {}, merges: {}, tableServices: {}, tableNotes: {},
    menu: SEED_MENU.map(x=>({...x, recipe:(x.recipe||[]).map(r=>({...r}))})),
    ingredients: SEED_ING.map(x=>({...x})),
    brand: {name:"TIỂU NHỊ",sub:"Quán nhậu thông minh · Phục vụ tận tâm",
      dev:"Phát triển bởi LƯ PHÙNG TIẾN",logo:"",address:"",phone:"",openHours:""},
    settings: {
      managerPin:"1234", cancelApproval:true, taxEnabled:false, taxRate:8,
      autoDisableByStock: true, serviceFeeEnabled: true, openingBalance: 0, deliveryFee: 15000,
      loyaltyEnabled: true, loyaltyPointRate: 10000, discountMax: 30,
      vibe: "chill", musicEnabled: true, musicVolume: 60,
      bank: {enabled:false,bankId:"VCB",accountNumber:"",accountHolder:"",qrImageUrl:"",showOnBill:true}
    },
    meta: {lastUpdate:0,lastClient:""}
  };
}
function migrateState(st){
  if(!st || typeof st !== "object") st = seed();
  st.orders = toArr(st.orders).map(o=>({...o,
    qty: Number(o.qty)||0, price: Number(o.price)||0, prio: Number(o.prio)||1,
    prep: Number(o.prep)||5, ts: Number(o.ts)||Date.now(),
    status: o.status || "cho_bep", table: String(o.table||""), name: String(o.name||"")
  }));
  st.invoices = toArr(st.invoices).map(inv=>({...inv,
    items: toArr(inv.items).map(it=>({...it,
      qty: Number(it.qty)||0, price: Number(it.price)||0, cost: Number(it.cost)||0,
      name: String(it.name||""), note: String(it.note||"")
    })),
    ts: Number(inv.ts)||Date.now(), subtotal: Number(inv.subtotal)||0,
    discount: Number(inv.discount)||0, discountType: inv.discountType||"",
    tax: Number(inv.tax)||0, total: Number(inv.total)||0, taxRate: Number(inv.taxRate)||0,
    servicePrice: Number(inv.servicePrice)||0, deliveryFee: Number(inv.deliveryFee)||0,
    table: String(inv.table||""), type: inv.type||"final", status: inv.status||"paid"
  }));
  st.cancelLogs = toArr(st.cancelLogs).map(l=>({...l,
    qty: Number(l.qty)||0, price: Number(l.price)||0, ts: Number(l.ts)||Date.now()
  }));
  st.calls = toArr(st.calls).map(c=>({...c,
    ts: Number(c.ts)||Date.now(), table: String(c.table||""), handled: !!c.handled
  }));
  st.purchases = toArr(st.purchases).map(p=>({...p,
    qty: Number(p.qty)||0, unitPrice: Number(p.unitPrice)||0,
    total: Number(p.total)||0, ts: Number(p.ts)||Date.now()
  }));
  st.expenses = toArr(st.expenses).map(e=>({...e,
    amount: Number(e.amount)||0, ts: Number(e.ts)||Date.now()
  }));
  st.recurringExpenses = toArr(st.recurringExpenses).map(r=>({...r,
    amount: Number(r.amount)||0, name: String(r.name||""), createdTs: Number(r.createdTs)||Date.now()
  }));
  st.musicQueue = toArr(st.musicQueue).map(m=>({...m,
    ts: Number(m.ts)||Date.now(), played: !!m.played, skipped: !!m.skipped
  }));
  st.bookings = toArr(st.bookings).map(b=>({...b,
    ts: Number(b.ts)||Date.now(), guests: Number(b.guests)||2
  }));
  st.shifts = toArr(st.shifts);
  st.reactions = st.reactions && typeof st.reactions === "object" ? st.reactions : {};
  st.menu = toArr(st.menu);
  if(!st.menu.length) st.menu = SEED_MENU.map(x=>({...x, recipe: toArr(x.recipe).map(r=>({...r}))}));
  st.menu.forEach(m=>{
    if(m.emoji === undefined) m.emoji = "🍽️";
    if(m.img === undefined) m.img = "";
    if(m.imgData === undefined) m.imgData = "";
    m.price = Number(m.price)||0; m.prep = Number(m.prep)||5; m.prio = Number(m.prio)||1;
    m.laborCost = Number(m.laborCost)||0; m.otherCost = Number(m.otherCost)||0;
    if(m.caseSize) m.caseSize = Number(m.caseSize); else delete m.caseSize;
    m.recipe = toArr(m.recipe).map(r=>({...r, qty: Number(r.qty)||0, ingId: String(r.ingId||"")}))
      .filter(r=>r.ingId && r.qty > 0);
  });
  st.ingredients = toArr(st.ingredients);
  if(!st.ingredients.length) st.ingredients = SEED_ING.map(x=>({...x}));
  st.ingredients.forEach(i=>{
    i.price = Number(i.price)||0; i.stock = Number(i.stock)||0; i.minStock = Number(i.minStock)||0;
    i.name = String(i.name||""); i.unit = String(i.unit||"kg");
  });
  st.customers = st.customers && typeof st.customers === "object" ? st.customers : {};
  Object.keys(st.customers).forEach(k=>{
    const c = st.customers[k];
    c.points = Number(c.points)||0; c.visits = Number(c.visits)||0;
    c.totalSpent = Number(c.totalSpent)||0; c.lastVisit = Number(c.lastVisit)||0;
    c.streak = Number(c.streak)||0;
  });
  st.monthlySummary = st.monthlySummary && typeof st.monthlySummary === "object" ? st.monthlySummary : {};
  st.tableSessions = st.tableSessions && typeof st.tableSessions === "object" ? st.tableSessions : {};
  st.merges = st.merges && typeof st.merges === "object" ? st.merges : {};
  st.tableServices = st.tableServices && typeof st.tableServices === "object" ? st.tableServices : {};
  st.tableNotes = st.tableNotes && typeof st.tableNotes === "object" ? st.tableNotes : {};
  st.qrImages = st.qrImages && typeof st.qrImages === "object" ? st.qrImages : {};
  st.takeawayMeta = st.takeawayMeta && typeof st.takeawayMeta === "object" ? st.takeawayMeta : {};
  st.takeawayCounter = Number(st.takeawayCounter)||0;
  st.seq = Number(st.seq)||1;
  st.brand = Object.assign({name:"TIỂU NHỊ",sub:"",dev:"",logo:"",address:"",phone:"",openHours:""}, st.brand||{});
  st.settings = Object.assign({
    managerPin:"1234", cancelApproval:true, taxEnabled:false, taxRate:8,
    autoDisableByStock: true, serviceFeeEnabled: true, openingBalance: 0, deliveryFee: 15000,
    loyaltyEnabled: true, loyaltyPointRate: 10000, discountMax: 30,
    vibe: "chill", musicEnabled: true, musicVolume: 60
  }, st.settings||{});
  st.settings.bank = Object.assign({enabled:false,bankId:"VCB",accountNumber:"",accountHolder:"",qrImageUrl:"",showOnBill:true}, st.settings.bank||{});
  st.meta = st.meta || {lastUpdate:0,lastClient:""};
  return st;
}
function loadLocal(){
  try{ const s = localStorage.getItem(STKEY); if(s) return migrateState(JSON.parse(s)); }catch(e){}
  return seed();
}
let state = loadLocal();
currentVibe = state.settings.vibe || "chill";
function saveLocal(){
  try{ localStorage.setItem(STKEY, JSON.stringify(state)); }
  catch(e){
    if(e.name === "QuotaExceededError" || (e.message||"").indexOf("quota")>=0){
      if(state.invoices.length > 100){ state.invoices = state.invoices.slice(-100); }
      try{ localStorage.setItem(STKEY, JSON.stringify(state)); }catch(e2){
        alert("⚠️ Bộ nhớ đầy. Xuất backup gấp!");
      }
    } else console.error(e);
  }
}
function save(){
  state.meta = state.meta||{};
  state.meta.lastUpdate = Date.now();
  state.meta.lastClient = clientId;
  saveLocal();
  if(!firebaseReady || suppressWrite) return;
  if(MODE !== "staff" && !remoteSeeded) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(()=>{
    try{
      const clean = deepClean(stripImagesForSync(migrateState(JSON.parse(JSON.stringify(state)))));
      fbRef.set(clean)
        .then(()=>{ if(!fbConnected) setSyncStatus("synced", "🟢 Ghi OK"); })
        .catch(err=>{
          console.error("[Firebase] WRITE ERROR:", err);
          if(err.code === "PERMISSION_DENIED") setSyncStatus("offline", "🔴 Rules chưa Publish");
          else setSyncStatus("offline", "🔴 " + (err.code||err.message));
        });
    }catch(e){ console.error("[save] Lỗi chuẩn bị dữ liệu:", e); }
  }, 400);
}
function setSyncStatus(kind, text){
  const dot = document.getElementById("syncDot");
  const st = document.getElementById("syncStatus");
  if(!dot || !st) return;
  dot.className = "sync-dot " + (kind === "synced" ? "on" : (kind === "offline" ? "off" : "syncing"));
  dot.title = text;
  st.textContent = text;
}
function updateSyncUI(){
  if(!firebaseReady){ setSyncStatus("local", "Local"); return; }
  if(fbConnected) setSyncStatus("synced", "🟢 Đồng bộ realtime");
  else setSyncStatus("offline", "🔴 Mất kết nối");
}
function archiveOldInvoices(){
  if(state.invoices.length <= 400) return;
  const sorted = state.invoices.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const toArchive = sorted.slice(0, state.invoices.length - 300);
  const remaining = sorted.slice(state.invoices.length - 300);
  const byMonth = {};
  toArchive.forEach(inv=>{
    const d = new Date(inv.ts);
    const key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0');
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(inv);
  });
  Object.entries(byMonth).forEach(([key, invs])=>{
    if(fbArchiveRef){
      const existing = archiveCache[key] || [];
      const merged = existing.concat(invs);
      archiveCache[key] = merged;
      fbArchiveRef.child(key).set(deepClean(merged)).catch(e=>console.error("[Archive]", e));
    }
    const cur = state.monthlySummary[key] || {revenue:0, cogs:0, items:0, invoices:0};
    invs.forEach(inv=>{
      const rev = Number(inv.total)||0;
      const cogs = toArr(inv.items).reduce((s,it)=>s + (it.qty||0)*(it.cost||0), 0);
      cur.revenue += rev;
      cur.cogs += cogs;
      cur.items += toArr(inv.items).reduce((s,it)=>s + (it.qty||0), 0);
      cur.invoices += 1;
    });
    state.monthlySummary[key] = cur;
  });
  state.invoices = remaining;
}
function initFirebase(){
  const cfg = FIREBASE_CONFIG;
  if(!cfg || !cfg.databaseURL){ setSyncStatus("local", "Chưa cấu hình Firebase"); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    const db = firebase.database();
    fbRef = db.ref("tieunhi/state");
    fbImagesRef = db.ref("tieunhi/images");
    fbArchiveRef = db.ref("tieunhi/archive");
    db.ref(".info/connected").on("value", s=>{
      fbConnected = !!s.val();
      if(fbConnected) setSyncStatus("syncing", "🟡 Đang kết nối...");
      else setSyncStatus("offline", "🔴 Mất kết nối mạng");
      updateSyncUI();
    });
    fbImagesRef.on("value", snap=>{
      try{
        imagesCache = snap.val() || {};
        applyImagesCache();
        saveLocal();
        renderAll();
      }catch(err){ console.error("[Firebase] Lỗi nhận ảnh:", err); }
    });
    fbRef.on("value", snap=>{
      try{
        const remote = snap.val();
        if(!remote){
          if(MODE !== "staff"){
            setSyncStatus("syncing", "🟡 Đang chờ dữ liệu từ quán...");
            return;
          }
          const seedClean = deepClean(stripImagesForSync(migrateState(JSON.parse(JSON.stringify(state)))));
          fbRef.transaction(current=>{
            if(current === null || current === undefined) return seedClean;
            return;
          }, (err, committed)=>{
            if(err){
              if(err.code === "PERMISSION_DENIED") setSyncStatus("offline", "🔴 Rules chưa Publish");
              else setSyncStatus("offline", "🔴 " + (err.code||err.message));
            } else {
              state.menu.forEach(m=>{ if(m.imgData) saveMenuImage(m.id, m.imgData); });
              remoteSeeded = true;
              setSyncStatus("synced", "🟢 Đã kết nối");
            }
          });
          return;
        }
        remoteSeeded = true;
        suppressWrite = true;
        state = migrateState(remote);
        applyImagesCache();
        saveLocal();
        renderAll();
        const now = new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
        setSyncStatus("synced", `🟢 Đồng bộ lúc ${now}`);
        setTimeout(()=>{ suppressWrite = false; }, 500);
      }catch(err){
        console.error("[Firebase] Lỗi xử lý dữ liệu:", err);
        setSyncStatus("offline", "🔴 Lỗi dữ liệu: " + err.message);
      }
    }, err=>{
      if(err.code === "PERMISSION_DENIED") setSyncStatus("offline", "🔴 Rules chưa Publish");
      else setSyncStatus("offline", "🔴 " + (err.code||err.message));
    });
    firebaseReady = true;
    updateSyncUI();
  }catch(e){
    console.error("[Firebase] INIT ERROR:", e);
    setSyncStatus("offline", "🔴 Không khởi tạo: " + e.message);
  }
}

   HELPERS
   ============================================================ */
function resolveTable(t){
  let cur = t, guard = 0; const visited = new Set();
  while(state.merges[cur] && guard++ < 20){
    if(visited.has(cur)){ delete state.merges[cur]; break; }
    visited.add(cur); cur = state.merges[cur];
  }
  return cur;
}
function mergedChildren(t){ return Object.keys(state.merges).filter(k=>resolveTable(k)===t); }
function getTableService(t){ return state.tableServices[t] || {note:"", price:0}; }
function setTableService(t, svc){
  if(!svc.note && !svc.price) delete state.tableServices[t];
  else state.tableServices[t] = svc;
  save();
}
function getTAMeta(id){ return state.takeawayMeta[id] || {name:"",phone:"",address:"",note:"",pickup:false}; }
function setTAMeta(id, meta){ state.takeawayMeta[id] = meta; save(); }
function nextTAId(){ state.takeawayCounter = (state.takeawayCounter||0) + 1; return "TA" + state.takeawayCounter; }
function getActiveTAs(){
  const ids = new Set();
  state.orders.forEach(o=>{ if(o.status !== "huy" && isTakeawayId(o.table)) ids.add(o.table); });
  return Array.from(ids).sort((a,b)=>(parseInt(a.replace("TA",""))||0) - (parseInt(b.replace("TA",""))||0));
}
function itemIngredientCost(m){
  return (m.recipe||[]).reduce((s,r)=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return s + (ing ? ing.price * r.qty : 0);
  }, 0);
}
function itemCost(m){ return itemIngredientCost(m) + (m.laborCost||0) + (m.otherCost||0); }
function itemMargin(m){
  const cost = itemCost(m);
  const profit = m.price - cost;
  return m.price > 0 ? profit / m.price : 0;
}
function buildBankQrUrl(amount, desc){
  const b = state.settings.bank || {};
  if(!b.enabled) return "";
  if(b.qrImageUrl) return b.qrImageUrl;
  if(!b.accountNumber) return "";
  return `https://img.vietqr.io/image/${b.bankId}-${b.accountNumber}-compact2.png?amount=${Math.max(0,Math.round(amount||0))}&addInfo=${encodeURIComponent(desc||"Thanh toan")}&accountName=${encodeURIComponent(b.accountHolder||"")}`;
}
function isBankConfigured(){
  const b = state.settings.bank || {};
  return b.enabled && (b.qrImageUrl || b.accountNumber);
}
function itemImageHtml(m){
  const raw = m.imgData || m.img;
  if(raw){
    const proxied = proxiedImgUrl(raw);
    return `<img src="${esc(proxied)}" loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous"
      onerror="this.style.display='none';this.parentElement.innerHTML='<span class=emoji>${esc(m.emoji||'🍽️')}</span>'">`;
  }
  return `<span class="emoji">${esc(m.emoji||'🍽️')}</span>`;
}
function isItemOrderable(m){
  if(!m.available) return false;
  if(!state.settings.autoDisableByStock) return true;
  if(!m.recipe || !m.recipe.length) return true;
  return m.recipe.every(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return ing && ing.stock >= r.qty;
  });
}
function itemsShortage(m){
  return (m.recipe||[]).filter(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return !ing || ing.stock < r.qty;
  }).map(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return ing ? ing.name : "(đã xoá)";
  });
}
function getCats(){
  const list = [...BASE_CATS];
  state.menu.forEach(m=>{ if(m.cat && !list.includes(m.cat)) list.push(m.cat); });
  return list;
}
function typeOf(cat){
  if(cat === "Đồ uống") return "drink";
  if(cat === "Khăn & Dụng cụ") return "service";
  return "food";
}
function typeOfItem(itemId){
  const m = state.menu.find(x=>x.id === itemId);
  return m ? typeOf(m.cat) : "food";
}
function statusLabel(s){ return {cho_bep:"⏳ Chờ xác nhận",dang_lam:"🔥 Đang chế biến",hoan_thanh:"✅ Đã xong",huy:"❌ Đã hủy"}[s] || s; }
function callTypeInfo(type){ return CALL_PRESETS.find(p=>p.type === type) || {icon:"💬", label:"Khác"}; }
function getVibe(){ return VIBES[currentVibe] || VIBES.chill; }

function renderHeader(){
  document.getElementById("brandName").textContent = state.brand.name;
  document.getElementById("brandSub").textContent = state.brand.sub;
  document.getElementById("devCredit").textContent = state.brand.dev;
  const c = document.getElementById("brandContact");
  const parts = [];
  if(state.brand.address) parts.push(`📍 ${esc(state.brand.address)}`);
  if(state.brand.phone) parts.push(`📞 <a href="tel:${esc(state.brand.phone)}">${esc(state.brand.phone)}</a>`);
  if(state.brand.openHours) parts.push(`🕒 ${esc(state.brand.openHours)}`);
  c.innerHTML = parts.join(" · ");
  const logoBox = document.getElementById("logoBox");
  if(state.brand.logo && (state.brand.logo.startsWith("http") || state.brand.logo.startsWith("data:"))){
    logoBox.innerHTML = `<img src="${esc(proxiedImgUrl(state.brand.logo))}" style="width:100%;height:100%;object-fit:cover" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML=LOGO_TIEU_NHI_SVG">`;
  } else {
    logoBox.innerHTML = LOGO_TIEU_NHI_SVG;
  }
  const ms = document.getElementById("modeSub");
  if(MODE === "staff"){ ms.textContent = "Hệ thống quản lý"; }
  else {
    const real = resolveTable(currentTable);
    ms.textContent = (real !== currentTable) ? `Bàn ${currentTable} (ghép ${real})` : `Bàn ${currentTable}`;
  }
  const rb = document.getElementById("roleBadge");
  const bl = document.getElementById("btnRoleLogin");
  if(MODE === "khach"){ rb.style.display = "none"; bl.style.display = "none"; return; }
  rb.style.display = ""; bl.style.display = "";
  if(role === "manager"){ rb.textContent = "👑 Quản lý"; rb.className = "role-badge mgr"; bl.textContent = "🚪 Thoát"; }
  else { rb.textContent = "🧑‍🍳 Nhân viên"; rb.className = "role-badge"; bl.textContent = "🔑 QL"; }
}

document.getElementById("btnRefresh").onclick = async ()=>{
  if(!firebaseReady) return alert("Firebase chưa sẵn sàng");

    const snap = await fbRef.once("value");
    const remote = snap.val();
    if(remote){
      suppressWrite = true;
      state = migrateState(remote);
      applyImagesCache();
      saveLocal();
      renderAll();
      setTimeout(()=>{ suppressWrite = false; }, 500);
      setSyncStatus("synced", "🟢 Đã làm mới");
    } else { alert("Firebase trống."); }
  }catch(e){ alert("Lỗi: " + (e.code || e.message)); }

    <button class="close-x" id="mc">✕</button>
    <h3>🎨 Vibe không gian</h3>
    <div class="muted tiny">Đổi không khí quán — cũng đổi nhạc và màu sắc</div>
    <div class="vibe-picker">
      ${Object.entries(VIBES).map(([k,v])=>`
        <button class="vibe-chip ${currentVibe===k?'on':''}" data-vibe="${k}" style="${currentVibe===k?`background:linear-gradient(135deg,${v.color},${v.color});color:#fff;border-color:${v.color}`:''}">
          ${v.label}<div class="tiny" style="opacity:.8;margin-top:.15rem">${v.desc}</div>
        </button>
      `).join("")}
    </div>
    <div class="row" style="margin-top:.8rem">
      <button class="btn secondary" id="vcClose">← Đóng</button>
    </div>
  </div></div>`;
  const close = ()=>{ modalLocked = false; root.innerHTML = ""; renderAll(); };
  document.getElementById("mc").onclick = close;
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb") close(); };
  document.getElementById("vcClose").onclick = close;
  root.querySelectorAll("[data-vibe]").forEach(b=>b.onclick = ()=>{
    currentVibe = b.dataset.vibe;
    state.settings.vibe = currentVibe;
    save();
    close();
    alert(`✓ Đã đổi vibe: ${VIBES[currentVibe].label}`);
  });
}
function renderNav(){
  const nav = document.getElementById("nav"); nav.innerHTML = "";
  if(MODE !== "staff") return;
  TABS_STAFF.forEach(([id,label])=>{
    const b = document.createElement("button");
    b.textContent = label; b.className = id===currentTab ? "active" : "";
    b.onclick = ()=>{ currentTab = id; renderAll(); };
    nav.appendChild(b);
  });
}
function showSection(){
  ["khach","pv","bep","ql"].forEach(id=>{
    const el = document.getElementById("sec-"+id);
    if(el) el.classList.toggle("active", id === currentTab);
  });
}
