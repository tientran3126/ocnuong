<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🐚 Ốc Nướng — Quản lý quán nhậu</title>
<style>
:root{
  --bg:#fdf6ec;--surface:#fff;--text:#2b2118;--muted:#8a7a68;
  --primary:#c0521f;--primary-d:#963f16;--border:#e8d9c5;
  --warn:#b8860b;--danger:#b4322a;--ok:#2f7a4f;
  --p1:#2f7a4f;--p2:#2e6da4;--p3:#c08a1e;--p4:#8b4fb8;--p5:#b4322a;
  --wood:#5a3a1f;--wood-d:#3a2410;--beer:#e0a021;--money:#1f8a4c;--ta:#8b4fb8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1712;--surface:#2a231b;--text:#f1e9dd;--muted:#b3a693;
    --primary:#e2793d;--primary-d:#c85f24;--border:#3c3226;
    --warn:#e0b23a;--danger:#e2685f;--ok:#4fae79;
    --p1:#4fae79;--p2:#5c9fdb;--p3:#e0b23a;--p4:#b98be0;--p5:#e2685f;
    --money:#4fae79;--ta:#b98be0;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1712;--surface:#2a231b;--text:#f1e9dd;--muted:#b3a693;
  --primary:#e2793d;--primary-d:#c85f24;--border:#3c3226;
  --warn:#e0b23a;--danger:#e2685f;--ok:#4fae79;
  --p1:#4fae79;--p2:#5c9fdb;--p3:#e0b23a;--p4:#b98be0;--p5:#e2685f;
  --money:#4fae79;--ta:#b98be0;
}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--wood-d),var(--wood));
  color:#f5e8d0;border-bottom:3px solid var(--primary);padding:.55rem .8rem .4rem;
  padding-top:calc(.55rem + env(safe-area-inset-top,0px));box-shadow:0 2px 10px rgba(0,0,0,.2)}
.header-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem}
.logo{width:44px;height:44px;flex:0 0 auto;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffd98a,#e08a2e 60%,#8b4a0f);
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.4);
  border:2px solid #ffd98a;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.05rem;margin:0;color:#ffd98a;font-weight:800}
.brand .sub{font-size:.68rem;color:#d4c4a8;margin-top:.05rem}
.brand .contact{font-size:.66rem;color:#f0d8a8;margin-top:.15rem;line-height:1.3}
.brand .contact a{color:#ffd98a;text-decoration:none}
.brand .dev{font-size:.62rem;color:#a89878;margin-top:.1rem;font-style:italic}
.modebar{font-size:.75rem;color:#d4c4a8;margin-bottom:.45rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.role-badge{background:var(--p2);color:#fff;padding:.12rem .55rem;border-radius:999px;font-size:.68rem;font-weight:700}
.role-badge.mgr{background:var(--danger)}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:.25rem;vertical-align:middle}
.sync-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.sync-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pillbtn{font-size:.72rem;padding:.2rem .5rem;border-radius:6px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.pillbtn.on{background:var(--ok);border-color:var(--ok)}
.pillbtn.off{background:var(--danger);border-color:var(--danger)}
.pillbtn.x{background:transparent;color:var(--danger);border-color:var(--danger);font-weight:700}
nav.main{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.25rem;-webkit-overflow-scrolling:touch}
nav.main::-webkit-scrollbar{display:none}
nav.main button{flex:0 0 auto;padding:.45rem .8rem;border-radius:999px;border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.15);color:#f0e0c0;font-size:.83rem;cursor:pointer;white-space:nowrap}
nav.main button.active{background:var(--primary);color:#fff;border-color:#ffd98a;font-weight:700}
nav.subnav{display:flex;gap:.35rem;overflow-x:auto;margin-bottom:.6rem;padding-bottom:.2rem;-webkit-overflow-scrolling:touch}
nav.subnav::-webkit-scrollbar{display:none}
nav.subnav button{flex:0 0 auto;padding:.38rem .7rem;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:.78rem;cursor:pointer;white-space:nowrap}
nav.subnav button.active{background:var(--primary-d);color:#fff;border-color:var(--primary-d)}
main{max-width:960px;margin:0 auto;padding:.9rem;padding-bottom:calc(7rem + env(safe-area-inset-bottom,0px))}
section{display:none}
section.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem;margin-bottom:.7rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.82rem}
.note{color:var(--muted);font-size:.76rem;margin:-.3rem 0 .6rem}
select,input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;
  padding:.45rem .6rem;font-size:.9rem;font-family:inherit;max-width:100%}
.btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:.5rem .9rem;font-size:.85rem;
  cursor:pointer;text-decoration:none;display:inline-block}
.btn.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.small{padding:.32rem .6rem;font-size:.78rem}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn)}
.btn.danger{background:var(--danger)}
.btn.money{background:var(--money)}
.btn.ta{background:var(--ta)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.item{display:flex;justify-content:space-between;align-items:flex-start;padding:.5rem 0;
  border-bottom:1px solid var(--border);gap:.5rem}
.item:last-child{border-bottom:none}
.item .name{font-size:.92rem}
.item.served{opacity:.65}
.item.served .name{text-decoration:line-through}
.item .price{color:var(--muted);font-size:.8rem}
.notetag{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);font-size:.72rem;
  padding:.05rem .35rem;border-radius:5px;margin-left:.25rem}
.cart-bottom{position:fixed;bottom:0;left:0;right:0;z-index:80;
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--primary) 6%,var(--surface)));
  border-top:2px solid var(--primary);box-shadow:0 -4px 16px rgba(0,0,0,.12);
  padding:.6rem .8rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom,0px))}
.cart-bottom .cb-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:.55rem}
.cart-bottom .cb-cart{flex:0 0 auto;background:var(--surface);border:2px solid var(--primary);color:var(--primary-d);
  border-radius:12px;padding:.7rem .9rem;font-size:1rem;font-weight:800;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;min-width:78px}
.cart-bottom .cb-cart:active{transform:scale(.95)}
.cart-bottom .cb-cart .cb-cart-icon{font-size:1.3rem;line-height:1}
.cart-bottom .cb-cart .cb-cart-count{font-size:.72rem;margin-top:.15rem;color:var(--muted);font-weight:600}
.cart-bottom .cb-cart .cb-cart-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;
  border-radius:999px;min-width:22px;height:22px;font-size:.72rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 6px rgba(180,50,42,.5)}
.cart-bottom .cb-send{flex:1;background:linear-gradient(135deg,#e2793d,#c0521f);color:#fff;border:none;
  border-radius:12px;padding:1rem 1.2rem;font-size:1.08rem;font-weight:800;letter-spacing:.03em;cursor:pointer;
  box-shadow:0 4px 12px rgba(192,82,31,.4)}
.cart-bottom .cb-send:active{transform:scale(.98)}
.cart-bottom .cb-send.ta{background:linear-gradient(135deg,var(--ta),#6a3b8a);box-shadow:0 4px 12px rgba(139,79,184,.4)}
.cart-bottom .cb-send:disabled{opacity:.5;cursor:not-allowed}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.7rem;
  background:var(--surface);border-radius:12px;padding:.35rem;border:1px solid var(--border)}
.mode-tabs button{padding:.75rem .5rem;border:none;border-radius:9px;background:transparent;color:var(--text);
  font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem}
.mode-tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff}
.mode-tabs button.active.ta{background:linear-gradient(135deg,var(--ta),#6a3b8a)}
.ta-info-bar{background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 12%,var(--surface)),var(--surface));
  border:1px solid var(--ta);border-radius:12px;padding:.7rem .85rem;margin-bottom:.7rem}
.ta-info-bar b{color:var(--ta)}
.tbl-matrix{display:grid;grid-template-columns:24px repeat(4,1fr);gap:.35rem}
.mcell{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);font-weight:700}
.tbl{border-radius:9px;padding:.45rem .25rem;text-align:center;cursor:pointer;border:1px solid var(--border);font-size:.74rem}
.tbl.trong{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.tbl.busy{background:color-mix(in srgb,var(--warn) 22%,var(--surface))}
.tbl.merged{background:color-mix(in srgb,var(--p4) 18%,var(--surface));opacity:.75;cursor:pointer}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.72rem;color:#fff}
.badge.p1{background:var(--p1)}.badge.p2{background:var(--p2)}.badge.p3{background:var(--p3)}
.badge.p4{background:var(--p4)}.badge.p5{background:var(--p5)}
.badge.st{background:var(--muted)}.badge.drink{background:var(--p2)}.badge.service{background:var(--p3)}
.badge.out{background:var(--danger)}.badge.temp{background:var(--warn)}.badge.paid{background:var(--ok)}
.badge.void{background:var(--muted);text-decoration:line-through}.badge.money{background:var(--money)}
.badge.ta{background:var(--ta)}
.kgroup{border:1px solid var(--border);border-radius:10px;padding:.65rem;margin-bottom:.6rem;background:var(--surface)}
.kgroup.hot{border-color:var(--danger);box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 18%,transparent)}
.kgroup.ta{border-color:var(--ta);background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 6%,var(--surface)),var(--surface))}
.khead{display:flex;justify-content:space-between;align-items:center;gap:.7rem}
.kinfo{flex:1;min-width:0}
.kmeta{font-size:.76rem;color:var(--muted);margin-top:.2rem}
.knote{font-size:.78rem;color:var(--warn);margin-top:.2rem;font-weight:600}
.kbtn{font-size:1.02rem !important;padding:.85rem 1.5rem !important;font-weight:800;flex-shrink:0;
  box-shadow:0 3px 8px rgba(47,122,79,.35)}
.ksec-title{font-weight:700;margin:.9rem 0 .4rem;padding:.4rem .7rem;border-radius:8px;display:inline-block;font-size:.9rem}
.ksec-title.food{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.ksec-title.drink{background:color-mix(in srgb,var(--p2) 20%,transparent);color:var(--p2)}
.ksec-title.service{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.ksec-title.done{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem;text-align:center}
.stat .n{font-size:1.15rem;font-weight:700;color:var(--primary-d)}
.stat .l{font-size:.74rem;color:var(--muted)}
.stat .delta{font-size:.74rem;font-weight:700;margin-top:.2rem}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:.4rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.4rem .3rem;border-bottom:1px solid var(--border);vertical-align:middle}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:1rem;
  max-height:90vh;overflow:auto;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
.close-x{float:right;background:none;border:none;font-size:1.1rem;color:var(--muted);cursor:pointer}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:1.2rem 0}
.qrbox{display:flex;gap:.6rem;flex-wrap:wrap}
.qrcard{border:1px solid var(--border);border-radius:10px;padding:.6rem;text-align:center;width:150px}
.qrimg img{width:110px;height:110px;image-rendering:pixelated;margin:.4rem auto;display:block;background:#fff;border-radius:6px}
label.fl{display:block;font-size:.8rem;color:var(--muted);margin:.55rem 0 .15rem}
label.fl input,label.fl select,label.fl textarea{width:100%}
.tiny{font-size:.74rem}
.alert-banner{background:color-mix(in srgb,var(--danger) 15%,var(--surface));border:1px solid var(--danger);
  border-radius:10px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:.85rem;color:var(--danger);font-weight:600}
.alert-banner .details{font-weight:400;font-size:.78rem;margin-top:.2rem;color:var(--text)}
.call-btn{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom,0px));right:14px;z-index:75;
  background:var(--danger);color:#fff;border:none;border-radius:999px;padding:.65rem 1rem;
  font-size:.85rem;font-weight:700;box-shadow:0 4px 14px rgba(180,50,42,.5);cursor:pointer}
.call-btn.called{background:var(--muted)}
.recipe-row{display:flex;gap:.4rem;align-items:center;margin-bottom:.35rem}
.recipe-row select{flex:1;min-width:0}
.recipe-row input{width:80px;text-align:right}
.recipe-row .unit{font-size:.78rem;color:var(--muted);width:34px;text-align:center}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.45rem 0;border-bottom:1px dashed var(--border)}
.payrow .qq{display:flex;align-items:center;gap:.25rem;flex:0 0 auto}
.payrow .qq button{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;cursor:pointer}
.payrow .qq input{width:56px;text-align:center;padding:.3rem}
input[type="number"]{text-align:right}
.ing-row{display:grid;grid-template-columns:1fr 70px 90px 70px 70px 30px;gap:.35rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.8rem}
.ing-row.header{font-weight:700;color:var(--muted);font-size:.72rem;border-bottom:2px solid var(--border)}
.ing-row input{padding:.25rem .35rem;font-size:.8rem}
.gchart{display:flex;gap:6px;align-items:flex-end;height:200px;padding:.4rem 0 .2rem;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:.3rem}
.gday{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;min-width:48px}
.gbars{display:flex;gap:1px;align-items:flex-end;height:140px}
.gbar{width:11px;border-radius:3px 3px 0 0;transition:opacity .15s}
.gbar.rev{background:linear-gradient(to top,#c0521f,#e2793d)}
.gbar.cost{background:linear-gradient(to top,#8a6d1c,#e0b23a)}
.gbar.profit{background:linear-gradient(to top,#1f6b3f,#4fae79)}
.gday .glbl{font-size:.62rem;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.75rem;margin-top:.3rem}
.legend span{display:flex;align-items:center;gap:.3rem}
.legend .dot{width:10px;height:10px;border-radius:2px}
.legend .dot.rev{background:var(--primary)}.legend .dot.cost{background:var(--warn)}.legend .dot.profit{background:var(--ok)}
.filter-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.filter-bar button{font-size:.75rem;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
.filter-bar button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.menu-cat{margin-bottom:1.2rem}
.menu-cat-h{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 .6rem;padding:.55rem .8rem;
  border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--wood),var(--wood-d));
  border-left:4px solid var(--beer);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.menu-cat-h .ci{font-size:1.3rem}
.menu-cat-h .cn{font-weight:800;font-size:1rem;letter-spacing:.04em;text-transform:uppercase}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.7rem}
.menu-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.menu-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.menu-card .m-img{position:relative;height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 25% 25%,#ffe6b8 0%,transparent 55%),
    radial-gradient(circle at 80% 80%,#f0b878 0%,transparent 60%),
    linear-gradient(135deg,#f5d4a8,#e8b878)}
.menu-card .m-img img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.18));border-radius:4px}
.menu-card .m-img .emoji{font-size:4rem;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));line-height:1}
.menu-card .m-body{padding:.65rem .75rem .75rem}
.menu-card .m-name{font-weight:800;font-size:1.06rem;margin:0 0 .25rem;color:var(--primary-d);line-height:1.3}
.menu-card .m-price{font-weight:600;font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
.menu-card .m-tag-best{display:inline-block;font-size:.62rem;padding:.12rem .45rem;border-radius:999px;
  background:linear-gradient(135deg,#e0a021,#b8741c);color:#fff;font-weight:800;margin-left:.3rem;vertical-align:middle}
.menu-card .m-note{font-size:.73rem;color:var(--muted);margin:.25rem 0}
.menu-card.out{opacity:.55;filter:grayscale(.6)}
.menu-card.out .m-name{text-decoration:line-through}
.menu-card .m-actions{display:flex;align-items:center;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.menu-card .m-actions button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:1.05rem;font-weight:700;cursor:pointer}
.menu-card .m-actions button.caseb{width:auto;padding:0 .6rem;font-size:.72rem;font-weight:700;
  background:linear-gradient(135deg,#2e6da4,#1f4f7a);color:#fff;border-color:#1f4f7a}
.menu-card .m-actions .qn{min-width:28px;text-align:center;font-weight:800;font-size:1rem;color:var(--primary-d)}
.menu-card .m-noteinput{width:100%;margin-top:.45rem;font-size:.75rem;padding:.35rem .55rem;
  border-radius:8px;border:1px dashed var(--border)}
.svc-summary{background:color-mix(in srgb,var(--beer) 12%,var(--surface));border:1px solid var(--beer);
  border-radius:8px;padding:.45rem .65rem;margin-top:.5rem;font-size:.82rem}
.svc-summary b{color:var(--primary-d)}
.fin-money-in{color:var(--money);font-weight:700}
.fin-money-out{color:var(--danger);font-weight:700}
.fin-box{background:linear-gradient(135deg,color-mix(in srgb,var(--money) 10%,var(--surface)),var(--surface));
  border:1px solid var(--money);border-radius:12px;padding:.9rem;text-align:center;margin-bottom:.7rem}
.fin-box .n{font-size:1.6rem;font-weight:800;color:var(--money)}
.fin-box.neg .n{color:var(--danger)}
.fin-box.neg{border-color:var(--danger);background:linear-gradient(135deg,color-mix(in srgb,var(--danger) 10%,var(--surface)),var(--surface))}
.fin-box .l{font-size:.78rem;color:var(--muted);margin-top:.2rem}
.preset-btn{display:block;width:100%;padding:.7rem;margin-bottom:.4rem;border:1px solid var(--border);
  background:var(--bg);color:var(--text);border-radius:10px;font-size:.95rem;font-weight:600;text-align:left;cursor:pointer}
.qr-upload-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;margin:.5rem 0}
.qr-up-card{border:1px solid var(--border);border-radius:10px;padding:.5rem;text-align:center;background:var(--bg)}
.qr-up-card .preview{width:100%;height:120px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:.4rem}
.qr-up-card .preview img{width:100%;height:100%;object-fit:contain}
.qr-up-card .tname{font-weight:700;font-size:.85rem;margin-bottom:.3rem}
.qr-up-card .actions{display:flex;gap:.25rem;justify-content:center;flex-wrap:wrap}
.qr-up-card .actions button,.qr-up-card .actions label{font-size:.68rem;padding:.25rem .45rem}
.ta-card{border:1px solid var(--ta);border-radius:12px;padding:.7rem;background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 8%,var(--surface)),var(--surface));margin-bottom:.6rem;cursor:pointer}
.ta-card .ta-h{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.ta-card .ta-id{font-weight:800;color:var(--ta);font-size:1rem}
.ta-card .ta-name{font-weight:700;font-size:.9rem;color:var(--text)}
.ta-card .ta-info{font-size:.76rem;color:var(--muted);margin-top:.15rem}
.ta-card .ta-total{font-weight:800;color:var(--primary-d);text-align:right}
.suggest-row{display:flex;gap:.5rem;align-items:center;padding:.5rem .6rem;border-radius:10px;margin-bottom:.35rem;
  background:var(--bg);border:1px solid var(--border)}
.suggest-row .sr-cat{flex:0 0 auto;font-size:.68rem;font-weight:700;padding:.15rem .45rem;border-radius:999px;color:#fff}
.suggest-row .sr-cat.kv{background:var(--p3)}.suggest-row .sr-cat.mn{background:var(--primary)}
.suggest-row .sr-cat.lau{background:var(--p2)}.suggest-row .sr-cat.bia{background:var(--beer)}
.suggest-row .sr-cat.nuoc{background:var(--p4)}
.suggest-row .sr-info{flex:1;min-width:0}
.suggest-row .sr-name{font-weight:700;font-size:.9rem;color:var(--text)}
.suggest-row .sr-meta{font-size:.74rem;color:var(--muted);margin-top:.1rem}
.suggest-row .sr-price{font-weight:800;color:var(--primary-d);font-size:.9rem;text-align:right;flex:0 0 auto}
.suggest-row .sr-qty{display:flex;align-items:center;gap:.25rem;flex:0 0 auto}
.suggest-row .sr-qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9rem;cursor:pointer}
.suggest-row .sr-qty span{min-width:24px;text-align:center;font-weight:700;font-size:.9rem}
.cart-row{display:flex;gap:.55rem;align-items:flex-start;padding:.65rem .7rem;border-radius:10px;margin-bottom:.4rem;
  background:var(--bg);border:1px solid var(--border)}
.cart-row .cr-img{flex:0 0 auto;width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#f5d4a8,#e8b878);
  display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:1.6rem}
.cart-row .cr-img img{width:100%;height:100%;object-fit:cover}
.cart-row .cr-info{flex:1;min-width:0}
.cart-row .cr-name{font-weight:700;font-size:.9rem;color:var(--text);line-height:1.25}
.cart-row .cr-meta{font-size:.74rem;color:var(--muted);margin-top:.15rem}
.cart-row .cr-note{font-size:.74rem;color:var(--warn);margin-top:.15rem;font-weight:600}
.cart-row .cr-controls{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex:0 0 auto}
.cart-row .cr-qty{display:flex;align-items:center;gap:.25rem}
.cart-row .cr-qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer}
.cart-row .cr-qty button:active{transform:scale(.92)}
.cart-row .cr-qty span{min-width:28px;text-align:center;font-weight:800;font-size:1rem;color:var(--primary-d)}
.cart-row .cr-rm{background:none;border:none;color:var(--danger);font-size:.72rem;cursor:pointer;text-decoration:underline}
.cart-footer{position:sticky;bottom:0;background:var(--surface);border-top:2px solid var(--border);
  padding:.7rem .3rem .3rem;margin-top:.5rem}
@media (max-width:600px){
  .ing-row{grid-template-columns:1.3fr 60px 80px 60px 60px 28px;font-size:.74rem}
  .kbtn{font-size:.92rem !important;padding:.7rem 1rem !important}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .menu-card .m-img{height:150px}
  .menu-card .m-img .emoji{font-size:3.2rem}
  .menu-card .m-name{font-size:1rem}
  .cart-bottom .cb-cart{min-width:68px;padding:.6rem .7rem}
  .cart-bottom .cb-send{font-size:1rem;padding:.85rem 1rem}
}

function toArr(v){
  if(Array.isArray(v)) return v;
  if(v && typeof v === "object"){
    return Object.keys(v)
      .sort((a,b)=>{const na=Number(a),nb=Number(b); if(!isNaN(na)&&!isNaN(nb)) return na-nb; return String(a).localeCompare(String(b));})
      .map(k=>v[k]);
  }
  return [];
}
function fmtShort(n){
  if(Math.abs(n) >= 1000000) return (n/1000000).toFixed(1) + "M";
  if(Math.abs(n) >= 1000) return Math.round(n/1000) + "K";
  return String(Math.round(n));
}
function proxiedImgUrl(raw){
  if(!raw) return "";
  if(raw.startsWith("data:")) return raw;
  if(raw.startsWith("http")) return `https://images.weserv.nl/?url=${encodeURIComponent(raw)}&w=600&output=jpg&q=80`;
  return raw;
}
function readImageAsResizedDataUrl(file, maxW, maxH, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const ratio = Math.min(maxW/w, maxH/h, 1);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL("image/jpeg", quality || 0.8)); } catch(e){ reject(e); }
      };
      img.onerror = ()=>reject(new Error("Không đọc được ảnh"));
      img.src = ev.target.result;
    };
    reader.onerror = ()=>reject(new Error("Lỗi đọc file"));
    reader.readAsDataURL(file);
  });
}

function stripImagesForSync(st){
  // Trả về bản sao state KHÔNG kèm ảnh (imgData) để gửi lên Firebase cho nhẹ.
  // Ảnh được đồng bộ riêng qua fbImagesRef (xem saveMenuImage / listener ocnuong/images).
  st.menu = (st.menu||[]).map(m=>{ const c = {...m}; delete c.imgData; return c; });
  return st;
}
function applyImagesCache(){
  // Gán lại ảnh đã lưu cục bộ/đã đồng bộ (imagesCache) vào state.menu theo id món.
  if(!state.menu) return;
  state.menu.forEach(m=>{
    if(Object.prototype.hasOwnProperty.call(imagesCache, m.id)){
      m.imgData = imagesCache[m.id] || "";
    }
  });
}
function saveMenuImage(id, dataUrl){
  // Ghi/xoá MỘT ảnh món tại nhánh riêng ocnuong/images/{id} - không đụng tới state chính.
  imagesCache[id] = dataUrl || "";
  if(!firebaseReady || !fbImagesRef) return;
  fbImagesRef.child(id).set(dataUrl || null).catch(err=>{
    console.error("[Firebase] Lỗi lưu ảnh:", err);
  });
}

function migrateState(st){
  if(!st || typeof st !== "object") st = seed();
  st.orders = toArr(st.orders).map(o=>({...o,
    qty: Number(o.qty)||0, price: Number(o.price)||0, prio: Number(o.prio)||1,
    prep: Number(o.prep)||5, ts: Number(o.ts)||Date.now(),
    status: o.status || "cho_bep", table: String(o.table||""), name: String(o.name||"")
  }));
  st.invoices = toArr(st.invoices).map(inv=>({...inv,
    items: toArr(inv.items).map(it=>({...it,
      qty: Number(it.qty)||0, price: Number(it.price)||0, cost: Number(it.cost)||0,
      name: String(it.name||""), note: String(it.note||"")
    })),
    ts: Number(inv.ts)||Date.now(), subtotal: Number(inv.subtotal)||0,
    tax: Number(inv.tax)||0, total: Number(inv.total)||0, taxRate: Number(inv.taxRate)||0,
    servicePrice: Number(inv.servicePrice)||0, deliveryFee: Number(inv.deliveryFee)||0,
    table: String(inv.table||""), type: inv.type||"final", status: inv.status||"paid"
  }));
  st.cancelLogs = toArr(st.cancelLogs).map(l=>({...l,
    qty: Number(l.qty)||0, price: Number(l.price)||0, ts: Number(l.ts)||Date.now()
  }));
  st.calls = toArr(st.calls).map(c=>({...c,
    ts: Number(c.ts)||Date.now(), table: String(c.table||""), handled: !!c.handled
  }));
  st.purchases = toArr(st.purchases).map(p=>({...p,
    qty: Number(p.qty)||0, unitPrice: Number(p.unitPrice)||0,
    total: Number(p.total)||0, ts: Number(p.ts)||Date.now()
  }));
  st.expenses = toArr(st.expenses).map(e=>({...e,
    amount: Number(e.amount)||0, ts: Number(e.ts)||Date.now()
  }));
  st.recurringExpenses = toArr(st.recurringExpenses).map(r=>({...r,
    amount: Number(r.amount)||0, name: String(r.name||""), createdTs: Number(r.createdTs)||Date.now()
  }));
  st.menu = toArr(st.menu);
  if(!st.menu.length) st.menu = SEED_MENU.map(x=>({...x, recipe: toArr(x.recipe).map(r=>({...r}))}));
  st.menu.forEach(m=>{
    delete m.rarity;
    if(m.emoji === undefined) m.emoji = "🍽️";
    if(m.img === undefined) m.img = "";
    if(m.imgData === undefined) m.imgData = "";
    m.price = Number(m.price)||0; m.prep = Number(m.prep)||5; m.prio = Number(m.prio)||1;
    m.laborCost = Number(m.laborCost)||0; m.otherCost = Number(m.otherCost)||0;
    m.caseSize = m.caseSize ? Number(m.caseSize) : undefined;
    m.recipe = toArr(m.recipe).map(r=>({...r, qty: Number(r.qty)||0, ingId: String(r.ingId||"")}))
      .filter(r=>r.ingId && r.qty > 0);
  });
  st.ingredients = toArr(st.ingredients);
  if(!st.ingredients.length) st.ingredients = SEED_ING.map(x=>({...x}));
  st.ingredients.forEach(i=>{
    i.price = Number(i.price)||0; i.stock = Number(i.stock)||0; i.minStock = Number(i.minStock)||0;
    i.name = String(i.name||""); i.unit = String(i.unit||"kg");
  });
  st.tableSessions = st.tableSessions && typeof st.tableSessions === "object" ? st.tableSessions : {};
  st.merges = st.merges && typeof st.merges === "object" ? st.merges : {};
  st.tableServices = st.tableServices && typeof st.tableServices === "object" ? st.tableServices : {};
  st.qrImages = st.qrImages && typeof st.qrImages === "object" ? st.qrImages : {};
  st.takeawayMeta = st.takeawayMeta && typeof st.takeawayMeta === "object" ? st.takeawayMeta : {};
  st.takeawayCounter = Number(st.takeawayCounter)||0;
  st.seq = Number(st.seq)||1;
  st.brand = Object.assign({name:"ỐC NƯỚNG",sub:"",dev:"",logo:"🐚",address:"",phone:"",openHours:""}, st.brand||{});
  st.settings = Object.assign({
    managerPin:"1234", cancelApproval:true, taxEnabled:false, taxRate:8,
    autoDisableByStock: true, serviceFeeEnabled: true, openingBalance: 0, deliveryFee: 15000
  }, st.settings||{});
  st.settings.bank = Object.assign({enabled:false,bankId:"VCB",accountNumber:"",accountHolder:"",qrImageUrl:"",showOnBill:true}, st.settings.bank||{});
  st.meta = st.meta || {lastUpdate:0,lastClient:""};
  return st;
}
function loadLocal(){
  try{ const s = localStorage.getItem(STKEY); if(s) return migrateState(JSON.parse(s)); }catch(e){}
  return seed();
}
let state = loadLocal();
function saveLocal(){
  try{ localStorage.setItem(STKEY, JSON.stringify(state)); }
  catch(e){
    if(e.name === "QuotaExceededError" || (e.message||"").indexOf("quota")>=0){
      alert("⚠️ Bộ nhớ đầy (5MB). Xuất dữ liệu để backup.");
    } else console.error(e);
  }
}
function save(){
  state.meta = state.meta||{};
  state.meta.lastUpdate = Date.now();
  state.meta.lastClient = clientId;
  saveLocal();
  if(!firebaseReady || suppressWrite) return;
  if(MODE !== "staff" && !remoteSeeded) return; // máy khách chưa nhận dữ liệu thật thì chưa được ghi, tránh ghi đè bằng data cũ
  clearTimeout(writeTimer);
  writeTimer = setTimeout(()=>{
    const clean = stripImagesForSync(migrateState(JSON.parse(JSON.stringify(state))));
    fbRef.set(clean)
      .then(()=>{ if(!fbConnected) setSyncStatus("synced", "🟢 Ghi OK"); })
      .catch(err=>{
        console.error("[Firebase] WRITE ERROR:", err);
        if(err.code === "PERMISSION_DENIED"){
          setSyncStatus("offline", "🔴 Rules chưa Publish — Firebase Console");
        } else {
          setSyncStatus("offline", "🔴 " + (err.code||err.message));
        }
      });
  }, 400);
}
function setSyncStatus(kind, text){
  const dot = document.getElementById("syncDot");
  const st = document.getElementById("syncStatus");
  if(!dot || !st) return;
  dot.className = "sync-dot " + (kind === "synced" ? "on" : (kind === "offline" ? "off" : "syncing"));
  dot.title = text;
  st.textContent = text;
}
function updateSyncUI(){
  if(!firebaseReady){ setSyncStatus("local", "Local"); return; }
  if(fbConnected) setSyncStatus("synced", "🟢 Đồng bộ realtime");
  else setSyncStatus("offline", "🔴 Mất kết nối");
}
function initFirebase(){
  const cfg = FIREBASE_CONFIG;
  console.log("[Firebase] Config:", {databaseURL: cfg.databaseURL, projectId: cfg.projectId});
  if(!cfg || !cfg.databaseURL){ setSyncStatus("local", "Chưa cấu hình Firebase"); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    const db = firebase.database();
    fbRef = db.ref("ocnuong/state");
    fbImagesRef = db.ref("ocnuong/images");
    db.ref(".info/connected").on("value", s=>{
      fbConnected = !!s.val();
      console.log("[Firebase]", fbConnected ? "✅ Connected" : "⚠️ Disconnected");
      if(fbConnected) setSyncStatus("syncing", "🟡 Đang kết nối...");
      else setSyncStatus("offline", "🔴 Mất kết nối mạng");
      updateSyncUI();
    });
    // Nhánh ẢNH đồng bộ RIÊNG (nhẹ, ít thay đổi) - không làm nặng nhánh state (đơn hàng/bàn) vốn cập nhật liên tục.
    fbImagesRef.on("value", snap=>{
      try{
        imagesCache = snap.val() || {};
        applyImagesCache();
        saveLocal();
        renderAll();
      }catch(err){ console.error("[Firebase] Lỗi nhận ảnh:", err); }
    }, err=>{ console.error("[Firebase] LISTEN IMAGES ERROR:", err); });
    fbRef.on("value", snap=>{
      try{
        const remote = snap.val();
        if(!remote){
          // CHỈ máy QUÁN (staff/quản lý) được phép khởi tạo dữ liệu khi database trống.
          // Máy KHÁCH (quét mã QR) tuyệt đối không tự đẩy dữ liệu lên, tránh ghi đè bằng
          // dữ liệu cũ còn lưu trong điện thoại khách (nguyên nhân gây "mất đồng bộ" sau khi xoá database).
          if(MODE !== "staff"){
            setSyncStatus("syncing", "🟡 Đang chờ dữ liệu từ quán...");
            return;
          }
          console.log("[Firebase] Database trống, đẩy state local lên (transaction an toàn)...");
          const seedClean = stripImagesForSync(migrateState(JSON.parse(JSON.stringify(state))));
          fbRef.transaction(current=>{
            // Nếu lúc transaction chạy mà đã có dữ liệu (máy khác vừa ghi) thì KHÔNG ghi đè.
            if(current === null || current === undefined) return seedClean;
            return; // abort, giữ nguyên dữ liệu đã có
          }, (err, committed)=>{
            if(err){
              console.error("[Firebase] Lỗi đẩy state:", err);
              if(err.code === "PERMISSION_DENIED") setSyncStatus("offline", "🔴 Rules chưa Publish — Firebase Console → Rules");
              else setSyncStatus("offline", "🔴 " + (err.code||err.message));
            } else if(committed){
              console.log("[Firebase] ✅ Đẩy state lần đầu OK (là máy khởi tạo)");
              // Máy thắng transaction cũng đẩy luôn ảnh cục bộ (nếu có) lên nhánh ảnh riêng.
              state.menu.forEach(m=>{ if(m.imgData) saveMenuImage(m.id, m.imgData); });
              remoteSeeded = true;
              setSyncStatus("synced", "🟢 Đã kết nối");
            } else {
              remoteSeeded = true;
              setSyncStatus("synced", "🟢 Đã kết nối");
            }
          });
          return;
        }
        remoteSeeded = true;
        if(remote.meta && remote.meta.lastClient === clientId) return;
        console.log("[Firebase] 📥 Nhận dữ liệu từ remote");
        suppressWrite = true;
        state = migrateState(remote);
        applyImagesCache();
        saveLocal();
        renderAll();
        const now = new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
        setSyncStatus("synced", `🟢 Đồng bộ lúc ${now}`);
        setTimeout(()=>{ suppressWrite = false; }, 500);
      }catch(err){
        console.error("[Firebase] Lỗi xử lý dữ liệu:", err);
        setSyncStatus("offline", "🔴 Lỗi dữ liệu: " + err.message);
      }
    }, err=>{
      console.error("[Firebase] LISTEN ERROR:", err);
      if(err.code === "PERMISSION_DENIED") setSyncStatus("offline", "🔴 Rules chưa Publish — Firebase Console → Rules");
      else setSyncStatus("offline", "🔴 " + (err.code||err.message));
    });
    firebaseReady = true;
    updateSyncUI();
  }catch(e){
    console.error("[Firebase] INIT ERROR:", e);
    setSyncStatus("offline", "🔴 Không khởi tạo được: " + e.message);
  }
}

   HELPERS
   ============================================================ */
function resolveTable(t){
  let cur = t, guard = 0; const visited = new Set();
  while(state.merges[cur] && guard++ < 20){
    if(visited.has(cur)){ delete state.merges[cur]; break; }
    visited.add(cur); cur = state.merges[cur];
  }
  return cur;
}
function mergedChildren(t){ return Object.keys(state.merges).filter(k=>resolveTable(k)===t); }
function getTableService(t){ return state.tableServices[t] || {note:"", price:0}; }
function setTableService(t, svc){
  if(!svc.note && !svc.price) delete state.tableServices[t];
  else state.tableServices[t] = svc;
  save();
}
function getTAMeta(id){ return state.takeawayMeta[id] || {name:"",phone:"",address:"",note:"",pickup:false}; }
function setTAMeta(id, meta){ state.takeawayMeta[id] = meta; save(); }
function nextTAId(){ state.takeawayCounter = (state.takeawayCounter||0) + 1; return "TA" + state.takeawayCounter; }
function getActiveTAs(){
  const ids = new Set();
  state.orders.forEach(o=>{ if(o.status !== "huy" && isTakeawayId(o.table)) ids.add(o.table); });
  return Array.from(ids).sort((a,b)=>(parseInt(a.replace("TA",""))||0) - (parseInt(b.replace("TA",""))||0));
}
function itemIngredientCost(m){
  return (m.recipe||[]).reduce((s,r)=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return s + (ing ? ing.price * r.qty : 0);
  }, 0);
}
function itemCost(m){ return itemIngredientCost(m) + (m.laborCost||0) + (m.otherCost||0); }
function itemMargin(m){
  const cost = itemCost(m);
  const profit = m.price - cost;
  return m.price > 0 ? profit / m.price : 0;
}
function buildBankQrUrl(amount, desc){
  const b = state.settings.bank || {};
  if(!b.enabled) return "";
  if(b.qrImageUrl) return b.qrImageUrl;
  if(!b.accountNumber) return "";
  return `https://img.vietqr.io/image/${b.bankId}-${b.accountNumber}-compact2.png?amount=${Math.max(0,Math.round(amount||0))}&addInfo=${encodeURIComponent(desc||"Thanh toan")}&accountName=${encodeURIComponent(b.accountHolder||"")}`;
}
function isBankConfigured(){
  const b = state.settings.bank || {};
  return b.enabled && (b.qrImageUrl || b.accountNumber);
}
function itemImageHtml(m){
  const raw = m.imgData || m.img;
  if(raw){
    const proxied = proxiedImgUrl(raw);
    const fb = raw.startsWith("data:") ? "" : raw;
    const fbAttr = fb
      ? `onerror="if(this.dataset.fb!=1 && this.src!==\`${esc(fb)}\`){this.dataset.fb=1;this.src=\`${esc(fb)}\`;return;}this.style.display='none';this.parentElement.innerHTML='<span class=emoji>${esc(m.emoji||'🍽️')}</span>'"`
      : `onerror="this.style.display='none';this.parentElement.innerHTML='<span class=emoji>${esc(m.emoji||'🍽️')}</span>'"`;
    return `<img src="${esc(proxied)}" loading="eager" referrerpolicy="no-referrer" crossorigin="anonymous" ${fbAttr}>`;
  }
  return `<span class="emoji">${esc(m.emoji||'🍽️')}</span>`;
}
function isItemOrderable(m){
  if(!m.available) return false;
  if(!state.settings.autoDisableByStock) return true;
  if(!m.recipe || !m.recipe.length) return true;
  return m.recipe.every(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return ing && ing.stock >= r.qty;
  });
}
function itemsShortage(m){
  return (m.recipe||[]).filter(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return !ing || ing.stock < r.qty;
  }).map(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return ing ? ing.name : "(đã xoá)";
  });
}
function getCats(){
  const list = [...BASE_CATS];
  state.menu.forEach(m=>{ if(m.cat && !list.includes(m.cat)) list.push(m.cat); });
  return list;
}
function typeOf(cat){
  if(cat === "Đồ uống") return "drink";
  if(cat === "Khăn & Dụng cụ") return "service";
  return "food";
}
function typeOfItem(itemId){
  const m = state.menu.find(x=>x.id === itemId);
  return m ? typeOf(m.cat) : "food";
}
function statusLabel(s){ return {cho_bep:"⏳ Chờ bếp",dang_lam:"🔥 Đang làm",hoan_thanh:"✅ Đã xong",huy:"❌ Đã hủy"}[s] || s; }

  root.querySelectorAll("[data-cart-inc]").forEach(b=>b.onclick = ()=>{
    const id = b.dataset.cartInc;
    if(cart[id]) cart[id].qty++;
    renderCartModal(); renderCartBottomBar();
  });
  root.querySelectorAll("[data-cart-dec]").forEach(b=>b.onclick = ()=>{
    const id = b.dataset.cartDec;
    if(cart[id]){
      cart[id].qty--;
      if(cart[id].qty <= 0) delete cart[id];
    }
    renderCartModal(); renderCartBottomBar();
  });
  root.querySelectorAll("[data-cart-rm]").forEach(b=>b.onclick = ()=>{
    const id = b.dataset.cartRm;
    if(!cart[id]) return;
    if(!confirm(`Xóa "${state.menu.find(m=>m.id===id)?.name||'món'}" khỏi giỏ?`)) return;
    delete cart[id];
    renderCartModal(); renderCartBottomBar();
  });
  root.querySelectorAll("[data-cart-note]").forEach(inp=>inp.oninput = ()=>{
    const id = inp.dataset.cartNote;
    if(cart[id]) cart[id].note = inp.value;
  });
  const sendBtn = document.getElementById("cartSendBtn");
  if(sendBtn) sendBtn.onclick = ()=>{
    closeCartModal();
    if(isTA) doSendTakeaway();
    else doSendToKitchen();
  };
  const clrBtn = document.getElementById("cartClearBtn");
  if(clrBtn) clrBtn.onclick = ()=>{
    if(!confirm("Xóa toàn bộ giỏ hàng?")) return;
    cart = {};
    renderCartModal(); renderCartBottomBar();
  };
}
function suggestMenu(guestCount, style, includeLau, includeBia, includeNuoc){
  const mult = style === "tietkiem" ? 0.8 : (style === "sang" ? 1.4 : 1);
  const pickBest = (catList, count) => {
    const items = state.menu.filter(m => m.available && catList.includes(m.cat) && isItemOrderable(m));
    return items.map(m=>({
      m, score: itemMargin(m) * 60 + (m.tag === "best" ? 40 : (m.tag === "good" ? 20 : 0))
    })).sort((a,b)=>b.score - a.score).slice(0, count);
  };
  const result = [];
  pickBest(["Món khai vị"], Math.max(1, Math.ceil(guestCount / 4))).forEach(r=>{
    result.push({m: r.m, qty: 1, cat: "khai_vi"});
  });
  const mainCats = ["Ốc hương","Ốc móng tay","Sò huyết","Hàu","Món gà","Món bò - bê","Combo nướng"];
  const mainCount = Math.max(2, Math.ceil(guestCount * mult));
  pickBest(mainCats, mainCount).forEach(r=>{
    result.push({m: r.m, qty: 1, cat: "man"});
  });
  if(includeLau){
    const lauCount = Math.max(1, Math.ceil(guestCount / 4));
    pickBest(["Món lẩu"], lauCount).forEach(r=>{
      result.push({m: r.m, qty: 1, cat: "lau"});
    });
  }
  if(includeBia){
    const biaCount = Math.max(2, guestCount * 2);
    const biaItems = state.menu.filter(m => m.available && m.cat === "Đồ uống" && /bia/i.test(m.name) && isItemOrderable(m));
    biaItems.sort((a,b)=>itemMargin(b) - itemMargin(a));
    if(biaItems[0]) result.push({m: biaItems[0], qty: biaCount, cat: "bia"});
  }
  if(includeNuoc){
    const nuocItems = state.menu.filter(m => m.available && m.cat === "Đồ uống" && !/bia/i.test(m.name) && isItemOrderable(m));
    nuocItems.sort((a,b)=>itemMargin(b) - itemMargin(a));
    if(nuocItems[0]) result.push({m: nuocItems[0], qty: Math.max(1, Math.ceil(guestCount / 2)), cat: "nuoc"});
  }
  return result;
}

function doSendToKitchen(){
  if(sending) return;
  const n = cartCount();
  if(n === 0){ alert("Chưa chọn món nào"); return; }
  sending = true;
  const now = nowMs();
  const real = resolveTable(currentTable);
  if(!state.tableSessions[real]) state.tableSessions[real] = now;
  Object.entries(cart).forEach(([id,c])=>{
    if(!c.qty) return;
    const m = state.menu.find(x=>x.id === id);
    if(!m || !isItemOrderable(m)) return;
    state.orders.push({
      id: uid("o"), table: real, itemId: id, name: m.name,
      qty: c.qty, price: m.price, prio: m.prio, prep: m.prep,
      note: (c.note||"").trim(), status: "cho_bep", ts: now, deducted: false
    });
  });
  cart = {}; save();
  setTimeout(()=>{ sending = false; }, 400);
  alert("✓ Đã gửi bếp!");
  renderAll();
}
function doSendTakeaway(){
  if(sending) return;
  const nameValid = taInfo.name.trim().length >= 2;
  const phoneValid = taInfo.phone && /^[0-9+\-\s]{8,15}$/.test(taInfo.phone.replace(/\s/g,''));
  const addrRequired = !taInfo.pickup;
  const addrValid = !addrRequired || taInfo.address.trim().length >= 5;
  if(!nameValid){ alert("Vui lòng nhập tên khách"); return; }
  if(!phoneValid){ alert("SĐT không hợp lệ"); return; }
  if(!addrValid){ alert("Nhập địa chỉ hoặc tích 'tự đến lấy'"); return; }
  const n = cartCount();
  if(n === 0){ alert("Chưa chọn món"); return; }
  sending = true;
  const now = nowMs();
  const taId = nextTAId();
  state.tableSessions[taId] = now;
  setTAMeta(taId, {
    name: taInfo.name.trim(), phone: taInfo.phone.trim(),
    address: taInfo.pickup ? "" : taInfo.address.trim(),
    note: taInfo.note.trim(), pickup: !!taInfo.pickup
  });
  Object.entries(cart).forEach(([id,c])=>{
    if(!c.qty) return;
    const m = state.menu.find(x=>x.id === id);
    if(!m || !isItemOrderable(m)) return;
    state.orders.push({
      id: uid("o"), table: taId, itemId: id, name: m.name,
      qty: c.qty, price: m.price, prio: m.prio, prep: m.prep,
      note: (c.note||"").trim(), status: "cho_bep", ts: now, deducted: false
    });
  });
  cart = {};
  taInfo = {name:"",phone:"",address:"",note:"",pickup:false};
  save();
  setTimeout(()=>{ sending = false; }, 400);
  alert(`✓ Đã gửi đơn mang về ${taId}!`);
  renderAll();
}

function tableOrders(t){ return state.orders.filter(o=>o.table === t && o.status !== "huy"); }
function tableTotal(t){ return tableOrders(t).reduce((s,o)=>s + o.qty*o.price, 0); }
function taTotal(taId){ return tableOrders(taId).reduce((s,o)=>s + o.qty*o.price, 0); }
function tableCellEl(t){
  const el = document.createElement("div");
  const isMergedInto = state.merges[t.id];
  if(isMergedInto){
    const real = resolveTable(t.id);
    el.className = "tbl merged";
    el.innerHTML = `<b>${t.id}</b><div class="muted">→ ${real}</div>`;
    el.onclick = ()=>{ activeModalTable = real; activeModalTA = null; actionMode = null; renderModal(); };
    return el;
  }
  const os = tableOrders(t.id); const busy = os.length > 0;
  const svc = state.tableServices[t.id];
  const hasCall = state.calls.some(c=>c.table === t.id && !c.handled);
  el.className = "tbl " + (busy ? "busy" : "trong");
  const elapsed = busy && state.tableSessions[t.id] ? `<div class="muted">${minsAgo(state.tableSessions[t.id])}'</div>` : "";
  const kids = mergedChildren(t.id);
  const kidTxt = kids.length ? `<div class="muted">+${kids.join(",")}</div>` : "";
  const svcTxt = svc ? `<div class="tiny" style="color:var(--p2)">+DV</div>` : "";
  const callTxt = hasCall ? `<div class="tiny" style="color:var(--danger);font-weight:800">🔔</div>` : "";
  el.innerHTML = `<b>${t.id}</b><div class="muted">${busy ? VND(tableTotal(t.id)) : "Trống"}</div>${elapsed}${kidTxt}${svcTxt}${callTxt}`;
  el.onclick = ()=>{ activeModalTable = t.id; activeModalTA = null; actionMode = null; renderModal(); };
  return el;
}

        ${done ? "✅ " : ""}${typeBadge} ${esc(o.name)} ×${o.qty}
        ${o.note ? `<span class="notetag">📝 ${esc(o.note)}</span>` : ""}
        <span class="badge st">${statusLabel(o.status)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:.4rem;flex:0 0 auto">
        <span>${VND(o.qty*o.price)}</span>${cancelBtn}
      </div>
    </div>`;
  }).join("");
  const seated = state.tableSessions[id] ? `<div class="muted">${isTA?'Tạo':'Ngồi'} ${minsAgo(state.tableSessions[id])} phút</div>` : "";
  const kids = isTA ? [] : mergedChildren(id);
  const kidLine = kids.length ? `<div class="muted">Gộp với: ${kids.join(", ")}</div>` : "";
  const svcLine = !isTA && (svc.note || svc.price) ? `<div class="svc-summary">➕ DV: <b>${esc(svc.note||"—")}</b> · <b>${VND(svc.price)}</b></div>` : "";
  const tableCalls = state.calls.filter(c=>c.table === id && !c.handled);
  const callLine = tableCalls.length
    ? `<div class="card" style="background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-color:var(--danger);margin-top:.6rem">
        🔔 <b>Khách gọi:</b>
        ${tableCalls.map(c=>{
          const info = callTypeInfo(c.type);
          return `<div style="margin-top:.3rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center">
            <div style="flex:1;min-width:0"><b>${info.icon}</b> ${esc(c.message||info.label)} <span class="muted tiny">· ${minsAgo(c.ts)}'</span></div>
            <button class="btn ok small" data-hc="${c.id}">✓</button>
          </div>`;
        }).join("")}
      </div>` : "";
  let taBlock = "";
  if(isTA){
    const badge = meta.pickup ? '<span class="badge p3">🏃 Tự đến lấy</span>' : '<span class="badge ta">🛵 Giao</span>';
    taBlock = `<div class="card" style="background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 10%,var(--surface)),var(--surface));border-color:var(--ta);margin-top:.5rem">
      <div class="row"><b style="color:var(--ta)">🥡 Đơn ${id}</b>${badge}</div>
      <div class="row" style="margin-top:.35rem"><span class="muted">👤</span><b>${esc(meta.name||"—")}</b></div>
      <div class="row"><span class="muted">📞</span><a href="tel:${esc(meta.phone)}" style="color:var(--primary-d);font-weight:700">${esc(meta.phone||"—")}</a></div>
      ${!meta.pickup ? `<div class="row"><span class="muted">📍</span><b style="text-align:right;flex:1">${esc(meta.address||"—")}</b></div>` : ""}
      ${meta.note ? `<div class="row"><span class="muted">📝</span><span style="text-align:right">${esc(meta.note)}</span></div>` : ""}
    </div>`;
  }
  let actionUI = "";
  if(!isTA && (actionMode === "merge" || actionMode === "transfer")){
    const isMerge = actionMode === "merge";
    const opts = TABLES.filter(x=>x.id !== id && resolveTable(x.id) !== id)
      .map(x=>`<option value="${x.id}">${x.id}${tableOrders(x.id).length ? " (có khách)" : ""}</option>`).join("");
    actionUI = `<div class="card" style="margin-top:.6rem;background:var(--bg)">
      <div class="muted">${isMerge ? '<b>Ghép bàn</b>' : '<b>Chuyển bàn</b>'}</div>
      <select id="actionTarget" style="width:100%;margin-top:.4rem">${opts}</select>
      <div class="row" style="margin-top:.5rem">
        <button class="btn ok" id="doAction">Xác nhận</button>
        <button class="btn secondary" id="cancelAction">Hủy</button>
      </div>
    </div>`;
  }
  const svcEnabled = state.settings.serviceFeeEnabled !== false && !isTA;
  const totalPreview = tableTotal(id) + (isTA ? 0 : (svc.price||0));
  root.innerHTML = `<div class="modal-back" id="mb"><div class="modal">
    <button class="close-x" id="mc">✕</button>
    <h3>${isTA ? '🥡 '+id : 'Bàn '+id}</h3>
    ${seated}${kidLine}${callLine}${taBlock}
    ${os.length ? rows : '<div class="empty">Chưa có món</div>'}
    ${svcLine}
    <div class="row" style="margin-top:.7rem"><b>Tổng: ${VND(totalPreview)}</b>
      ${svcEnabled?`<button class="btn secondary small" id="mSvc">➕ DV</button>`:''}
    </div>
    ${actionUI}
    <div class="row" style="margin-top:.7rem">
      <button class="btn secondary small" id="mPrint" ${os.length ? "" : "disabled"}>🖨️ Tạm tính</button>
      ${!isTA?`<button class="btn secondary small" id="mMerge" ${os.length ? "" : "disabled"}>⇄ Ghép</button>
      <button class="btn secondary small" id="mTransfer" ${os.length ? "" : "disabled"}>🔀 Chuyển</button>`:``}
      ${isTA?`<button class="btn secondary small" id="mEditTA">✏️ Sửa</button>`:``}
      <button class="btn" id="mPay" ${(os.length || (!isTA && svc.price)) ? "" : "disabled"}>💳 Thanh toán</button>
    </div>
  </div></div>`;
  document.getElementById("mc").onclick = ()=>{ activeModalTable=null; activeModalTA=null; actionMode=null; renderModal(); };
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb"){ activeModalTable=null; activeModalTA=null; actionMode=null; renderModal(); } };
  root.querySelectorAll("[data-cancel]").forEach(b=>{ b.onclick = ()=>{ requestCancelItem(b.dataset.cancel); }; });
  root.querySelectorAll("[data-hc]").forEach(b=>b.onclick = ()=>{
    const c = state.calls.find(x=>x.id === b.dataset.hc);
    if(c){ c.handled = true; save(); renderModal(); renderAll(); }
  });
  document.getElementById("mPrint").onclick = ()=>printBill(id, "temp", null, null, false);
  const svcBtn = document.getElementById("mSvc");
  if(svcBtn) svcBtn.onclick = ()=>{ actionMode="svc"; renderModal(); };
  const editTABtn = document.getElementById("mEditTA");
  if(editTABtn) editTABtn.onclick = ()=>openEditTAModal(id);
  const mMerge = document.getElementById("mMerge");
  if(mMerge) mMerge.onclick = ()=>{ actionMode="merge"; renderModal(); };
  const mTransfer = document.getElementById("mTransfer");
  if(mTransfer) mTransfer.onclick = ()=>{ actionMode="transfer"; renderModal(); };
  const cancelAction = document.getElementById("cancelAction");
  if(cancelAction) cancelAction.onclick = ()=>{ actionMode=null; renderModal(); };
  const doAction = document.getElementById("doAction");
  if(doAction) doAction.onclick = ()=>{
    const target = document.getElementById("actionTarget").value;
    if(!target) return;
    const srcReal = resolveTable(id);
    const dstReal = resolveTable(target);
    if(srcReal === dstReal){ alert("Đã cùng nhóm!"); return; }
    if(actionMode === "merge"){
      if(!confirm(`Ghép bàn ${id} vào ${target}?`)) return;
      const s1 = state.tableSessions[srcReal], s2 = state.tableSessions[dstReal];
      const minSes = [s1,s2].filter(Boolean).sort((a,b)=>a-b)[0] || nowMs();
      state.tableSessions[dstReal] = minSes;
      state.orders.forEach(o=>{ if(o.table === srcReal) o.table = dstReal; });
      const srcSvc = state.tableServices[srcReal];
      const dstSvc = state.tableServices[dstReal] || {note:"", price:0};
      if(srcSvc){
        const parts = [dstSvc.note, srcSvc.note].filter(Boolean);
        state.tableServices[dstReal] = { note: parts.join(" + "), price: (dstSvc.price||0)+(srcSvc.price||0) };
        delete state.tableServices[srcReal];
      }
      state.merges[srcReal] = dstReal;
      Object.keys(state.merges).forEach(k=>{ if(resolveTable(k) === srcReal && k !== srcReal) state.merges[k] = dstReal; });
      delete state.tableSessions[srcReal];
      save(); activeModalTable = dstReal; actionMode = null;
    } else {
      if(!confirm(`Chuyển món ${id} sang ${target}?`)) return;
      state.orders.forEach(o=>{ if(o.table === srcReal) o.table = dstReal; });
      if(!state.tableSessions[dstReal] && state.tableSessions[srcReal]) state.tableSessions[dstReal] = state.tableSessions[srcReal];
      delete state.tableSessions[srcReal];
      delete state.merges[srcReal];
      save(); activeModalTable = dstReal; actionMode = null;
    }
    renderAll();
  };
  document.getElementById("mPay").onclick = ()=>{
    actionMode = "pay"; payQtys = {};
    tableOrders(id).forEach(o=>{ payQtys[o.id] = o.qty; });
    renderModal();
  };
}

    <label class="fl" style="margin-top:.5rem">
      <input type="checkbox" id="eTaPickup" ${meta.pickup?"checked":""} style="width:auto"> Khách tự đến lấy
    </label>
    <label class="fl" id="eTaAddrWrap" style="${meta.pickup?'display:none':''}">Địa chỉ <input id="eTaAddr" value="${esc(meta.address)}"></label>

  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb") close(); };
  document.getElementById("eTaCancel").onclick = close;
  document.getElementById("eTaPickup").onchange = e=>{
    document.getElementById("eTaAddrWrap").style.display = e.target.checked ? "none" : "";
  };
  document.getElementById("eTaSave").onclick = ()=>{
    const name = document.getElementById("eTaName").value.trim();

    close();
  };
}

function requestCancelItem(orderId){
  const o = state.orders.find(x=>x.id === orderId);
  if(!o) return;
  if(o.status === "hoan_thanh"){ alert("Món đã hoàn thành!"); return; }
  const loc = isTakeawayId(o.table) ? `đơn ${o.table}` : `bàn ${o.table}`;
  if(!confirm(`Hủy "${o.name}" ×${o.qty} của ${loc}?`)) return;
  if(state.settings.cancelApproval && !isManager()){
    const pin = prompt("PIN QL:");
    if(pin !== state.settings.managerPin){ alert("Sai PIN!"); return; }
  }
  const reason = prompt("Lý do:", "Khách đổi ý");
  state.cancelLogs.push({
    id: uid("cl"), orderId: o.id, name: o.name, qty: o.qty, price: o.price,
    table: o.table, ts: nowMs(), reason: reason || "",
    by: isManager() ? "manager" : "staff"
  });
  state.orders = state.orders.filter(x=>x.id !== orderId);
  save(); renderAll();
}

function printBill(id, type, itemsOverride, totalOverride, doPrint){
  const isTA = isTakeawayId(id);
  const meta = isTA ? getTAMeta(id) : null;
  const os = tableOrders(id);
  const items = itemsOverride || toArr(os).map(o=>({name:o.name, qty:o.qty, price:o.price, note:o.note||""}));
  const svc = isTA ? {note:"", price:0} : getTableService(id);
  const svcNote = (itemsOverride && itemsOverride.serviceNote) || svc.note || "";
  const svcPrice = (itemsOverride && itemsOverride.servicePrice) || svc.price || 0;
  const deliveryFee = (isTA && meta && !meta.pickup && type === "final") ? (state.settings.deliveryFee||0) : 0;
  const subtotal = items.reduce((s,i)=>s + i.qty*i.price, 0) + svcPrice + deliveryFee;
  const useTax = state.settings.taxEnabled && type === "final";
  const taxRate = useTax ? state.settings.taxRate : 0;
  const tax = Math.round(subtotal * taxRate / 100);
  const total = totalOverride != null ? totalOverride : (subtotal + tax);
  const kids = isTA ? [] : mergedChildren(id);
  const title = type === "final" ? "HÓA ĐƠN THANH TOÁN" : (type === "pending" ? "PHIẾU YÊU CẦU TT" : "PHIẾU TẠM TÍNH");
  const locLine = isTA
    ? `🥡 ${id}${meta ? ` — ${esc(meta.name)} · ${esc(meta.phone)}` : ""}${meta && !meta.pickup && meta.address ? `<br>📍 ${esc(meta.address)}` : ""}`
    : `Bàn: <b>${id}${kids.length ? " + "+kids.join(", ") : ""}</b>`;
  const w = window.open("", "_blank", "width=380,height=600");
  if(!w){ alert("Không mở được cửa sổ in."); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title>
    <style>body{font-family:Arial,sans-serif;font-size:13px;padding:8px;max-width:320px;margin:0 auto}
    h2{text-align:center;font-size:15px;margin:4px 0}.center{text-align:center}
    .brand-contact{font-size:10px;color:#555;text-align:center;margin-bottom:4px}
    hr{border:none;border-top:1px dashed #000;margin:6px 0}
    table{width:100%;font-size:12px;border-collapse:collapse}td{padding:2px 0}
    .r{text-align:right}.b{font-weight:700}.tot{margin-top:6px;font-size:15px}
    .dev{font-size:10px;color:#888;text-align:center;margin-top:6px;font-style:italic}
    .qrwrap{text-align:center;margin:6px 0}
    .qrwrap img{width:150px;height:150px;background:#fff;padding:3px;border:1px solid #ccc;border-radius:6px}
    </style></head><body>
    <h2>${esc(state.brand.logo||"🐚")} ${esc(state.brand.name)}</h2>
    ${state.brand.address || state.brand.phone ? `<div class="brand-contact">
      ${state.brand.address?esc(state.brand.address):''}${state.brand.address && state.brand.phone?' · ':''}${state.brand.phone?'ĐT: '+esc(state.brand.phone):''}
    </div>`:''}
    <div class="center">${title}</div><hr>
    <div>${locLine}</div>
    <div>Giờ: ${new Date().toLocaleString("vi-VN")}</div><hr>
    <table>${items.map(i=>`<tr><td>${esc(i.name)}${i.note?` (${esc(i.note)})`:""} ×${i.qty}</td><td class="r">${VND(i.qty*i.price)}</td></tr>`).join("")}
    ${svcPrice > 0 ? `<tr><td>Dịch vụ${svcNote?": "+esc(svcNote):""}</td><td class="r">${VND(svcPrice)}</td></tr>` : ""}
    ${deliveryFee > 0 ? `<tr><td>Phí giao hàng</td><td class="r">${VND(deliveryFee)}</td></tr>` : ""}
    </table><hr>
    <div class="r">Tạm tính: ${VND(subtotal)}</div>
    ${useTax ? `<div class="r">VAT ${taxRate}%: ${VND(tax)}</div>` : ""}
    <div class="tot r b">TỔNG: ${VND(total)}</div>
    ${type !== "final" ? '<hr><div class="center">(Chưa phải hóa đơn chính thức)</div>' : ''}
    ${(type === "final" && isBankConfigured() && state.settings.bank.showOnBill !== false) ? `
      <hr><div class="center" style="font-size:11px">💳 Quét QR để thanh toán</div>
      <div class="qrwrap"><img src="${buildBankQrUrl(total, 'Thanh toan ' + id)}" referrerpolicy="no-referrer"></div>
      <div class="center" style="font-size:10px;color:#666">
        ${esc((BANK_LIST.find(x=>x.id===state.settings.bank.bankId)||{}).name || state.settings.bank.bankId)}
        · STK ${esc(state.settings.bank.accountNumber||"")}
      </div>` : ''}
    <hr><div class="center">Cảm ơn quý khách!</div>
    <div class="dev">${esc(state.brand.dev)}</div>
    ${doPrint !== false ? '<script>setTimeout(()=>window.print(),200);<\/script>' : ''}
    </body></html>`);
  w.document.close();
}

                type === "service" ? '<span class="badge service">🧂</span>' : "";

  const title = isTA ? `🥡 Thanh toán ${id}` : `💳 Bàn ${id}`;
  const taLine = isTA ? `<div class="tiny" style="background:color-mix(in srgb,var(--ta) 10%,var(--surface));padding:.4rem .6rem;border-radius:8px;margin-bottom:.5rem">

  </div>` : "";
  root.innerHTML = `<div class="modal-back" id="mb"><div class="modal">
    <button class="close-x" id="mc">✕</button>
    <h3>${title}</h3>${taLine}
    <div class="muted tiny">Chỉnh số lon bia thực tế trước khi chốt.</div>
    <div style="margin-top:.6rem">${os.map(lineHtml).join("")}</div>
    ${svc.price ? `<div class="svc-summary">➕ DV: <b>${esc(svc.note||"—")}</b> · <b>${VND(svc.price)}</b></div>` : ""}
    ${deliveryFee > 0 ? `<div class="svc-summary" style="border-color:var(--ta)">🛵 Phí giao: <b>${VND(deliveryFee)}</b></div>` : ""}
    ${isBankConfigured() ? `
    <div class="card" style="margin-top:.7rem;background:var(--bg);text-align:center;border:1px dashed var(--money)">
      <b>💳 Quét QR để thanh toán</b>
      <img id="payQrImg" src="${buildBankQrUrl(tt.total, 'Thanh toan ' + id)}"
        style="width:230px;height:230px;margin:.5rem auto;display:block;background:#fff;border-radius:10px;border:1px solid var(--border);padding:4px"
        referrerpolicy="no-referrer"
        onerror="this.style.display='none';document.getElementById('payQrFallback').style.display=''">
      <div id="payQrFallback" style="display:none" class="empty tiny">⚠️ Không tải được QR.</div>
      <div style="display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:.3rem">
        <span class="tiny">🏦 <b>${esc((BANK_LIST.find(x=>x.id===state.settings.bank.bankId)||{}).name || state.settings.bank.bankId)}</b></span>
        <span class="tiny">STK: <b>${esc(state.settings.bank.accountNumber||"")}</b></span>
      </div>
      <div style="display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin-top:.5rem">
        <button class="btn secondary small" id="payQrCopy">📋 Copy STK</button>
        <button class="btn secondary small" id="payQrRefresh">🔄 Cập nhật</button>
      </div>
    </div>` : ""}
    <div style="margin-top:.8rem;background:var(--bg);padding:.6rem;border-radius:8px">

function deductItemInventory(order){
  const m = state.menu.find(x=>x.id === order.itemId);
  if(!m || !m.recipe || !m.recipe.length) return;
  m.recipe.forEach(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    if(!ing) return;
    ing.stock = +(Math.max(0, ing.stock - r.qty*order.qty)).toFixed(3);
  });
}

function groupBy(list){
  const g = {};
  list.forEach(o=>{
    const k = o.name + "|" + (o.note||"");
    if(!g[k]) g[k] = {name:o.name,note:o.note||"",prio:o.prio,prep:o.prep,ts:o.ts,qty:0,tables:{},ids:[],itemId:o.itemId,hasTA:false};
    g[k].qty += o.qty; g[k].ts = Math.min(g[k].ts, o.ts);
    g[k].tables[o.table] = (g[k].tables[o.table]||0) + o.qty;
    g[k].ids.push(o.id);
    if(isTakeawayId(o.table)) g[k].hasTA = true;
  });
  const groups = Object.values(g);
  groups.forEach(gr=>{
    gr.waitMin = minsAgo(gr.ts);
    gr.bump = Math.floor(gr.waitMin / 10);
    gr.effPrio = Math.max(1, gr.prio - gr.bump);
    gr.hot = gr.waitMin >= 15 || gr.effPrio <= 1;
  });
  return groups.sort((a,b)=> a.effPrio - b.effPrio || b.waitMin - a.waitMin || a.ts - b.ts);
}
function tblStr(tables){
  return Object.entries(tables).map(([t,q])=> isTakeawayId(t) ? `🥡${t}(${q})` : `${t}(${q})`).join(", ");
}
function renderBep(){

          <div class="kmeta">${tblStr(g.tables)} · ~${g.prep} phút · UT gốc ${g.prio}${bumpTxt}</div>

/* ============================================================
   TÀI CHÍNH (FIXED P&L)
   ============================================================ */
let finPeriod = "month"; let finFrom = "", finTo = "";
function finGetRange(period, from, to){
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(period === "today") return [todayStart.getTime(), todayStart.getTime() + 86400000 - 1];
  if(period === "week"){
    const dow = now.getDay() || 7;
    const s = new Date(todayStart.getTime() - (dow-1)*86400000);
    return [s.getTime(), s.getTime() + 7*86400000 - 1];
  }
  if(period === "month"){
    const s = new Date(now.getFullYear(), now.getMonth(), 1);
    const e = new Date(now.getFullYear(), now.getMonth()+1, 1).getTime() - 1;
    return [s.getTime(), e];
  }
  if(period === "year"){
    const s = new Date(now.getFullYear(), 0, 1);
    const e = new Date(now.getFullYear()+1, 0, 1).getTime() - 1;
    return [s.getTime(), e];
  }
  if(period === "all") return [0, now.getTime() + 86400000];
  if(period === "custom" && from && to) return [new Date(from).getTime(), new Date(to).getTime() + 86400000 - 1];
  return [todayStart.getTime(), now.getTime()];
}
function daysInRange(fromTs, toTs){
  const ms = Math.max(1, toTs - fromTs);
  return Math.max(1, Math.round(ms / 86400000));
}
function recurringCostForRange(fromTs, toTs){
  const days = daysInRange(fromTs, toTs);
  const monthlyTotal = (state.recurringExpenses||[]).reduce((s,r)=>s + (Number(r.amount)||0), 0);
  if(monthlyTotal <= 0) return { total: 0, days, monthlyTotal, dailyAvg: 0, breakdown: [] };
  const dailyAvg = monthlyTotal / 30;
  const total = Math.round(dailyAvg * days);
  const breakdown = (state.recurringExpenses||[]).map(r=>({
    name: r.name, category: r.category,
    monthlyAmount: Number(r.amount)||0,
    forRange: Math.round((Number(r.amount)||0) / 30 * days)
  }));
  return { total, days, monthlyTotal, dailyAvg, breakdown };
}
function calcFinance(fromTs, toTs){
  // Doanh thu kỳ
  const invs = toArr(state.invoices).filter(i =>
    i.type === "final" && !i.superseded && i.ts >= fromTs && i.ts <= toTs);
  const revenue = invs.reduce((s,i) => s + (Number(i.total)||0), 0);
  // COGS: giá vốn = BOM cost × số lượng bán
  const cogs = invs.reduce((s,i) =>
    s + toArr(i.items).reduce((a,x) => a + (x.qty||0) * (x.cost||0), 0), 0);
  const grossProfit = revenue - cogs;
  // Nhập NL (chỉ để hiển thị, KHÔNG trừ vào P&L)
  const purchases = state.purchases.filter(p => p.ts >= fromTs && p.ts <= toTs);
  const totalPurchase = purchases.reduce((s,p) => s + (Number(p.total)||0), 0);
  // Chi phí phát sinh
  const expenses = state.expenses.filter(e => e.ts >= fromTs && e.ts <= toTs);
  const totalExpense = expenses.reduce((s,e) => s + (Number(e.amount)||0), 0);
  // CP cố định phân bổ
  const rec = recurringCostForRange(fromTs, toTs);
  const totalRecurring = rec.total;
  // LỢI NHUẬN RÒNG
  const netProfit = revenue - cogs - totalExpense - totalRecurring;
  // Sổ quỹ (dòng tiền thực)
  const allRevenue = toArr(state.invoices)
    .filter(i => i.type === "final" && !i.superseded && i.ts <= toTs)
    .reduce((s,i) => s + (Number(i.total)||0), 0);
  const allPurchase = state.purchases.filter(p => p.ts <= toTs)
    .reduce((s,p) => s + (Number(p.total)||0), 0);
  const allExpense = state.expenses.filter(e => e.ts <= toTs)
    .reduce((s,e) => s + (Number(e.amount)||0), 0);
  const allRecurring = recurringCostForRange(0, toTs).total;
  const balance = (state.settings.openingBalance || 0)
                + allRevenue - allPurchase - allExpense - allRecurring;
  const days = rec.days;
  return {
    revenue, cogs, grossProfit,
    purchases, expenses,
    totalPurchase, totalExpense, totalRecurring,
    rec, days, netProfit,
    netProfitPerDay: Math.round(netProfit / days),
    revenuePerDay: Math.round(revenue / days),
    balance
  };
}

   BÁO CÁO (chart có số + bảng dữ liệu)
