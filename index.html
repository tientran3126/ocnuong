<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9B2A1A">
<title>Ốc Nướng — Quản lý quán nhậu</title>
<style>
:root{
  --bg:#F2D8B8;--surface:#FFF3E0;--text:#2B1D14;--muted:#7A5E4A;
  --primary:#9B2A1A;--primary-d:#6E1A0E;--primary-l:#C84430;
  --brick:#B83A26;--brick-d:#8B2418;--brick-l:#DA5A40;
  --gold:#C9922E;--gold-d:#9A6E1F;--gold-l:#E8BE56;
  --border:#D9BFA0;--warn:#B8730E;--danger:#8B2A1E;--ok:#4A7C4F;
  --p1:#4A7C4F;--p2:#2E5A85;--p3:#C9922E;--p4:#7A4080;--p5:#8B2A1E;
  --wood:#5A2D1B;--wood-d:#3A1810;--money:#1F7A44;--ta:#7A4080;
  --shadow:0 2px 8px rgba(90,29,18,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F0F0A;--surface:#2A1811;--text:#F5E6D3;--muted:#B8A188;
    --primary:#E05A40;--primary-d:#B83A26;--primary-l:#F07A60;
    --brick:#DA5A40;--brick-d:#B83A26;--brick-l:#F07A60;
    --gold:#E8BE56;--gold-d:#C9922E;--gold-l:#FFE082;
    --border:#4A2D1E;--warn:#E8A03A;--danger:#E87A70;--ok:#5FAE72;
    --p1:#5FAE72;--p2:#5C9FDB;--p3:#E8BE56;--p4:#B98BE0;--p5:#E87A70;
    --wood:#3A1810;--wood-d:#1A0F0A;--money:#5FAE72;--shadow:0 2px 8px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--wood-d),var(--wood));color:#F5E6D3;border-bottom:3px solid var(--gold);padding:.6rem .8rem .5rem;padding-top:calc(.6rem + env(safe-area-inset-top,0px));box-shadow:0 2px 12px rgba(58,24,16,.35)}
.header-top{display:grid;grid-template-columns:92px 1fr 92px;align-items:center;gap:.6rem;margin-bottom:.4rem}
.logo{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--gold-l),var(--gold) 60%,var(--gold-d));display:flex;align-items:center;justify-content:center;font-size:2.6rem;box-shadow:inset 0 -4px 8px rgba(0,0,0,.3),0 3px 12px rgba(0,0,0,.4);border:3px solid var(--gold-l);overflow:hidden;flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:cover}
.logo.app-logo{background:radial-gradient(circle at 30% 30%,#FFE082,#C9922E 60%,#6E1A0E);border-color:#FFE082}
.brand{text-align:center;min-width:0}
.brand h1{font-size:1.4rem;margin:0;color:var(--gold-l);font-weight:900;letter-spacing:.05em;text-shadow:0 2px 4px rgba(0,0,0,.4);line-height:1.15}
.brand .sub{font-size:.78rem;color:#E8D8C0;margin-top:.15rem;font-weight:600}
.brand .contact{font-size:.7rem;color:#F0D8A8;margin-top:.15rem;line-height:1.3}
.brand .contact a{color:var(--gold-l);text-decoration:none;font-weight:700}
.header-bottom{display:flex;justify-content:space-between;align-items:center;gap:.4rem;flex-wrap:wrap}
.header-bottom .left-actions{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.header-bottom .right-status{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:.7rem}
.role-badge{background:var(--p2);color:#fff;padding:.15rem .55rem;border-radius:999px;font-size:.66rem;font-weight:700}
.role-badge.mgr{background:var(--primary-d)}
.sync-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:.25rem;vertical-align:middle}
.sync-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.sync-dot.off{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pillbtn{font-size:.7rem;padding:.22rem .55rem;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-weight:600}
.pillbtn.on{background:var(--ok);border-color:var(--ok)}
.pillbtn.off{background:var(--danger);border-color:var(--danger)}
.pillbtn.x{background:transparent;color:#F0A090;border-color:#F0A090;font-weight:700}
nav.main{display:flex;gap:.4rem;overflow-x:auto;padding:.35rem 0 .25rem;justify-content:center}
nav.main::-webkit-scrollbar{display:none}
nav.main button{flex:0 0 auto;padding:.5rem .9rem;border-radius:999px;border:1px solid rgba(232,190,86,.3);background:rgba(0,0,0,.2);color:#F0E0C0;font-size:.82rem;cursor:pointer;white-space:nowrap;font-weight:600}
nav.main button.active{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-color:var(--gold);font-weight:800;box-shadow:0 2px 8px rgba(155,42,26,.4)}
nav.subnav{display:flex;gap:.35rem;overflow-x:auto;margin-bottom:.6rem;padding-bottom:.2rem}
nav.subnav::-webkit-scrollbar{display:none}
nav.subnav button{flex:0 0 auto;padding:.42rem .75rem;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.78rem;cursor:pointer;white-space:nowrap;font-weight:600}
nav.subnav button.active{background:linear-gradient(135deg,var(--primary-d),var(--primary));color:#fff;border-color:var(--primary-d)}
main{max-width:960px;margin:0 auto;padding:.9rem;padding-bottom:calc(9rem + env(safe-area-inset-bottom,0px))}
section{display:none}
section.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.85rem;margin-bottom:.7rem;box-shadow:var(--shadow)}
.card.booking-lock{border:2px solid var(--p2);background:linear-gradient(135deg,color-mix(in srgb,var(--p2) 10%,var(--surface)),var(--surface))}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.82rem}
.note{color:var(--muted);font-size:.76rem;margin:-.3rem 0 .6rem}
select,input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.5rem .65rem;font-size:.9rem;font-family:inherit;max-width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--gold-l);outline-offset:-1px}
.btn{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border:none;border-radius:10px;padding:.55rem 1rem;font-size:.85rem;cursor:pointer;font-weight:700;box-shadow:0 2px 6px rgba(155,42,26,.25);text-decoration:none;display:inline-block}
.btn:active{transform:scale(.97)}
.btn.secondary{background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.btn.small{padding:.35rem .65rem;font-size:.78rem}
.btn.ok{background:linear-gradient(135deg,#4A7C4F,#2F5A33)}
.btn.warn{background:linear-gradient(135deg,#C9922E,#9A6E1F)}
.btn.danger{background:linear-gradient(135deg,#8B2A1E,#6E1A0E)}
.btn.money{background:linear-gradient(135deg,#1F7A44,#0F4F2B)}
.btn.ta{background:linear-gradient(135deg,#7A4080,#5E2A6A)}
.btn.blue{background:linear-gradient(135deg,#2E5A85,#1B4060)}
.btn.zalo{background:linear-gradient(135deg,#0068FF,#0047B3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.item{display:flex;justify-content:space-between;align-items:flex-start;padding:.55rem 0;border-bottom:1px solid var(--border);gap:.5rem}
.item:last-child{border-bottom:none}
.item .name{font-size:.92rem}
.item.served{opacity:.55}
.item.served .name{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ok)}
.notetag{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);font-size:.72rem;padding:.05rem .35rem;border-radius:5px;margin-left:.25rem;font-weight:600}
.scheduletag{background:color-mix(in srgb,var(--p2) 20%,transparent);color:var(--p2);font-size:.72rem;padding:.05rem .35rem;border-radius:5px;margin-left:.25rem;font-weight:600}
.cart-bottom{position:fixed;bottom:0;left:0;right:0;z-index:80;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--brick) 6%,var(--surface)));border-top:2px solid var(--brick);padding:.6rem .8rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(90,29,18,.15)}
.cart-bottom .cb-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:.55rem}
.cart-bottom .cb-cart{flex:0 0 auto;background:var(--surface);border:2px solid var(--brick);color:var(--primary-d);border-radius:12px;padding:.7rem .9rem;font-size:1rem;font-weight:800;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;min-width:78px}
.cart-bottom .cb-cart .cb-cart-icon{font-size:1.3rem;line-height:1}
.cart-bottom .cb-cart .cb-cart-count{font-size:.72rem;margin-top:.15rem;color:var(--muted);font-weight:600}
.cart-bottom .cb-cart .cb-cart-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.cart-bottom .cb-send{flex:1;background:linear-gradient(135deg,var(--brick),var(--brick-d));color:#fff;border:none;border-radius:12px;padding:1rem 1.2rem;font-size:1.08rem;font-weight:800;letter-spacing:.03em;cursor:pointer;box-shadow:0 4px 14px rgba(184,58,38,.4)}
.cart-bottom .cb-send.ta{background:linear-gradient(135deg,var(--ta),#5E2A6A)}
.cart-bottom .cb-send:disabled{opacity:.5;cursor:not-allowed}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.7rem;background:var(--surface);border-radius:14px;padding:.35rem;border:1px solid var(--border)}
.mode-tabs button{padding:.75rem .5rem;border:none;border-radius:10px;background:transparent;color:var(--text);font-size:.9rem;font-weight:700;cursor:pointer}
.mode-tabs button.active{background:linear-gradient(135deg,var(--brick),var(--brick-d));color:#fff}
.mode-tabs button.active.ta{background:linear-gradient(135deg,var(--ta),#5E2A6A)}
.ta-info-bar{background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 12%,var(--surface)),var(--surface));border:1px solid var(--ta);border-radius:14px;padding:.7rem .85rem;margin-bottom:.7rem}
.tbl-matrix{display:grid;gap:.35rem}
.mcell{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);font-weight:800}
.tbl{border-radius:10px;padding:.5rem .25rem;text-align:center;cursor:pointer;border:1.5px solid var(--border);font-size:.74rem;font-weight:600}
.tbl.trong{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.tbl.busy{background:color-mix(in srgb,var(--gold) 28%,var(--surface));border-color:var(--gold)}
.tbl.merged{background:color-mix(in srgb,var(--p4) 18%,var(--surface));opacity:.75}
.tbl.locked{background:linear-gradient(135deg,color-mix(in srgb,var(--p2) 30%,var(--surface)),color-mix(in srgb,var(--p2) 15%,var(--surface)));border-color:var(--p2);border-width:2px}
.badge{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.7rem;color:#fff;font-weight:700}
.badge.p1{background:var(--p1)}.badge.p2{background:var(--p2)}.badge.p3{background:var(--p3)}
.badge.p4{background:var(--p4)}.badge.p5{background:var(--p5)}
.badge.st{background:var(--muted)}.badge.drink{background:var(--p2)}.badge.beer{background:var(--gold-d)}
.badge.service{background:var(--gold-d)}.badge.out{background:var(--danger)}.badge.temp{background:var(--warn)}
.badge.paid{background:var(--ok)}.badge.void{background:var(--muted);text-decoration:line-through}
.badge.ta{background:var(--ta)}.badge.new{background:var(--p2)}.badge.cooking{background:var(--warn)}
.badge.locked{background:var(--p2)}.badge.schedule{background:var(--p4)}.badge.pending{background:var(--warn)}
.badge.delivering{background:#0E5C8A}.badge.delivered{background:var(--ok)}
.kgroup{border:1.5px solid var(--border);border-radius:12px;padding:.7rem;margin-bottom:.6rem;background:var(--surface);box-shadow:var(--shadow)}
.kgroup.hot{border-color:var(--danger)}
.kgroup.cooking{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.kgroup.scheduled{border-color:var(--p4);background:color-mix(in srgb,var(--p4) 6%,var(--surface))}
.kgroup.ta{border-color:var(--ta)}
.khead{display:flex;justify-content:space-between;align-items:center;gap:.7rem}
.kinfo{flex:1;min-width:0}
.kmeta{font-size:.76rem;color:var(--muted);margin-top:.2rem}
.knote{font-size:.78rem;color:var(--warn);margin-top:.2rem;font-weight:600}
.kbtn{font-size:1.02rem!important;padding:.85rem 1.5rem!important;font-weight:800;flex-shrink:0}
.kbtns{display:flex;flex-direction:column;gap:.35rem;flex-shrink:0}
.kbtn.small-k{font-size:.85rem!important;padding:.55rem 1rem!important}
.ksec-title{font-weight:800;margin:.9rem 0 .4rem;padding:.45rem .75rem;border-radius:10px;display:inline-block;font-size:.9rem}
.ksec-title.food{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.ksec-title.beer{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold-d)}
.ksec-title.drink{background:color-mix(in srgb,var(--p2) 20%,transparent);color:var(--p2)}
.ksec-title.service{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold-d)}
.ksec-title.music{background:linear-gradient(135deg,#FCE4EC,#F8BBD0);color:#C2185B}
.ksec-title.scheduled{background:color-mix(in srgb,var(--p4) 20%,transparent);color:var(--p4)}
.ksec-title.pending{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.ksec-title.done{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:1.15rem;font-weight:800;color:var(--primary-d)}
.stat .l{font-size:.74rem;color:var(--muted)}
.stat .delta{font-size:.74rem;font-weight:700;margin-top:.2rem}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:.4rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.45rem .3rem;border-bottom:1px solid var(--border);vertical-align:middle}
.modal-back{position:fixed;inset:0;background:rgba(58,24,16,.7);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:1rem;max-height:92vh;overflow:auto;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));border-top:3px solid var(--gold);box-shadow:0 -8px 32px rgba(58,24,16,.3)}
.close-x{float:right;background:none;border:none;font-size:1.3rem;color:var(--muted);cursor:pointer;padding:.2rem .5rem}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:1.2rem 0}
label.fl{display:block;font-size:.8rem;color:var(--muted);margin:.55rem 0 .15rem;font-weight:600}
label.fl input,label.fl select,label.fl textarea{width:100%}
.tiny{font-size:.74rem}
.alert-banner{background:color-mix(in srgb,var(--danger) 12%,var(--surface));border:1.5px solid var(--danger);border-radius:12px;padding:.7rem .9rem;margin-bottom:.7rem;font-size:.85rem;color:var(--danger);font-weight:600}
.alert-banner.warn{background:color-mix(in srgb,var(--gold) 15%,var(--surface));border-color:var(--gold);color:var(--gold-d)}
.alert-banner.info{background:color-mix(in srgb,var(--p2) 12%,var(--surface));border-color:var(--p2);color:var(--p2)}
.alert-banner .details{font-weight:400;font-size:.78rem;margin-top:.3rem;color:var(--text);line-height:1.5}
.call-btn{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom,0px));right:14px;z-index:75;background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border:none;border-radius:999px;padding:.7rem 1.1rem;font-size:.85rem;font-weight:800;box-shadow:0 6px 18px rgba(155,42,26,.5);cursor:pointer}
.call-btn.called{background:var(--muted);box-shadow:none}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px dashed var(--border)}
.payrow .qq{display:flex;align-items:center;gap:.25rem;flex:0 0 auto}
.payrow .qq button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;cursor:pointer;font-weight:700}
.payrow .qq input{width:56px;text-align:center;padding:.3rem}
input[type="number"]{text-align:right}
.ing-row{display:grid;grid-template-columns:1fr 70px 90px 70px 70px 30px;gap:.35rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.8rem}
.ing-row.header{font-weight:800;color:var(--muted);font-size:.72rem;border-bottom:2px solid var(--border)}
.ing-row input{padding:.25rem .35rem;font-size:.8rem}
.gchart{display:flex;gap:6px;align-items:flex-end;height:200px;padding:.4rem 0 .2rem;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:.3rem}
.gday{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;min-width:48px}
.gbars{display:flex;gap:1px;align-items:flex-end;height:140px}
.gbar{width:11px;border-radius:3px 3px 0 0}
.gbar.rev{background:linear-gradient(to top,var(--brick),var(--brick-l))}
.gbar.cost{background:linear-gradient(to top,var(--gold-d),var(--gold))}
.gbar.profit{background:linear-gradient(to top,#2F5A33,#4A7C4F)}
.gday .glbl{font-size:.62rem;color:var(--muted);white-space:nowrap;font-weight:600}
.legend{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.75rem;margin-top:.3rem}
.legend span{display:flex;align-items:center;gap:.3rem}
.legend .dot{width:10px;height:10px;border-radius:2px}
.legend .dot.rev{background:var(--brick)}.legend .dot.cost{background:var(--gold)}.legend .dot.profit{background:var(--ok)}
.filter-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.filter-bar button{font-size:.75rem;padding:.35rem .75rem;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-weight:600}
.filter-bar button.active{background:linear-gradient(135deg,var(--brick),var(--brick-d));color:#fff;border-color:var(--brick)}
.menu-cat{margin-bottom:1.2rem}
.menu-cat-h{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 .6rem;padding:.6rem .85rem;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--wood),var(--wood-d));border-left:4px solid var(--gold)}
.menu-cat-h .ci{font-size:1.3rem}
.menu-cat-h .cn{font-weight:900;font-size:1rem;text-transform:uppercase}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem}
.menu-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.menu-card .m-img{height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 25% 25%,var(--gold-l) 0%,transparent 55%),radial-gradient(circle at 80% 80%,var(--gold) 0%,transparent 60%),linear-gradient(135deg,#F0C896,#D89860)}
.menu-card .m-img img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:4px}
.menu-card .m-img .emoji{font-size:4rem;line-height:1}
.menu-card .m-body{padding:.7rem .8rem .8rem}
.menu-card .m-name{font-weight:800;font-size:1rem;margin:0 0 .25rem;color:var(--primary-d);line-height:1.3}
.menu-card .m-price{font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
.menu-card .m-tag-best{display:inline-block;font-size:.62rem;padding:.15rem .5rem;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;font-weight:800;margin-left:.3rem;vertical-align:middle}
.menu-card.out{opacity:.55;filter:grayscale(.6)}
.menu-card.out .m-name{text-decoration:line-through}
.menu-card .m-actions{display:flex;align-items:center;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.menu-card .m-actions button{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem;font-weight:700;cursor:pointer}
.menu-card .m-actions button.caseb{width:auto;padding:0 .65rem;font-size:.72rem;font-weight:700;background:linear-gradient(135deg,#2E5A85,#1B4060);color:#fff;border-color:#1B4060}

const VND = n => Number(n||0).toLocaleString("vi-VN")+"đ";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
const nowMs = () => Date.now();
const minsAgo = ts => Math.max(0, Math.floor((Date.now()-(ts||Date.now()))/60000));
const fmtTime = ts => new Date(ts).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
const fmtDate = ts => new Date(ts).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtDateTime = ts => new Date(ts).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const isTakeawayId = id => typeof id === "string" && (id.startsWith("TA") || id === "TAKEAWAY");
const isScheduled = o => o && o.scheduledAt && o.scheduledAt > Date.now();
function deepClean(obj){
  if(obj === null || obj === undefined) return obj;
  if(Array.isArray(obj)) return obj.map(deepClean).filter(v => v !== undefined);
  if(typeof obj === "object"){
    const out = {};
    for(const k of Object.keys(obj)){
      if(obj[k] === undefined) continue;
      out[k] = deepClean(obj[k]);
    }
    return out;
  }
  return obj;
}
function toArr(v){
  if(Array.isArray(v)) return v;
  if(v && typeof v === "object"){
    return Object.keys(v).sort((a,b)=>{const na=Number(a),nb=Number(b); if(!isNaN(na)&&!isNaN(nb)) return na-nb; return String(a).localeCompare(String(b));}).map(k=>v[k]);
  }
  return [];
}
function fmtShort(n){

  if(Math.abs(n) >= 1000) return Math.round(n/1000) + "K";

function proxiedImgUrl(raw){
  if(!raw) return "";
  if(raw.startsWith("data:")) return raw;
  if(raw.startsWith("http")) return "https://images.weserv.nl/?url=" + encodeURIComponent(raw) + "&w=600&output=jpg&q=80";
  return raw;
}
function readImageAsResizedDataUrl(file, maxW, maxH, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const ratio = Math.min(maxW/w, maxH/h, 1);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL("image/jpeg", quality || 0.6)); } catch(e){ reject(e); }
      };
      img.onerror = ()=>reject(new Error("Không đọc được ảnh"));
      img.src = ev.target.result;
    };
    reader.onerror = ()=>reject(new Error("Lỗi đọc file"));
    reader.readAsDataURL(file);
  });
}
function dataUrlSizeKB(dataUrl){
  if(!dataUrl || !dataUrl.startsWith("data:")) return 0;
  const i = dataUrl.indexOf(",");
  if(i < 0) return 0;
  return Math.round(dataUrl.length * 0.75 / 1024);
}
function extractYouTubeId(url){
  if(!url) return "";
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : "";
}

function archiveOldInvoices(){
  if(state.invoices.length <= 400) return;
  const sorted = state.invoices.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const toArchive = sorted.slice(0, state.invoices.length - 300);
  const remaining = sorted.slice(state.invoices.length - 300);
  const byMonth = {};
  toArchive.forEach(inv=>{
    const d = new Date(inv.ts);
    const key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0');
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(inv);
  });
  Object.entries(byMonth).forEach(([key, invs])=>{
    if(fbArchiveRef){
      const existing = archiveCache[key] || [];
      const merged = existing.concat(invs);
      archiveCache[key] = merged;
      fbArchiveRef.child(key).set(deepClean(merged)).catch(e=>console.error("[Archive]", e));
    }
    const cur = state.monthlySummary[key] || {revenue:0, cogs:0, items:0, invoices:0};
    invs.forEach(inv=>{
      const rev = Number(inv.total)||0;
      const cogs = toArr(inv.items).reduce((s,it)=>s + (it.qty||0)*(it.cost||0), 0);
      cur.revenue += rev; cur.cogs += cogs;
      cur.items += toArr(inv.items).reduce((s,it)=>s + (it.qty||0), 0);
      cur.invoices += 1;
    });
    state.monthlySummary[key] = cur;
  });
  state.invoices = remaining;
}
function initFirebase(){
  const cfg = FIREBASE_CONFIG;
  if(!cfg || !cfg.databaseURL){ setSyncStatus("local", "Chưa cấu hình Firebase"); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    const db = firebase.database();
    fbRef = db.ref("ocnuong/state");
    fbImagesRef = db.ref("ocnuong/images");
    fbQrRef = db.ref("ocnuong/qr");
    fbArchiveRef = db.ref("ocnuong/archive");
    db.ref(".info/connected").on("value", s=>{
      fbConnected = !!s.val();
      if(fbConnected) setSyncStatus("syncing", "🟡 Kết nối...");
      else setSyncStatus("offline", "🔴 Mất mạng");
      updateSyncUI();
    });
    fbImagesRef.on("value", snap=>{
      try{
        imagesCache = snap.val() || {};
        applyImagesCache();
        saveLocal();
        renderAll();
      }catch(err){ console.error("[Firebase] Lỗi ảnh menu:", err); }
    });
    fbQrRef.on("value", snap=>{
      try{
        qrImagesCache = snap.val() || {};
        applyQrCache();
        saveLocal();
        renderAll();
      }catch(err){ console.error("[Firebase] Lỗi QR:", err); }
    });
    fbRef.on("value", snap=>{
      try{
        const remote = snap.val();
        if(!remote){
          if(MODE !== "staff"){ setSyncStatus("syncing", "🟡 Chờ dữ liệu..."); return; }
          const seedClean = deepClean(stripImagesForSync(migrateState(JSON.parse(JSON.stringify(state)))));
          fbRef.transaction(current=>{
            if(current === null || current === undefined) return seedClean;
            return;
          }, (err, committed)=>{
            if(err){
              if(err.code === "PERMISSION_DENIED") setSyncStatus("offline", "🔴 Rules");
              else setSyncStatus("offline", "🔴 " + (err.code||err.message));
            } else {
              state.menu.forEach(m=>{ if(m.imgData) saveMenuImage(m.id, m.imgData); });
              Object.keys(state.qrImages||{}).forEach(k=>{ if(state.qrImages[k]) saveQrImage(k, state.qrImages[k]); });
              if(state.qrTakeaway) saveQrImage("TAKEAWAY", state.qrTakeaway);
              remoteSeeded = true;
              setSyncStatus("synced", "🟢 OK");
            }
          });
          return;
        }
        remoteSeeded = true;
        suppressWrite = true;
        state = migrateState(remote);
        applyImagesCache();
        applyQrCache();
        saveLocal();
        renderAll();
        const isMobile = window.innerWidth < 700;
        const now = new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
        setSyncStatus("synced", isMobile ? "🟢" : "🟢 Đồng bộ " + now);
        setTimeout(()=>{ suppressWrite = false; }, 500);
      }catch(err){
        console.error("[Firebase] Lỗi xử lý:", err);
        setSyncStatus("offline", "🔴 Lỗi: " + err.message);
      }
    }, err=>{
      if(err.code === "PERMISSION_DENIED") setSyncStatus("offline", "🔴 Rules");
      else setSyncStatus("offline", "🔴 " + (err.code||err.message));
    });
    firebaseReady = true;
    updateSyncUI();
  }catch(e){
    console.error("[Firebase] INIT ERROR:", e);
    setSyncStatus("offline", "🔴 Lỗi: " + e.message);
  }
}

function resolveTable(t){
  let cur = t, guard = 0; const visited = new Set();
  while(state.merges[cur] && guard++ < 20){
    if(visited.has(cur)){ delete state.merges[cur]; break; }
    visited.add(cur); cur = state.merges[cur];
  }
  return cur;
}
function mergedChildren(t){ return Object.keys(state.merges).filter(k=>resolveTable(k)===t); }
function getTableServices(t){ return Array.isArray(state.tableServices[t]) ? state.tableServices[t] : []; }
function setTableServices(t, arr){
  if(!arr || !arr.length) delete state.tableServices[t];
  else state.tableServices[t] = arr;
  save();
}
function getTableSvcTotal(t){
  return getTableServices(t).reduce((s,x)=>s + (x.billable === false ? 0 : (Number(x.price)||0)), 0);
}
function getBooking(tableId){ return state.bookings[tableId] || null; }
function setBooking(tableId, info){
  if(!info) delete state.bookings[tableId];
  else state.bookings[tableId] = info;
  save();
}

    note: m.note||"", pickup: !!m.pickup,
    deliveryFee: Number(m.deliveryFee)||0,
    deliveryFeeConfirmed: !!m.deliveryFeeConfirmed,
    deliveryStatus: m.deliveryStatus||"",
    services: Array.isArray(m.services) ? m.services : []
  };
}
function setTAMeta(id, meta){
  state.takeawayMeta[id] = {
    name: String(meta.name||"").slice(0,60),

    address: String(meta.address||"").slice(0,200),

    pickup: !!meta.pickup,

function getTAServices(id){ return getTAMeta(id).services || []; }
function setTAServices(id, arr){

function getTASvcTotal(id){

}
function nextTAId(){ state.takeawayCounter = (state.takeawayCounter||0) + 1; return "TA" + state.takeawayCounter; }
function getActiveTAs(){
  const ids = new Set();
  state.orders.forEach(o=>{ if(o.status !== "huy" && isTakeawayId(o.table) && o.table !== "TAKEAWAY") ids.add(o.table); });
  return Array.from(ids).sort((a,b)=>(parseInt(a.replace("TA",""))||0) - (parseInt(b.replace("TA",""))||0));
}
function itemIngredientCost(m){
  return (m.recipe||[]).reduce((s,r)=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return s + (ing ? ing.price * r.qty : 0);
  }, 0);
}
function itemCost(m){
  const ing = itemIngredientCost(m);
  const other = Number(m.otherCost)||0;
  const labor = state.settings.laborInPL ? (Number(m.laborCost)||0) : 0;
  return ing + other + labor;
}
function itemMargin(m){
  const cost = itemCost(m);
  return m.price > 0 ? (m.price - cost) / m.price : 0;
}
function buildBankQrUrl(amount, desc){
  const b = state.settings.bank || {};
  if(!b.enabled) return "";
  if(b.qrImageUrl) return b.qrImageUrl;
  if(!b.accountNumber) return "";
  return "https://img.vietqr.io/image/" + b.bankId + "-" + b.accountNumber + "-compact2.png?amount=" + Math.max(0,Math.round(amount||0)) + "&addInfo=" + encodeURIComponent(desc||"Thanh toan") + "&accountName=" + encodeURIComponent(b.accountHolder||"");
}
function isBankConfigured(){
  const b = state.settings.bank || {};

function itemImageHtml(m){

  }

}
function isItemOrderable(m){
  if(!m.available) return false;
  if(!state.settings.autoDisableByStock) return true;
  if(!m.recipe || !m.recipe.length) return true;
  return m.recipe.every(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return ing && ing.stock >= r.qty;
  });
}
function itemsShortage(m){
  return (m.recipe||[]).filter(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return !ing || ing.stock < r.qty;
  }).map(r=>{
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return ing ? ing.name : "(đã xoá)";

  return "food";
}
function typeOfItem(itemId){

}

function taGrandTotal(taId){
  const itemsTotal = tableOrders(taId).reduce((s,o)=>s + o.qty*o.price, 0);

   MENU KHÁCH
   ============================================================ */
function renderKhach(){
  renderPhoneGate();
  if(MODE === "khach" && !isGuestVerified()){
    const menuDiv = document.getElementById("menuList");
    if(menuDiv) menuDiv.innerHTML = "";
    renderCartBottomBar();
    return;
  }
  const sel = document.getElementById("selTable");
  const khachSub = document.getElementById("khachSub");
  if(MODE === "khach"){
    sel.style.display = "none";
    if(isTakeawayQR){ khachSub.textContent = "Đặt món mang về"; }
    else {
      const real = resolveTable(currentTable);
      khachSub.textContent = (real !== currentTable) ? ("Bàn " + currentTable + " (ghép " + real + ")") : ("Bàn " + currentTable);
    }
  } else {
    sel.style.display = "";
    if(!sel.dataset.filled){
      getVisibleCols().forEach(c=>{
        const og = document.createElement("optgroup"); og.label = "Khu " + c;
        getVisibleRows().forEach(r=>{
          const t = TABLES.find(x=>x.col===c && x.row===r);
          if(!t) return;
          const o = document.createElement("option"); o.value = t.id; o.textContent = t.id; og.appendChild(o);
        });
        if(og.children.length) sel.appendChild(og);
      });
      sel.dataset.filled = "1";
      sel.onchange = ()=>{ currentTable = sel.value; cart = {}; renderKhach(); };
    }
    sel.value = currentTable;
    khachSub.textContent = "Xem trước";
  }
  renderModeTabs();
  renderZaloBook();
  renderBookingLockBox();
  renderTAInfoBar();
  renderSuggestWrap();
  renderCatFilter();

  const real = MODE === "khach" ? resolveTable(currentTable) : null;
  const locked = real && isTableLocked(real);
  const notOpened = MODE === "khach" && !isTakeawayQR && real && !state.tableSessions[real];
  const menuDiv = document.getElementById("menuList");

  if(locked){
    menuDiv.innerHTML = '<div class="empty" style="padding:2rem 0;color:var(--p2);font-weight:700">🔒 Bàn đặt trước<br><span class="tiny" style="font-weight:400">Không đặt được món.</span></div>';
    renderMyOrders();
    renderCartBottomBar();
    return;
  }
  if(notOpened){
    menuDiv.innerHTML = '<div class="empty" style="padding:2rem 0;color:var(--danger);font-weight:700">⛔ Bàn chưa mở<br><span class="tiny" style="font-weight:400">Vui lòng đợi NV xác nhận khách đã tới.</span></div>' +
      '<button class="btn secondary" id="btnCallOpen2" style="width:100%">🔔 Gọi NV mở bàn</button>';
    const b2 = document.getElementById("btnCallOpen2");
    if(b2) b2.onclick = ()=>{ sendCall("other", "Xin mở bàn"); alert("Đã gửi."); };
    renderMyOrders();
    renderCartBottomBar();
    return;
  }

  menuDiv.innerHTML = "";
  getCats().forEach(cat=>{
    if(!catVisible(cat)) return;
    const items = state.menu.filter(m=>m.cat === cat);
    if(!items.length) return;
    const cb = document.createElement("div"); cb.className = "menu-cat";
    const h = document.createElement("div"); h.className = "menu-cat-h";
    h.innerHTML = '<span class="ci">' + catIcon(cat) + '</span><span class="cn">' + esc(cat) + '</span>';
    cb.appendChild(h);
    const grid = document.createElement("div"); grid.className = "menu-grid";
    items.forEach(m=>{
      const c = cart[m.id] || {qty:0, note:"", scheduledAt:0};
      const orderable = isItemOrderable(m);
      const card = document.createElement("div");
      card.className = "menu-card" + (orderable ? "" : " out");
      const priceTxt = m.price > 0 ? VND(m.price) : "Miễn phí";
      const isBillable = isBillableItem(m);
      const caseBtn = (m.caseSize && orderable) ? '<button class="caseb" data-case="' + m.id + '">+Thùng</button>' : "";
      const schedBtn = orderable ? '<button class="sched" data-sched="' + m.id + '">⏰</button>' : "";
      const bestTag = m.tag === "best" ? '<span class="m-tag-best">🔥</span>' : "";
      const freeTag = (!isBillable && m.price === 0) ? '<span class="m-tag-best" style="background:linear-gradient(135deg,#4A7C4F,#2F5A33)">FREE</span>' : '';
      const imgHtml = itemImageHtml(m);
      const avgStar = m.ratingCount > 0 ? (m.ratingSum / m.ratingCount) : 0;
      const ratingHtml = m.ratingCount > 0
        ? '<div class="m-rating">⭐ ' + avgStar.toFixed(1) + ' <span class="muted">(' + m.ratingCount + ')</span></div>'
        : '';
      const reason = !m.available ? "Ngừng bán" : (orderable ? "" : "Hết NL");
      const schedTxt = c.scheduledAt ? '<div class="tiny" style="color:var(--p4);font-weight:700;margin-top:.2rem">⏰ ' + fmtDateTime(c.scheduledAt) + '</div>' : '';
      if(!orderable){
        card.innerHTML = '<div class="m-img">' + imgHtml + '</div>' +
          '<div class="m-body"><div class="m-name">' + esc(m.name) + bestTag + '</div>' +
            ratingHtml + '<div class="m-price">' + priceTxt + '</div>' +
            '<div class="tiny" style="color:var(--danger);font-weight:600">⛔ ' + esc(reason) + '</div></div>';
        grid.appendChild(card); return;
      }
      card.innerHTML = '<div class="m-img">' + imgHtml + '</div>' +
        '<div class="m-body">' +
          '<div class="m-name">' + esc(m.name) + bestTag + freeTag + '</div>' +
          ratingHtml + '<div class="m-price">' + priceTxt + '</div>' +
          (c.note ? '<div class="m-note">📝 ' + esc(c.note) + '</div>' : '') +
          schedTxt +
          '<div class="m-actions">' +
            '<button data-a="dec" data-id="' + m.id + '">−</button>' +
            '<span class="qn">' + c.qty + '</span>' +
            '<button data-a="inc" data-id="' + m.id + '">+</button>' +
            caseBtn + schedBtn +
          '</div>' +
          (c.qty>0 ? '<input class="m-noteinput" data-id="' + m.id + '" placeholder="Ghi chú..." value="' + esc(c.note) + '">' : '') +
        '</div>';
      grid.appendChild(card);
    });
    cb.appendChild(grid);
    menuDiv.appendChild(cb);
  });
  menuDiv.querySelectorAll("button[data-a]").forEach(b=>b.onclick = ()=>{
    const id = b.dataset.id;
    const cur = cart[id] || {qty:0, note:"", scheduledAt:0};
    cur.qty += (b.dataset.a === "inc" ? 1 : -1);
    if(cur.qty <= 0) delete cart[id]; else cart[id] = cur;
    renderKhach(); renderCartBottomBar();
  });
  menuDiv.querySelectorAll("button[data-case]").forEach(b=>b.onclick = ()=>{
    const id = b.dataset.case;
    const m = state.menu.find(x=>x.id === id);
    if(!m || !m.caseSize) return;
    const cur = cart[id] || {qty:0, note:"", scheduledAt:0};
    cur.qty += m.caseSize; cart[id] = cur;
    renderKhach(); renderCartBottomBar();
  });
  menuDiv.querySelectorAll("button[data-sched]").forEach(b=>b.onclick = ()=>{ openScheduleModal(b.dataset.sched); });
  menuDiv.querySelectorAll("input.m-noteinput").forEach(inp=>{
    inp.oninput = ()=>{
      const id = inp.dataset.id;
      if(!cart[id]) cart[id] = {qty:1, note:"", scheduledAt:0};
      cart[id].note = inp.value;
    };
  });
  renderMyOrders();
  renderCartBottomBar();
}

function openScheduleModal(itemId){
  const m = state.menu.find(x=>x.id === itemId);
  if(!m) return;
  const cur = cart[itemId] || {qty:0, note:"", scheduledAt:0};
  const now = new Date();
  const defDate = cur.scheduledAt ? new Date(cur.scheduledAt) : now;
  const dateStr = defDate.getFullYear() + "-" + String(defDate.getMonth()+1).padStart(2,'0') + "-" + String(defDate.getDate()).padStart(2,'0');
  const timeStr = String(defDate.getHours()).padStart(2,'0') + ":" + String(defDate.getMinutes()).padStart(2,'0');
  const root = document.getElementById("modalRoot");
  modalLocked = true;
  root.innerHTML = '<div class="modal-back" id="mb"><div class="modal">' +
    '<button class="close-x" id="mc">✕</button>' +
    '<h3>⏰ Hẹn giờ làm món</h3>' +
    '<label class="fl">Ngày <input type="date" id="schedDate" value="' + dateStr + '"></label>' +
    '<label class="fl">Giờ <input type="time" id="schedTime" value="' + timeStr + '"></label>' +
    '<div class="filter-bar" style="margin-top:.5rem">' +
      '<button data-quick="15">+15p</button><button data-quick="30">+30p</button>' +
      '<button data-quick="60">+1h</button><button data-quick="120">+2h</button>' +
    '</div>' +
    '<label class="fl">Số lượng <input type="number" id="schedQty" value="' + Math.max(1, cur.qty||1) + '" min="1"></label>' +
    '<label class="fl">Ghi chú <input id="schedNote" value="' + esc(cur.note||"") + '" autocomplete="off"></label>' +
    '<div class="row" style="margin-top:.8rem"><button class="btn secondary" id="schedCancel">Hủy</button>' +
    '<button class="btn" id="schedSave" style="background:linear-gradient(135deg,var(--p4),#5E2A6A)">⏰ Lưu</button></div></div></div>';
  const close = ()=>{ modalLocked = false; root.innerHTML = ""; renderKhach(); };
  document.getElementById("mc").onclick = close;
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb") close(); };
  document.getElementById("schedCancel").onclick = close;
  root.querySelectorAll("[data-quick]").forEach(b=>b.onclick = ()=>{
    const add = parseInt(b.dataset.quick);
    const t = new Date(Date.now() + add*60000);
    document.getElementById("schedDate").value = t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,'0') + "-" + String(t.getDate()).padStart(2,'0');
    document.getElementById("schedTime").value = String(t.getHours()).padStart(2,'0') + ":" + String(t.getMinutes()).padStart(2,'0');
  });
  document.getElementById("schedSave").onclick = ()=>{
    const d = document.getElementById("schedDate").value;
    const t = document.getElementById("schedTime").value;
    if(!d || !t){ alert("Chọn ngày giờ"); return; }
    const dt = new Date(d + "T" + t + ":00").getTime();
    if(dt <= Date.now()){ alert("Phải ở tương lai"); return; }
    const qty = Math.max(1, parseInt(document.getElementById("schedQty").value)||1);
    const note = document.getElementById("schedNote").value.trim();
    cart[itemId] = {qty, note, scheduledAt: dt};
    close();
  };
}

/* ============================================================
   MY ORDERS
   ============================================================ */
function renderMyOrders(){
  const box = document.getElementById("myOrders");
  if(!box) return;
  let mine = [];
  if(currentKhachMode === "takeaway"){
    const myPhone = taInfo.phone || guestPhoneSession;
    if(myPhone){
      const myTAs = Object.keys(state.takeawayMeta).filter(k=>{
        const meta = state.takeawayMeta[k];
        return meta.phone === myPhone;
      });
      mine = state.orders.filter(o=>o.status !== "huy" && myTAs.includes(o.table));
    }
    if(!mine.length && !myPhone){
      box.innerHTML = '<div class="tiny muted">Đơn mang về sẽ được NV gọi xác nhận qua SĐT.</div>';
      return;
    }
  } else {
    const real = resolveTable(currentTable);
    mine = state.orders.filter(o=>o.table === real && o.status !== "huy");
  }
  
  if(!mine.length){
    box.innerHTML = '<div class="empty">Chưa có đơn</div>';
    return;
  }
  
  const canCancel = state.settings.allowCustomerCancel !== false;
  box.innerHTML = '<div class="tiny muted" style="margin-bottom:.4rem">' +
    (canCancel ? '💡 Hủy được khi bếp <b>chưa xác nhận</b>.' : '💡 Liên hệ NV nếu muốn hủy món.') + '</div>';
  
  // Nếu TA: hiện tổng đơn + trạng thái giao
  if(currentKhachMode === "takeaway"){
    const tas = Array.from(new Set(mine.map(o=>o.table)));
    tas.forEach(taId=>{
      const meta = getTAMeta(taId);
      const osTA = mine.filter(o=>o.table === taId);
      const total = taGrandTotal(taId);
      const hasPendingCK = osTA.some(o=>o.status === "cho_ck");
      const hasDelivering = osTA.some(o=>o.status === "dang_giao");
      const allDelivered = osTA.every(o=>o.status === "da_giao" || o.status === "hoan_thanh");
      const allDone = osTA.every(o=>o.status === "hoan_thanh" || o.status === "da_giao");
      
      let statusBadge = "";
      if(hasPendingCK) statusBadge = '<span class="badge pending">💳 Chờ xác nhận CK</span>';
      else if(hasDelivering) statusBadge = '<span class="badge delivering">🚚 Đang giao hàng</span>';
      else if(allDelivered) statusBadge = '<span class="badge delivered">🎉 Đã giao thành công</span>';
      else if(allDone) statusBadge = '<span class="badge paid">✅ Đã làm xong — chờ giao</span>';
      else statusBadge = '<span class="badge new">⏳ Đang chuẩn bị</span>';
      
      const wrapper = document.createElement("div");
      wrapper.className = "card";
      wrapper.style.cssText = "margin-bottom:.5rem;padding:.6rem;border-left:3px solid var(--ta)";
      wrapper.innerHTML = '<div class="row" style="margin-bottom:.3rem"><b>🥡 Đơn ' + esc(taId) + '</b>' + statusBadge + '</div>' +
        '<div class="tiny muted">' + osTA.length + ' món · Tổng: <b style="color:var(--primary-d)">' + VND(total) + '</b></div>';
      // Fix: hiện từng món
      const itemsDiv = document.createElement("div");
      itemsDiv.style.cssText = "margin-top:.5rem";
      osTA.forEach(o=>{
        const done = o.status === "hoan_thanh" || o.status === "da_giao";
        const canCancelRow = canCancel && o.status === "cho_bep";
        const statusCls = {
          cho_bep:'new', cho_ck:'pending', dang_lam:'cooking',
          hoan_thanh:'st', dang_giao:'delivering', da_giao:'delivered'
        }[o.status] || 'st';
        const itemDiv = document.createElement("div");
        itemDiv.className = "item" + (done ? " served" : "");
        itemDiv.innerHTML = '<div class="name" style="flex:1;min-width:0">' +
            (done ? "✅ " : "") + esc(o.name) + ' ×' + o.qty +
            (o.note ? ' <span class="notetag">📝 ' + esc(o.note) + '</span>' : '') +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:.4rem;flex:0 0 auto">' +
            '<span class="badge ' + statusCls + '">' + statusLabel(o.status) + '</span>' +
            (canCancelRow ? '<button class="pillbtn x" data-cust-cancel="' + o.id + '">✕</button>' : "") +
          '</div>';
        itemsDiv.appendChild(itemDiv);
      });
      wrapper.appendChild(itemsDiv);
      box.appendChild(wrapper);
    });
  } else {
    // Dine-in: hiện từng món
    mine.slice().reverse().forEach(o=>{
      const done = o.status === "hoan_thanh";
      const canCancelRow = canCancel && o.status === "cho_bep";
      const d = document.createElement("div"); d.className = "item" + (done ? " served" : "");
      let ratingHtml = "";
      if(o.status === "hoan_thanh"){
        if(o.rated){
          ratingHtml = '<div class="tiny" style="margin-top:.3rem;color:var(--gold-d);font-weight:700">Bạn đã chấm ' + "⭐".repeat(o.ratingStar||0) + '</div>';
        } else {
          ratingHtml = '<div class="reaction-bar" style="margin-top:.35rem">' +
            [1,2,3,4,5].map(s=>'<button class="reaction-btn" data-rate="' + o.id + '" data-star="' + s + '">' + '⭐'.repeat(s) + '</button>').join("") +
          '</div>';
        }
      }
      const schedHtml = isScheduled(o) ? ' <span class="scheduletag">⏰ ' + fmtDateTime(o.scheduledAt) + '</span>' : '';
      const statusCls = {
        cho_bep:'new', cho_ck:'pending', dang_lam:'cooking',
        hoan_thanh:'st', dang_giao:'delivering', da_giao:'delivered'

function customerCancelOrder(orderId){

function rateOrder(orderId, star){
  const o = state.orders.find(x=>x.id === orderId);

  if(o.status !== "hoan_thanh"){ alert("Đợi món ra"); return; }
  const m = state.menu.find(x=>x.id === o.itemId);

function gachaScore(m){
  const cost = itemCost(m);
  const margin = m.price > 0 ? (m.price - cost) / m.price : 0;
  const tagBonus = m.tag === "best" ? 60 : (m.tag === "good" ? 30 : 0);
  const ratingBonus = m.ratingCount > 0 ? (m.ratingSum/m.ratingCount) * 5 : 0;
  return Math.max(1, margin * 100 + tagBonus + ratingBonus + Math.random()*50 + 15);
}
function weightedPick(pool){
  if(!pool.length) return null;
  const scored = pool.map(m=>({m, score: gachaScore(m)}));
  const total = scored.reduce((s,x)=>s+x.score, 0);
  let r = Math.random() * total;
  for(const x of scored){ r -= x.score; if(r <= 0) return x.m; }
  return scored[scored.length-1].m;
}
function gachaRollAll(selectedCats, guests){
  const result = [];
  const usedIds = new Set();
  selectedCats.forEach(cat=>{
    const pool = state.menu.filter(m => m.cat === cat && m.available && isItemOrderable(m) && !usedIds.has(m.id));
    if(!pool.length) return;
    const pick = weightedPick(pool);
    if(!pick) return;
    usedIds.add(pick.id);
    let qty = 1;
    if(cat === "Bia") qty = randomBeerQty(guests);
    else if(cat === "Nước ngọt") qty = Math.max(1, Math.ceil(guests / 2));
    result.push({itemId: pick.id, qty, cat});
  });
  return result;
}

    let html = '<div class="modal-back" id="mb"><div class="modal" style="max-width:560px">' +
      '<button class="close-x" id="mc">✕</button>' +
      '<h3 style="text-align:center;color:var(--primary-d);margin:.2rem 0">🎲 Ăn gì cũng được</h3>' +
      '<div class="tiny muted" style="text-align:center;margin-bottom:.5rem">Chọn nhóm bạn muốn gì → quay ra combo toàn bộ món</div>' +
      '<div class="gacha-dice ' + (rolling?'rolling':'') + '">🎲</div>' +
      '<label class="fl" style="margin-top:0">Số khách' +
        '<input type="number" id="gGuests" value="' + guests + '" min="1" max="30"></label>' +
      '<div style="margin-top:.5rem"><div class="tiny muted" style="margin-bottom:.3rem">Chọn nhóm món:</div>' +
      '<div class="cat-chips">';
    availableCats.forEach(cat=>{
      html += '<button class="cat-chip ' + (selected.has(cat)?'on':'') + '" data-cat="' + esc(cat) + '">' + catIcon(cat) + ' ' + esc(cat) + '</button>';
    });
    html += '</div></div>' +
      '<div class="row" style="margin-top:.4rem;gap:.3rem">' +
        '<button class="btn secondary small" id="gAllCats">Chọn tất cả</button>' +
        '<button class="btn secondary small" id="gClearCats">Bỏ chọn</button>' +
        '<button class="btn secondary small" id="gRec">Gợi ý tốt</button>' +
      '</div>' +
      '<button class="gacha-roll" id="gRoll" ' + (rolling?'disabled':'') + ' style="margin-top:.6rem">' +
        (rolling ? '🎲 ĐANG QUAY...' : (result.length ? '🎲 QUAY LẠI' : '🎲 QUAY NGAY')) +
      '</button>';
    if(result.length){
      html += '<div style="margin-top:.8rem">' +
        '<div class="row" style="margin-bottom:.4rem"><b>✨ Combo gợi ý</b>' +
        '<span class="tiny muted" id="gTotal">' + result.length + ' món</span></div>' +
        '<div id="gList">';
      result.forEach((r,i)=>{ html += buildItemHtml(r,i); });
      html += '</div></div>' +
        '<div class="row" style="margin-top:.7rem;gap:.4rem">' +
          '<button class="btn secondary small" id="gClear" style="flex:0 0 auto">🗑️ Xóa hết</button>' +
          '<button class="btn ok" id="gAdd" style="flex:1">🛒 Thêm vào giỏ</button>' +
        '</div>';
    }
    html += '<button class="btn secondary" id="gBack" style="width:100%;margin-top:.5rem">← Đóng</button></div></div>';
    root.innerHTML = html;
    bind();
  }
  function bind(){
    const close = ()=>{ modalLocked = false; root.innerHTML = ""; renderAll(); };
    document.getElementById("mc").onclick = close;
    document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb") close(); };
    document.getElementById("gBack").onclick = close;
    document.getElementById("gGuests").oninput = e => { guests = Math.max(1, Math.min(30, parseInt(e.target.value)||1)); };
    root.querySelectorAll("[data-cat]").forEach(b=>b.onclick = ()=>{
      const cat = b.dataset.cat;
      if(selected.has(cat)) selected.delete(cat); else selected.add(cat);
      b.classList.toggle("on");
    });
    document.getElementById("gAllCats").onclick = ()=>{ availableCats.forEach(c=>selected.add(c)); root.querySelectorAll("[data-cat]").forEach(b=>b.classList.add("on")); };
    document.getElementById("gClearCats").onclick = ()=>{ selected.clear(); root.querySelectorAll("[data-cat]").forEach(b=>b.classList.remove("on")); };
    document.getElementById("gRec").onclick = ()=>{
      const scored = availableCats.map(cat=>{
        const items = state.menu.filter(m => m.cat === cat && m.available && isItemOrderable(m));
        if(!items.length) return {cat, score:0};
        return {cat, score: items.reduce((s,m)=>s + gachaScore(m), 0) / items.length};
      }).filter(x=>x.score>0).sort((a,b)=>b.score - a.score).slice(0,5);
      selected = new Set(scored.map(x=>x.cat));
      render();
    };
    document.getElementById("gRoll").onclick = () => {
      if(rolling || !selected.size){ if(!selected.size) alert("Chọn ít nhất 1 danh mục"); return; }
      rolling = true; render();
      setTimeout(()=>{
        result = gachaRollAll(Array.from(selected), guests);
        if(!result.length) alert("Không có món nào khả dụng trong danh mục đã chọn.");
        rolling = false; render();
      }, 800);
    };
    bindListEvents();
    const clr = document.getElementById("gClear");
    if(clr) clr.onclick = ()=>{ if(confirm("Xoá hết?")){ result = []; render(); } };
    const add = document.getElementById("gAdd");
    if(add) add.onclick = ()=>{
      if(!result.length) return;
      result.forEach(r=>{ const cur = cart[r.itemId] || {qty:0, note:"", scheduledAt:0}; cur.qty += r.qty; cart[r.itemId] = cur; });
      modalLocked = false; root.innerHTML = "";
      alert("✓ Đã thêm " + result.length + " món vào giỏ");
      renderAll();
    };
  }
  render();
}
/* ============================================================
   PHỤC VỤ — Hàm dùng chung
   ============================================================ */
function tableOrders(t){ return state.orders.filter(o=>o.table === t && o.status !== "huy"); }
function tableTotal(t){ return tableOrders(t).reduce((s,o)=>s + o.qty*o.price, 0); }
function taTotal(taId){ return tableOrders(taId).reduce((s,o)=>s + o.qty*o.price, 0); }

/* ============================================================
   SƠ ĐỒ BÀN
   ============================================================ */
function tableCellEl(t){
  const el = document.createElement("div");
  const isMergedInto = state.merges[t.id];
  if(isMergedInto){
    const real = resolveTable(t.id);
    el.className = "tbl merged";
    el.innerHTML = '<b>' + t.id + '</b><div class="muted">→ ' + real + '</div>';
    el.onclick = ()=>{ activeModalTable = real; activeModalTA = null; actionMode = null; renderModal(); };
    return el;
  }
  const os = tableOrders(t.id);
  const busy = os.length > 0;
  const svcs = getTableServices(t.id);
  const hasCall = state.calls.some(c=>c.table === t.id && !c.handled);
  const note = state.tableNotes[t.id];
  const booking = getBooking(t.id);
  const locked = booking && booking.locked;
  const opened = !!state.tableSessions[t.id];
  let cls = "tbl ";
  if(locked) cls += "locked";
  else if(busy) cls += "busy";
  else cls += "trong";
  el.className = cls;
  const elapsed = busy && state.tableSessions[t.id] ? '<div class="muted">' + minsAgo(state.tableSessions[t.id]) + "'</div>" : "";
  const kids = mergedChildren(t.id);
  const kidTxt = kids.length ? '<div class="muted">+' + kids.join(",") + '</div>' : "";
  const svcTxt = svcs.length ? '<div class="tiny" style="color:var(--p2)">+DV×' + svcs.length + '</div>' : "";
  const callTxt = hasCall ? '<div class="tiny" style="color:var(--danger);font-weight:800">🔔</div>' : "";
  const noteTxt = note ? '<div class="tiny" style="color:var(--p4)">📌</div>' : "";
  const bookTxt = locked ? '<div class="tiny" style="color:#fff;font-weight:800">🔒</div>' : "";
  const notOpenTxt = (!busy && !locked && !opened) ? '<div class="tiny" style="color:var(--muted)">chưa mở</div>' : "";
  const totalTxt = busy ? VND(tableTotal(t.id)) : (locked ? "Đặt" : "Trống");
  el.innerHTML = '<b>' + t.id + '</b><div class="muted">' + totalTxt + '</div>' + elapsed + kidTxt + svcTxt + callTxt + noteTxt + bookTxt + notOpenTxt;
  el.onclick = ()=>{ activeModalTable = t.id; activeModalTA = null; actionMode = null; renderModal(); };
  return el;
}

/* ============================================================
   CARD ĐƠN MANG VỀ — Fix #1: Xác nhận CK cả đơn kèm tổng tiền
   ============================================================ */
function taCardEl(taId){
  const meta = getTAMeta(taId);
  const itemsTotal = taTotal(taId);
  const svcTotal = getTASvcTotal(taId);
  const df = meta.deliveryFee || 0;
  const grand = itemsTotal + svcTotal + df;
  const os = tableOrders(taId);
  const hasCall = state.calls.some(c=>c.table === taId && !c.handled);
  const pendingCK = os.some(o=>o.status === "cho_ck");
  const delivering = os.some(o=>o.status === "dang_giao");
  const allDelivered = os.length > 0 && os.every(o=>o.status === "da_giao");
  const allDone = os.length > 0 && os.every(o=>o.status === "hoan_thanh" || o.status === "da_giao");
  const el = document.createElement("div");
  el.className = "ta-card" + (pendingCK ? " pending-ck" : "");
  const badge = meta.pickup ? '<span class="badge p3">🏃 Tự lấy</span>' : '<span class="badge ta">🛵 Giao</span>';
  let statusBadge = "";
  if(pendingCK) statusBadge = '<span class="badge pending">💳 Chờ xác nhận CK</span> ';
  else if(delivering) statusBadge = '<span class="badge delivering">🚚 Đang giao</span> ';
  else if(allDelivered) statusBadge = '<span class="badge delivered">🎉 Đã giao</span> ';
  else if(allDone) statusBadge = '<span class="badge paid">✅ Xong — chờ giao</span> ';
  
  el.innerHTML = '<div class="ta-h"><div style="flex:1;min-width:0">' +
      '<div class="ta-id">🥡 ' + taId + ' ' + (hasCall?'<span style="color:var(--danger)">🔔</span>':'') + '</div>' +
      '<div class="ta-name">' + esc(meta.name||"(không tên)") + ' · ' + esc(meta.phone||"") + '</div>' +
      (!meta.pickup && meta.address ? '<div class="ta-info">📍 ' + esc(meta.address) + '</div>' : (meta.pickup ? '<div class="ta-info">🏃 Khách tự đến lấy</div>' : '')) +
      (meta.note ? '<div class="ta-info">📝 ' + esc(meta.note) + '</div>' : '') +
      '<div class="ta-info">⏱ ' + minsAgo(state.tableSessions[taId]) + "' · " + os.reduce((s,o)=>s+o.qty,0) + ' món</div>' +
    '</div><div style="text-align:right;flex:0 0 auto">' +
      statusBadge + badge +
      '<div class="ta-total">' + VND(grand) + '</div>' +
      (svcTotal > 0 ? '<div class="tiny muted">Đã gồm DV ' + VND(svcTotal) + '</div>' : '') +
      (df > 0 ? '<div class="tiny muted">Đã gồm ship ' + VND(df) + '</div>' : '') +
    '</div></div>' +
    // Fix #1: nút xác nhận CK ngay trên card
    '<div class="ta-actions">' +
      (pendingCK
        ? '<button class="btn ok small" data-ta-confirm="' + taId + '">✓ Xác nhận CK (' + VND(grand) + ')</button>'
        : '') +
      (allDone && !allDelivered && !delivering && !meta.pickup
        ? '<button class="btn blue small" data-ta-start-delivery="' + taId + '">🚚 Bắt đầu giao</button>'
        : '') +
      (delivering
        ? '<button class="btn ok small" data-ta-confirmed="' + taId + '">🎉 Đã giao xong</button>'
        : '') +
      '<button class="btn secondary small" data-ta-open="' + taId + '">📝 Chi tiết</button>' +
    '</div>';
  return el;
}

/* ============================================================
   SUBNAV PHỤC VỤ
   ============================================================ */
function renderPVSubnav(){
  const sub = document.getElementById("pvSubnav");
  if(!sub) return;
  const taCount = getActiveTAs().length;
  const pendingCKCount = getActiveTAs().filter(t=>tableOrders(t).some(o=>o.status === "cho_ck")).length;
  const bookingCount = Object.keys(state.bookings).filter(t=>state.bookings[t].locked).length;
  const musicCount = state.musicQueue.filter(m=>!m.played && !m.skipped && !m.playing).length;
  sub.innerHTML =
    '<button class="' + (currentPvTab==='tables'?'active':'') + '" data-pv="tables">🍽️ Bàn</button>' +
    '<button class="' + (currentPvTab==='takeaway'?'active':'') + '" data-pv="takeaway">🥡 Mang về ' + (taCount?'('+taCount+')':'') + (pendingCKCount?' 🔴'+pendingCKCount:'') + '</button>' +
    '<button class="' + (currentPvTab==='booking'?'active':'') + '" data-pv="booking">🔒 Đặt bàn ' + (bookingCount?'('+bookingCount+')':'') + '</button>' +
    '<button class="' + (currentPvTab==='music'?'active':'') + '" data-pv="music">🎵 Nhạc ' + (musicCount?'('+musicCount+')':'') + '</button>';

/* ============================================================
   RENDER PHỤC VỤ
   ============================================================ */
function renderPV(){
  renderPVSubnav();
  const content = document.getElementById("pvContent");
  if(currentPvTab === "tables"){
    const cols = getVisibleCols();
    const rows = getVisibleRows();
    content.innerHTML = '<div class="card"><b>Sơ đồ bàn</b>' +
      '<div class="muted tiny">Xanh = trống · Vàng = có khách · Tím = ghép · <b style="color:var(--p2)">Xanh dương = đã đặt</b>.</div></div>' +
      '<div class="tbl-matrix" id="tableGrid" style="grid-template-columns:24px repeat(' + cols.length + ',1fr)"></div>';
    const grid = document.getElementById("tableGrid");
    const mc = txt => { const d = document.createElement("div"); d.className="mcell"; d.textContent = txt; return d; };
    grid.appendChild(mc(""));
    cols.forEach(c=>grid.appendChild(mc(c)));
    rows.forEach(r=>{
      grid.appendChild(mc(r));
      cols.forEach(c=>{
        const t = TABLES.find(x=>x.col===c && x.row===r);
        if(t) grid.appendChild(tableCellEl(t));
        else grid.appendChild(mc(""));
      });
    });
  } else if(currentPvTab === "takeaway"){
    const tas = getActiveTAs();
    content.innerHTML = '<div class="card"><b>🥡 Đơn mang về</b>' +
      '<div class="muted tiny">Bấm xác nhận CK để bếp bắt đầu làm. Bấm "Chi tiết" để xem đầy đủ.</div></div>' +
      (tas.length ? "" : '<div class="empty">Chưa có đơn</div>') +
      '<div id="taList"></div>';
    const list = document.getElementById("taList");
    tas.forEach(ta => list.appendChild(taCardEl(ta)));
    // Bind sự kiện nút
    content.querySelectorAll("[data-ta-confirm]").forEach(b=>b.onclick = (e)=>{
      e.stopPropagation();
      const taId = b.dataset.taConfirm;
      confirmTACheckout(taId);
    });
    content.querySelectorAll("[data-ta-start-delivery]").forEach(b=>b.onclick = (e)=>{
      e.stopPropagation();
      const taId = b.dataset.taStartDelivery;
      if(!confirm("Bắt đầu giao đơn " + taId + "?")) return;
      tableOrders(taId).forEach(o=>{
        if(o.status === "hoan_thanh"){ o.status = "dang_giao"; o.deliveryStartedAt = nowMs(); }
      });
      const meta = getTAMeta(taId);
      meta.deliveryStatus = "delivering";
      setTAMeta(taId, meta);
      save(); renderAll();
    });
    content.querySelectorAll("[data-ta-confirmed]").forEach(b=>b.onclick = (e)=>{
      e.stopPropagation();
      const taId = b.dataset.taConfirmed;
      if(!confirm("Xác nhận giao xong đơn " + taId + "?")) return;
      tableOrders(taId).forEach(o=>{
        if(o.status === "dang_giao"){ o.status = "da_giao"; o.deliveredAt = nowMs(); }
      });
      const meta = getTAMeta(taId);
      meta.deliveryStatus = "delivered";
      setTAMeta(taId, meta);
      save(); renderAll();
    });
    content.querySelectorAll("[data-ta-open]").forEach(b=>b.onclick = (e)=>{
      e.stopPropagation();
      const taId = b.dataset.taOpen;
      activeModalTA = taId; activeModalTable = null; actionMode = null;
      renderModal();
    });
  } else if(currentPvTab === "booking"){
    renderPVBooking(content);
  } else if(currentPvTab === "music"){
    renderMusicAdminInPV(content);
  }
}

/* ============================================================
   Fix #1: XÁC NHẬN CK TOÀN ĐƠN MANG VỀ
   ============================================================ */
function confirmTACheckout(taId){
  const os = tableOrders(taId).filter(o=>o.status === "cho_ck");
  if(!os.length){ alert("Không có món nào chờ CK."); return; }
  const meta = getTAMeta(taId);
  const itemsTotal = tableOrders(taId).reduce((s,o)=>s + o.qty*o.price, 0);
  const svcTotal = getTASvcTotal(taId);
  
  // Fix #7: NV nhập phí giao ở đây (nếu chưa pickup)
  const needFee = !meta.pickup;
  const defaultFee = meta.deliveryFee || state.settings.defaultDeliveryFee || 0;
  
  const root = document.getElementById("modalRoot");
  modalLocked = true;
  let itemsHtml = os.map(o=>{
    const type = typeOfItem(o.itemId);
    const tag = type === "beer" ? '<span class="badge beer">🍺</span>' :
                type === "softdrink" ? '<span class="badge drink">🥤</span>' :
                type === "service" ? '<span class="badge service">🧂</span>' : "";
    return '<div class="payrow">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="name">' + tag + ' ' + esc(o.name) + ' ×' + o.qty + (o.note?' <span class="notetag">📝 ' + esc(o.note) + '</span>':'') + '</div>' +
        '<div class="price">' + VND(o.price) + ' × ' + o.qty + ' = <b>' + VND(o.price*o.qty) + '</b></div>' +
      '</div>' +
      '<button class="pillbtn x" data-ck-cancel="' + o.id + '" title="Hủy món">✕</button>' +
    '</div>';
  }).join("");
  
  root.innerHTML = '<div class="modal-back" id="mb"><div class="modal">' +
    '<button class="close-x" id="mc">✕</button>' +
    '<h3>💳 Xác nhận CK đơn ' + taId + '</h3>' +
    '<div class="tiny muted">Kiểm tra số tiền đã nhận, nhập phí giao (nếu có), rồi xác nhận.</div>' +
    '<div style="margin-top:.6rem" id="ckList">' + itemsHtml + '</div>' +
    '<div style="margin-top:.5rem;background:var(--bg);padding:.5rem;border-radius:8px">' +
      '<div class="row"><span>Tổng món:</span><b id="ckItemsTotal">' + VND(itemsTotal) + '</b></div>' +
      (svcTotal > 0 ? '<div class="row"><span>Dịch vụ cộng thêm:</span><b>' + VND(svcTotal) + '</b></div>' : '') +
      (needFee
        ? '<label class="fl" style="margin-top:.3rem">🚚 Phí giao (NV nhập)<input type="number" id="ckDeliveryFee" value="' + defaultFee + '" step="1000" min="0"></label>'
        : '<div class="row" style="margin-top:.3rem"><span>🏃 Khách tự lấy:</span><b>' + VND(0) + '</b></div>') +
      '<div class="row" style="border-top:1px dashed var(--border);padding-top:.4rem;margin-top:.4rem;font-size:1.1rem"><b>TỔNG THU:</b><b id="ckGrandTotal" style="color:var(--money);font-size:1.15rem">' + VND(itemsTotal + svcTotal + defaultFee) + '</b></div>' +
    '</div>' +
    '<div class="row" style="margin-top:.8rem">' +
      '<button class="btn secondary" id="ckCancelAll">🗑️ Hủy hết</button>' +
      '<button class="btn ok" id="ckConfirm" style="flex:1">✓ Đã nhận CK — Bắt đầu làm</button>' +
    '</div>' +
  '</div></div>';
  const close = ()=>{ modalLocked = false; root.innerHTML = ""; renderAll(); };
  document.getElementById("mc").onclick = close;
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb") close(); };
  
  function updateTotal(){
    const feeEl = document.getElementById("ckDeliveryFee");
    const fee = needFee && feeEl ? Math.max(0, parseInt(feeEl.value)||0) : 0;
    const grand = itemsTotal + svcTotal + fee;
    document.getElementById("ckGrandTotal").textContent = VND(grand);
  }
  const feeEl = document.getElementById("ckDeliveryFee");
  if(feeEl) feeEl.oninput = updateTotal;
  updateTotal();
  
  // Fix #1: NV huỷ từng món nếu cần
  root.querySelectorAll("[data-ck-cancel]").forEach(b=>b.onclick = ()=>{
    const oid = b.dataset.ckCancel;
    if(!confirm("Hủy món này?")) return;
    state.orders = state.orders.filter(x=>x.id !== oid);
    save();
    const remaining = tableOrders(taId).filter(o=>o.status === "cho_ck");
    if(!remaining.length){
      // Còn món khác hoặc xóa hết
      const stillHas = tableOrders(taId).length > 0;
      if(stillHas){ modalLocked = false; root.innerHTML = ""; renderAll(); }
      else {
        // Đơn trống → xoá luôn
        delete state.takeawayMeta[taId];
        delete state.tableSessions[taId];
        save();
        modalLocked = false; root.innerHTML = ""; renderAll();
        alert("✓ Đã hủy đơn (không còn món).");
      }
      return;
    }
    // Re-render
    modalLocked = false; root.innerHTML = "";
    confirmTACheckout(taId);
  });
  
  document.getElementById("ckCancelAll").onclick = ()=>{
    if(!confirm("Hủy TẤT CẢ món của đơn " + taId + "?")) return;
    state.orders = state.orders.filter(o=>o.table !== taId);
    delete state.takeawayMeta[taId];
    delete state.tableSessions[taId];
    save();
    close();
    alert("✓ Đã hủy đơn " + taId);
  };
  
  document.getElementById("ckConfirm").onclick = ()=>{
    const fee = needFee && feeEl ? Math.max(0, parseInt(feeEl.value)||0) : 0;
    const grand = itemsTotal + svcTotal + fee;
    if(!confirm("Xác nhận đã nhận " + VND(grand) + "?\nBếp sẽ bắt đầu làm món.")) return;
    // Cập nhật phí giao
    const meta = getTAMeta(taId);
    meta.deliveryFee = fee;
    meta.deliveryFeeConfirmed = true;
    setTAMeta(taId, meta);
    // Đổi status cho các món
    const now = nowMs();
    tableOrders(taId).forEach(o=>{
      if(o.status === "cho_ck"){
        o.status = "cho_bep"; o.paymentStatus = "confirmed"; o.ts = now;
      }
    });
    if(!state.tableSessions[taId]) state.tableSessions[taId] = now;
    save();
    close();
    alert("✓ Đã xác nhận. Bếp bắt đầu làm.");
  };
}

/* ============================================================
   RENDER ĐẶT BÀN trong Phục vụ
   ============================================================ */
function renderPVBooking(content){
  const groups = {};
  Object.keys(state.bookings).forEach(t=>{
    const b = state.bookings[t];
    const key = b.groupId || ("single_" + t);
    if(!groups[key]) groups[key] = {tables: [], info: b, groupId: b.groupId||""};
    groups[key].tables.push(t);
  });
  const groupList = Object.values(groups).sort((a,b)=>b.info.createdAt - a.info.createdAt);

function groupBy(list){
  const g = {};
  list.forEach(o=>{
    const k = o.name + "|" + (o.note||"") + "|" + o.status + "|" + (o.scheduledAt||0);
    if(!g[k]) g[k] = {name:o.name,note:o.note||"",prio:o.prio,prep:o.prep,ts:o.ts,qty:0,tables:{},ids:[],itemId:o.itemId,hasTA:false,status:o.status,scheduledAt:o.scheduledAt||0};
    g[k].qty += o.qty; g[k].ts = Math.min(g[k].ts, o.ts);
    g[k].tables[o.table] = (g[k].tables[o.table]||0) + o.qty;
    g[k].ids.push(o.id);
    if(isTakeawayId(o.table)) g[k].hasTA = true;
  });
  const groups = Object.values(g);
  groups.forEach(gr=>{
    gr.waitMin = minsAgo(gr.ts);
    gr.bump = Math.floor(gr.waitMin / 10);
    gr.effPrio = Math.max(1, gr.prio - gr.bump);
    gr.hot = gr.waitMin >= 15 || gr.effPrio <= 1;
    gr.isSched = gr.scheduledAt > Date.now();
  });
  return groups.sort((a,b)=>{
    if(a.status !== b.status) return a.status === "dang_lam" ? -1 : 1;
    return a.effPrio - b.effPrio || b.waitMin - a.waitMin || a.ts - b.ts;
  });
}
function tblStr(tables){
  return Object.entries(tables).map(([t,q])=> isTakeawayId(t) ? '🥡' + t + '(' + q + ')' : t + '(' + q + ')').join(", ");
}

  const m = state.menu.find(x=>x.id === order.itemId);
