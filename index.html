let rptPeriod = "today"; let rptFrom = "", rptTo = "";
let rptTypeFilter = "all"; let rptView = "overview"; let rankTab = "best";
function getPeriodRange(period, from, to){
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(period === "today") return [todayStart.getTime(), todayStart.getTime() + 86400000 - 1];
  if(period === "week"){
    const dow = now.getDay() || 7;
    const s = new Date(todayStart.getTime() - (dow-1)*86400000);
    return [s.getTime(), s.getTime() + 7*86400000 - 1];
  }
  if(period === "month"){
    const s = new Date(now.getFullYear(), now.getMonth(), 1);
    const e = new Date(now.getFullYear(), now.getMonth()+1, 1).getTime() - 1;
    return [s.getTime(), e];
  }
  if(period === "year"){
    const s = new Date(now.getFullYear(), 0, 1);
    const e = new Date(now.getFullYear()+1, 0, 1).getTime() - 1;
    return [s.getTime(), e];
  }
  if(period === "custom" && from && to) return [new Date(from).getTime(), new Date(to).getTime() + 86400000 - 1];
  return [todayStart.getTime(), now.getTime()];
}
function getPrevRange(period, from, to){
  const [s, e] = getPeriodRange(period, from, to);
  const len = e - s;
  return [s - len, e - len];
}
function calcStats(fromTs, toTs, typeFilter){
  const inv = toArr(state.invoices).filter(i=>i.ts >= fromTs && i.ts <= toTs && i.type === "final" && !i.superseded);
  const filtered = inv.map(i=>({
    ...i,
    items: toArr(i.items).filter(it => typeFilter === "all" || typeOfItem(it.itemId) === typeFilter)
  })).filter(i=>i.items.length > 0);
  const revenue = filtered.reduce((s,i)=>s + i.items.reduce((a,x)=>a + x.qty*x.price, 0), 0);
  const cost = filtered.reduce((s,i)=>s + i.items.reduce((a,x)=>a + x.qty*(x.cost||0), 0), 0);
  const items = filtered.reduce((s,i)=>s + i.items.reduce((a,x)=>a + x.qty, 0), 0);
  const agg = {};
  filtered.forEach(i=>i.items.forEach(x=>{
    if(!agg[x.name]) agg[x.name] = {qty:0, rev:0, cost:0};
    agg[x.name].qty += x.qty; agg[x.name].rev += x.qty*x.price; agg[x.name].cost += x.qty*(x.cost||0);
  }));
  return {invoices:filtered, revenue, cost, items, agg, count:filtered.length};
}
function renderQlReport(el){
  const [fromTs, toTs] = getPeriodRange(rptPeriod, rptFrom, rptTo);
  const [prevFrom, prevTo] = getPrevRange(rptPeriod, rptFrom, rptTo);
  const cur = calcStats(fromTs, toTs, rptTypeFilter);
  const prev = calcStats(prevFrom, prevTo, rptTypeFilter);
  const fin = calcFinance(fromTs, toTs);
  const showFin = isManager();
  function delta(c, p){
    if(!p) return {txt:"—", cls:""};
    const pct = ((c - p) / p) * 100;
    const up = pct >= 0;
    return {txt:(up?"▲ ":"▼ ") + Math.abs(pct).toFixed(1) + "%", cls: up ? "up" : "down"};
  }
  const dRev = delta(cur.revenue, prev.revenue);
  const dItems = delta(cur.items, prev.items);
  const byDay = {};
  cur.invoices.forEach(i=>{
    const d = new Date(i.ts);
    const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    if(!byDay[k]) byDay[k] = {rev:0, cost:0, profit:0};
    const rev = i.items.reduce((a,x)=>a + x.qty*x.price, 0);
    const cost = i.items.reduce((a,x)=>a + x.qty*(x.cost||0), 0);
    byDay[k].rev += rev; byDay[k].cost += cost; byDay[k].profit += (rev - cost);
  });
  const sortedDays = Object.keys(byDay).sort();
  const maxVal = Math.max(1, ...sortedDays.flatMap(d=>[byDay[d].rev, byDay[d].cost, Math.abs(byDay[d].profit)]));
  const chartDays = sortedDays.slice(-31);
  const chartHtml = chartDays.length ? `
    <div class="gchart">
      ${chartDays.map(d=>{
        const v = byDay[d];
        const hR = Math.max(4, Math.round(v.rev / maxVal * 140));
        const hC = Math.max(4, Math.round(v.cost / maxVal * 140));
        const hP = Math.max(4, Math.round(Math.max(0,v.profit) / maxVal * 140));
        const day = d.slice(8) + "/" + d.slice(5,7);
        return `<div class="gday" title="${day}: DT ${VND(v.rev)}, Gốc ${VND(v.cost)}, Lãi ${VND(v.profit)}">
          <div style="font-size:.62rem;font-weight:700;color:var(--primary-d);text-align:center;margin-bottom:2px">${fmtShort(v.rev)}</div>
          <div class="gbars">
            <div class="gbar rev" style="height:${hR}px"></div>
            <div class="gbar cost" style="height:${hC}px"></div>
            <div class="gbar profit" style="height:${hP}px"></div>
          </div>
          <div class="glbl">${day}</div>
        </div>`;
      }).join("")}
    </div>
    <div class="legend">
      <span><span class="dot rev"></span>Doanh thu</span>
      <span><span class="dot cost"></span>Giá gốc</span>
      <span><span class="dot profit"></span>Lợi nhuận</span>
    </div>
    <div style="overflow-x:auto;margin-top:.7rem;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">
      <table style="font-size:.78rem;width:100%">
        <thead style="position:sticky;top:0;background:var(--surface);z-index:1">
          <tr>
            <th>Ngày</th>
            <th style="text-align:right">Doanh thu</th>
            <th style="text-align:right">Giá gốc</th>
            <th style="text-align:right">Lãi</th>
          </tr>
        </thead>
        <tbody>
          ${chartDays.slice().reverse().map(d=>{
            const v = byDay[d];
            const day = d.slice(8) + "/" + d.slice(5,7) + "/" + d.slice(0,4);
            return `<tr>
              <td>${day}</td>
              <td style="text-align:right;color:var(--primary-d);font-weight:600">${VND(v.rev)}</td>
              <td style="text-align:right;color:var(--warn)">${VND(v.cost)}</td>
              <td style="text-align:right;color:${v.profit>=0?'var(--money)':'var(--danger)'};font-weight:700">${VND(v.profit)}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>` : '<div class="empty">Chưa có dữ liệu</div>';
  const ranking = Object.entries(cur.agg).map(([name,v])=>{
    const profit = v.rev - v.cost;
    const margin = v.rev ? profit / v.rev * 100 : 0;
    return {name, qty:v.qty, rev:v.rev, cost:v.cost, profit, margin};
  });
  let ranked = [];
  if(rankTab === "best") ranked = [...ranking].sort((a,b)=>b.qty - a.qty);
  else if(rankTab === "highProfit") ranked = [...ranking].filter(r=>r.profit>0).sort((a,b)=>b.profit - a.profit);
  else if(rankTab === "highMargin") ranked = [...ranking].filter(r=>r.qty>=1).sort((a,b)=>b.margin - a.margin);
  else ranked = [...ranking].sort((a,b)=>a.qty - b.qty);
  ranked = ranked.slice(0, 15);
  const grossProfit = cur.revenue - cur.cost;
  const marginPct = cur.revenue ? Math.round(grossProfit / cur.revenue * 100) : 0;
  el.innerHTML = `
    <div class="card">
      <div class="row">
        <select id="rptPeriod">
          <option value="today" ${rptPeriod==="today"?"selected":""}>Hôm nay</option>
          <option value="week" ${rptPeriod==="week"?"selected":""}>Tuần</option>
          <option value="month" ${rptPeriod==="month"?"selected":""}>Tháng</option>
          <option value="year" ${rptPeriod==="year"?"selected":""}>Năm</option>
          <option value="custom" ${rptPeriod==="custom"?"selected":""}>Tùy chọn</option>
        </select>
        ${rptPeriod==="custom" ? `<input type="date" id="rptFrom" value="${rptFrom}"><input type="date" id="rptTo" value="${rptTo}"><button class="btn small" id="rptApply">Xem</button>`:""}
      </div>
      <div class="filter-bar" style="margin-top:.5rem">
        <button class="${rptTypeFilter==='all'?'active':''}" data-type="all">Tất cả</button>
        <button class="${rptTypeFilter==='food'?'active':''}" data-type="food">🍜 Món ăn</button>
        <button class="${rptTypeFilter==='drink'?'active':''}" data-type="drink">🍺 Đồ uống</button>
        <button class="${rptTypeFilter==='service'?'active':''}" data-type="service">🧂 Dịch vụ</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">${VND(cur.revenue)}</div><div class="l">Doanh thu</div><div class="delta ${dRev.cls}">${dRev.txt}</div></div>
      ${showFin ? `
      <div class="stat"><div class="n" style="color:var(--warn)">${VND(cur.cost)}</div><div class="l">Giá gốc BOM</div></div>
      <div class="stat"><div class="n" style="color:var(--ok)">${VND(grossProfit)}</div><div class="l">Lợi nhuận gộp</div><div class="delta up">Margin ${marginPct}%</div></div>
      <div class="stat"><div class="n" style="color:${fin.netProfit>=0?'var(--money)':'var(--danger)'}">${VND(fin.netProfit)}</div><div class="l">💰 LN RÒNG</div><div class="delta ${fin.netProfitPerDay>=0?'up':'down'}">${VND(fin.netProfitPerDay)}/ngày</div></div>` : ''}
      <div class="stat"><div class="n">${cur.items}</div><div class="l">Món đã bán</div><div class="delta ${dItems.cls}">${dItems.txt}</div></div>
    </div>
    ${showFin ? `
    <div class="card" style="background:linear-gradient(135deg,color-mix(in srgb,var(--money) 8%,var(--surface)),var(--surface));border-color:var(--money)">
      <b>💰 Bảng lợi nhuận ròng</b>
      <div class="row" style="margin-top:.5rem"><span>Doanh thu:</span><b class="fin-money-in">${VND(fin.revenue)}</b></div>
      <div class="row"><span>− Giá vốn (COGS):</span><b class="fin-money-out">${VND(fin.cogs)}</b></div>
      <div class="row" style="border-top:1px dashed var(--border);padding-top:.3rem;margin-top:.3rem">
        <b>= LỢI NHUẬN GỘP:</b>
        <b style="color:var(--ok)">${VND(fin.grossProfit)}</b>
      </div>
      <div class="row"><span>− Chi phí PS:</span><b class="fin-money-out">${VND(fin.totalExpense)}</b></div>
      <div class="row"><span>− CP cố định PB (${fin.days} ngày):</span><b class="fin-money-out">${VND(fin.totalRecurring)}</b></div>
      <div class="row" style="border-top:2px solid var(--border);padding-top:.4rem;margin-top:.4rem;font-size:1.1rem">
        <b>= LỢI NHUẬN RÒNG:</b>
        <b style="color:${fin.netProfit>=0?'var(--money)':'var(--danger)'}">${VND(fin.netProfit)}</b>
      </div>
      <div class="row" style="font-size:.85rem;margin-top:.3rem"><span>Trung bình/ngày:</span><b>${VND(fin.netProfitPerDay)}/ngày</b></div>
    </div>` : ''}
    <div class="card">
      <div class="filter-bar" style="margin-bottom:.5rem">
        <button class="${rptView==='overview'?'active':''}" data-view="overview">📊 Tổng quan</button>
        <button class="${rptView==='chart'?'active':''}" data-view="chart">📈 Biểu đồ</button>
        <button class="${rptView==='ranking'?'active':''}" data-view="ranking">🏆 Xếp hạng</button>
      </div>
      ${rptView === 'overview' ? `<b>📊 Doanh thu theo ngày</b>${chartHtml}` : ''}
      ${rptView === 'chart' ? `<b>📈 So sánh Doanh thu · Giá gốc · Lãi</b>${showFin ? chartHtml : '<div class="empty">Chỉ QL xem được</div>'}` : ''}
      ${rptView === 'ranking' ? `
        <div class="filter-bar" style="margin-bottom:.5rem">
          <button class="${rankTab==='best'?'active':''}" data-rank="best">🔥 Best seller</button>
          ${showFin ? `
          <button class="${rankTab==='highProfit'?'active':''}" data-rank="highProfit">💰 Lãi cao</button>
          <button class="${rankTab==='highMargin'?'active':''}" data-rank="highMargin">📈 Margin cao</button>
          <button class="${rankTab==='slow'?'active':''}" data-rank="slow">🐌 Bán chậm</button>` : ''}
        </div>
        ${ranked.length ? `<table><thead><tr><th>Món</th><th>SL</th><th>DT</th>${showFin?'<th>Lãi</th><th>%</th>':''}</tr></thead>
          <tbody>${ranked.map(r=>`<tr><td>${esc(r.name)}</td><td><b>${r.qty}</b></td><td>${VND(r.rev)}</td>
            ${showFin?`<td style="color:${r.profit>=0?'var(--ok)':'var(--danger)'}"><b>${VND(r.profit)}</b></td><td>${r.margin.toFixed(0)}%</td>`:''}
          </tr>`).join("")}</tbody></table>` : '<div class="empty">Chưa có dữ liệu</div>'}
      ` : ''}
    </div>`;
  const rp = document.getElementById("rptPeriod");
  if(rp) rp.onchange = ()=>{ rptPeriod = rp.value; renderQlReport(el); };
  const ra = document.getElementById("rptApply");
  if(ra) ra.onclick = ()=>{ rptFrom = document.getElementById("rptFrom").value; rptTo = document.getElementById("rptTo").value; renderQlReport(el); };
  el.querySelectorAll(".filter-bar button[data-type]").forEach(b=>b.onclick = ()=>{ rptTypeFilter = b.dataset.type; renderQlReport(el); });
  el.querySelectorAll(".filter-bar button[data-view]").forEach(b=>b.onclick = ()=>{ rptView = b.dataset.view; renderQlReport(el); });
  el.querySelectorAll(".filter-bar button[data-rank]").forEach(b=>b.onclick = ()=>{ rankTab = b.dataset.rank; renderQlReport(el); });
}

function renderQlHoadon(el){
  const invs = toArr(state.invoices).slice().sort((a,b)=>(Number(b.ts)||0) - (Number(a.ts)||0));
  el.innerHTML = `
    <div class="card">
      <div class="row"><b>🧾 Lịch sử hóa đơn</b><span class="muted tiny">${invs.length} bản ghi</span></div>
      <div class="muted tiny">"TẠM TÍNH" = không vào doanh thu. "ĐÃ THU" = đã trả tiền.</div>
      ${invs.length ? invs.slice(0,80).map(inv=>{
        const safeItems = toArr(inv.items);
        const itemsStr = safeItems.map(i=>`${i.name||"?"} ×${i.qty||0}`).join(", ");
        let tag, cls;
        if(inv.type === "final"){ tag = "ĐÃ THU"; cls = "paid"; }
        else if(inv.superseded){ tag = "ĐÃ HỦY"; cls = "void"; }
        else { tag = "TẠM TÍNH"; cls = "temp"; }
        const isTA = inv.isTakeaway || isTakeawayId(inv.table);
        const loc = isTA ? `🥡 ${inv.table}` : `Bàn ${inv.table}`;
        const meta = isTA ? getTAMeta(inv.table) : null;
        const metaLine = meta && (meta.name || meta.phone) ? `<div class="muted tiny">👤 ${esc(meta.name||"")} ${meta.phone?'· '+esc(meta.phone):''}</div>` : "";
        const svcLine = (Number(inv.servicePrice)||0) > 0 ? `<div class="tiny" style="color:var(--warn)">➕ DV: ${esc(inv.serviceNote||"")} · ${VND(inv.servicePrice)}</div>` : "";
        const dfLine = (Number(inv.deliveryFee)||0) > 0 ? `<div class="tiny" style="color:var(--ta)">🛵 Phí ship: ${VND(inv.deliveryFee)}</div>` : "";
        return `<div class="item" style="align-items:flex-start;flex-direction:column;gap:.2rem">
          <div class="row" style="width:100%">
            <div><b>${loc}</b> <span class="badge ${cls}">${tag}</span></div>
            <div><b>${VND(inv.total)}</b></div>
          </div>
          <div class="muted tiny">${fmtTime(inv.ts)} · ${fmtDate(inv.ts)}</div>
          ${metaLine}
          <div class="tiny" style="color:var(--text)">${esc(itemsStr)||"—"}</div>
          ${svcLine}${dfLine}
          <button class="pillbtn small" data-reprint="${inv.id}" style="margin-top:.3rem;background:rgba(0,0,0,.08);color:var(--text)">🖨️ In lại</button>
        </div>`;
      }).join("") : '<div class="empty">Chưa có hóa đơn</div>'}
    </div>`;
  el.querySelectorAll("[data-reprint]").forEach(b=>b.onclick = ()=>{
    const inv = state.invoices.find(i=>i.id === b.dataset.reprint);
    if(!inv) return;
    const items = toArr(inv.items).slice();
    items.serviceNote = inv.serviceNote || "";
    items.servicePrice = inv.servicePrice || 0;
    printBill(inv.table, inv.type, items, inv.total, true);
  });
}
let callFilterTab = "pending";
function renderQlCall(el){
  let list = toArr(state.calls).slice().sort((a,b)=>(Number(b.ts)||0)-(Number(a.ts)||0));
  if(callFilterTab === "pending") list = list.filter(c=>!c.handled);
  else if(callFilterTab === "done") list = list.filter(c=>c.handled);
  const pendingCount = state.calls.filter(c=>!c.handled).length;
  el.innerHTML = `
    <div class="card">
      <div class="row"><b>🔔 Tin nhắn</b><span class="muted tiny">${state.calls.length} tin</span></div>
      <div class="filter-bar" style="margin-top:.5rem">
        <button class="${callFilterTab==='pending'?'active':''}" data-cf="pending">🔴 Chờ (${pendingCount})</button>
        <button class="${callFilterTab==='done'?'active':''}" data-cf="done">✓ Đã xử lý</button>
        <button class="${callFilterTab==='all'?'active':''}" data-cf="all">Tất cả</button>
      </div>
      ${pendingCount > 0 ? `<button class="btn small secondary" id="markAllDone" style="margin-top:.3rem">✓ Xử lý tất cả</button>` : ""}
    </div>
    <div class="card">
      ${list.length ? list.slice(0,100).map(c=>{
        const info = callTypeInfo(c.type);
        const ago = minsAgo(c.ts);
        const isTA = isTakeawayId(c.table);
        const loc = isTA ? `🥡 ${c.table}` : `Bàn ${c.table}`;
        return `<div class="item" style="align-items:flex-start;flex-direction:column;gap:.2rem;padding:.65rem 0">
          <div class="row" style="width:100%">
            <div><b style="color:${c.handled?'var(--muted)':'var(--danger)'}">${info.icon} ${loc}</b>
              <span class="badge ${c.handled?'st':'out'}">${c.handled?'✓ Đã xử lý':'🔴 Chờ'}</span>
            </div>
            <div class="muted tiny">${fmtTime(c.ts)} · ${fmtDate(c.ts)}${ago<60?` (${ago}' trước)`:''}</div>
          </div>
          <div style="font-size:.92rem;color:var(--text)">${esc(c.message || info.label)}</div>
          ${!c.handled ? `<button class="btn ok small" data-handle="${c.id}" style="margin-top:.3rem">✓ Đã xử lý</button>` : ''}
        </div>`;
      }).join("") : '<div class="empty">Không có tin nhắn</div>'}
    </div>`;
  el.querySelectorAll("[data-cf]").forEach(b=>b.onclick = ()=>{ callFilterTab = b.dataset.cf; renderQlCall(el); });
  const mA = document.getElementById("markAllDone");
  if(mA) mA.onclick = ()=>{
    if(!confirm("Đánh dấu TẤT CẢ đã xử lý?")) return;
    state.calls.forEach(c=>c.handled = true); save(); renderAll();
  };
  el.querySelectorAll("[data-handle]").forEach(b=>b.onclick = ()=>{
    const c = state.calls.find(x=>x.id === b.dataset.handle);
    if(c){ c.handled = true; save(); renderAll(); }
  });
}

let qrSelected = new Set();
function renderQlQr(el){
  if(!qrSelected.size) TABLES.forEach(t=>qrSelected.add(t.id));
  const customCount = Object.keys(state.qrImages).length;
  el.innerHTML = `
    <div class="card">
      <div class="row"><b>🔗 Mã QR theo bàn</b>
        <div style="display:flex;gap:.3rem;flex-wrap:wrap">
          <button class="btn small secondary" id="qrAll">Chọn tất cả</button>
          <button class="btn small secondary" id="qrNone">Bỏ chọn</button>
          <button class="btn small" id="qrPrint">🖨️ In QR</button>
        </div>
      </div>
      <div class="muted tiny">QR tùy chỉnh: <b>${customCount}</b> / ${TABLES.length}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.4rem;margin:.5rem 0">
        ${TABLES.map(t=>`<label style="display:flex;align-items:center;gap:.3rem;padding:.35rem .5rem;border:1px solid var(--border);border-radius:8px;font-size:.82rem;cursor:pointer;background:var(--bg)">
          <input type="checkbox" data-qr="${t.id}" ${qrSelected.has(t.id)?'checked':''} style="width:auto">Bàn ${t.id}
        </label>`).join("")}
      </div>
    </div>
    <div class="card">
      <div class="row"><b>🖼️ Upload QR tùy chỉnh</b>
        <label class="btn small secondary" style="cursor:pointer;margin:0">📁 Upload nhiều file
          <input type="file" id="qrBulkUpload" multiple accept="image/*" style="display:none">
        </label>
      </div>
      <div class="qr-upload-grid" id="qrUploadGrid">
        ${TABLES.map(t=>{
          const custom = state.qrImages[t.id];
          const url = location.origin + location.pathname + "?table=" + t.id;
          let autoImg = "";
          try{ const qr = qrcode(0,"M"); qr.addData(url); qr.make(); autoImg = qr.createImgTag(3,3); }catch(e){}
          return `<div class="qr-up-card">
            <div class="tname">${t.id} ${custom?'<span class="tiny" style="color:var(--money)">✓</span>':''}</div>
            <div class="preview">${custom ? `<img src="${esc(custom)}" referrerpolicy="no-referrer">` : `<div style="font-size:.7rem;color:var(--muted);padding:.3rem">${autoImg||'—'}</div>`}</div>
            <div class="actions">
              <label class="pillbtn" style="cursor:pointer;background:var(--primary);color:#fff;border:none">${custom?'Đổi':'Upload'}
                <input type="file" data-qr-up="${t.id}" accept="image/*" style="display:none">
              </label>
              ${custom?`<button class="pillbtn x" data-qr-rm="${t.id}">Xóa</button>`:''}
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="card"><b>📋 Preview QR</b><div class="qrbox" id="qrBox" style="margin-top:.5rem"></div></div>`;
  el.querySelectorAll("input[data-qr]").forEach(cb=>cb.onchange = ()=>{
    if(cb.checked) qrSelected.add(cb.dataset.qr); else qrSelected.delete(cb.dataset.qr);
    renderQlQr(el);
  });
  document.getElementById("qrAll").onclick = ()=>{ TABLES.forEach(t=>qrSelected.add(t.id)); renderQlQr(el); };
  document.getElementById("qrNone").onclick = ()=>{ qrSelected.clear(); renderQlQr(el); };
  document.getElementById("qrPrint").onclick = ()=>printQRCodes(Array.from(qrSelected));
  el.querySelectorAll("input[data-qr-up]").forEach(inp=>inp.onchange = async ()=>{
    const t = inp.dataset.qrUp;
    const f = inp.files[0]; if(!f) return;
    try{
      const dataUrl = await readImageAsResizedDataUrl(f, 500, 500, 0.85);
      state.qrImages[t] = dataUrl; save(); renderQlQr(el);
      alert(`✓ Đã lưu QR ${t}`);
    }catch(e){ alert("Lỗi đọc ảnh"); }
  });
  el.querySelectorAll("[data-qr-rm]").forEach(b=>b.onclick = ()=>{
    const t = b.dataset.qrRm;
    if(!confirm(`Xóa QR ${t}?`)) return;
    delete state.qrImages[t]; save(); renderQlQr(el);
  });
  const bulk = document.getElementById("qrBulkUpload");
  if(bulk) bulk.onchange = async ()=>{
    const files = Array.from(bulk.files);
    if(!files.length) return;
    if(!confirm(`Gán ${files.length} file vào A1, A2...?`)) return;
    const order = TABLES.map(t=>t.id);
    let idx = 0, ok = 0, fail = 0;
    for(const f of files){
      if(idx >= order.length) break;
      try{
        const dataUrl = await readImageAsResizedDataUrl(f, 500, 500, 0.85);
        state.qrImages[order[idx]] = dataUrl; ok++; idx++;
      }catch(e){ fail++; }
    }
    save(); renderQlQr(el);
    alert(`✓ Đã lưu ${ok} QR${fail?`, ${fail} lỗi`:''}`);
  };
  const box = document.getElementById("qrBox");
  try{
    TABLES.slice(0,12).forEach(t=>{
      const custom = state.qrImages[t.id];
      const url = location.origin + location.pathname + "?table=" + t.id;
      let img;
      if(custom) img = `<img src="${esc(custom)}" referrerpolicy="no-referrer">`;
      else { const qr = qrcode(0, "M"); qr.addData(url); qr.make(); img = qr.createImgTag(3,3); }
      const card = document.createElement("div"); card.className = "qrcard";
      card.innerHTML = `<b>${t.id}${custom?' 🖼️':''}</b><div class="qrimg">${img}</div>
        <a class="btn small secondary" href="${url}" target="_blank" rel="noopener">Mở thử</a>`;
      box.appendChild(card);
    });
  }catch(e){ box.innerHTML = '<div class="empty">Không tạo được QR.</div>'; }
}
function printQRCodes(tableIds){
  if(!tableIds.length){ alert("Chưa chọn bàn!"); return; }
  const w = window.open("", "_blank");
  if(!w){ alert("Không mở được cửa sổ in."); return; }
  let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>In QR</title>
    <style>
      body{font-family:Arial,sans-serif;margin:10px;background:#fff}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
      .cell{border:2px solid #c0521f;padding:10px;text-align:center;page-break-inside:avoid;border-radius:8px;background:#fdf6ec}
      .cell h3{margin:0 0 6px;font-size:15px;color:#963f16}
      .cell img{width:150px;height:150px;image-rendering:pixelated;background:#fff;border-radius:6px;object-fit:contain}
      .cell p{font-size:9px;color:#666;margin:6px 0 0;word-break:break-all}
      .head{text-align:center;margin-bottom:14px}.head h2{margin:0;color:#c0521f}
      .head .contact{font-size:11px;color:#666;margin-top:.2rem}
      @media print{.noprint{display:none}}
    </style></head><body>
    <div class="noprint" style="margin-bottom:8px"><button onclick="window.print()" style="padding:8px 16px;font-size:14px">🖨️ In ngay</button></div>
    <div class="head">
      <h2>${esc(state.brand.logo||"🐚")} ${esc(state.brand.name)}</h2>
      <div>${esc(state.brand.sub)}</div>
      ${state.brand.address || state.brand.phone ? `<div class="contact">
        ${state.brand.address?esc(state.brand.address):''}${state.brand.address && state.brand.phone?' · ':''}${state.brand.phone?'ĐT: '+esc(state.brand.phone):''}
      </div>`:''}
      <div style="font-size:11px;color:#888;margin-top:.3rem">Quét QR để đặt món tại bàn</div>
    </div>
    <div class="grid">`;
  tableIds.forEach(id=>{
    const custom = state.qrImages[id];
    const url = location.origin + location.pathname + "?table=" + id;
    let qrImg;
    if(custom) qrImg = `<img src="${esc(custom)}" referrerpolicy="no-referrer">`;
    else { try{ const qr = qrcode(0, "M"); qr.addData(url); qr.make(); qrImg = qr.createImgTag(4,4); }catch(e){ qrImg = ""; } }
    html += `<div class="cell"><h3>BÀN ${id}</h3>${qrImg}<p>${url}</p></div>`;
  });
  html += `</div><script>setTimeout(()=>window.print(),400);<\/script></body></html>`;
  w.document.write(html); w.document.close();
}

    </label>
  </div>
  <div class="card">
    <b>💰 Số dư đầu kỳ</b>
    <label class="fl">Tiền mặt + NH <input type="number" id="setOpening" value="${state.settings.openingBalance||0}" step="100000"></label>
  </div>
  <div class="card">
    <b>⚙️ Hệ thống</b>
    <label class="fl">PIN QL <input id="setPin" value="${esc(state.settings.managerPin)}"></label>
    <label class="fl" style="margin-top:.5rem">
      <input type="checkbox" id="setCancelApproval" ${state.settings.cancelApproval?"checked":""} style="width:auto"> PIN khi hủy món
    </label>
    <label class="fl" style="margin-top:.5rem">
      <input type="checkbox" id="setTaxEnabled" ${state.settings.taxEnabled?"checked":""} style="width:auto"> Bật VAT
    </label>
    <label class="fl">VAT (%) <input type="number" id="setTaxRate" value="${state.settings.taxRate}" min="0" max="30" step="0.5"></label>
    <label class="fl" style="margin-top:.5rem">
      <input type="checkbox" id="setAutoOut" ${state.settings.autoDisableByStock?"checked":""} style="width:auto"> Tự báo hết khi NL không đủ
    </label>
    <label class="fl" style="margin-top:.5rem">
      <input type="checkbox" id="setSvcFee" ${state.settings.serviceFeeEnabled!==false?"checked":""} style="width:auto"> Cho phép phí DV
    </label>
    <div class="row" style="margin-top:.8rem"><button class="btn" id="setSave">💾 Lưu</button></div>

  <div class="card">

  document.getElementById("setSave").onclick = ()=>{
    const pin = document.getElementById("setPin").value.trim();
    if(!pin || pin.length < 4){ alert("PIN >= 4 ký tự"); return; }
    state.brand.logo = document.getElementById("setLogo").value.trim() || "🐚";
    state.brand.name = document.getElementById("setName").value.trim() || "ỐC NƯỚNG";
    state.brand.sub = document.getElementById("setSub").value.trim();
    state.brand.address = document.getElementById("setAddress").value.trim();
    state.brand.phone = document.getElementById("setPhone").value.trim();
    state.brand.openHours = document.getElementById("setHours").value.trim();
    state.brand.dev = document.getElementById("setDev").value.trim();
    state.settings.openingBalance = parseInt(document.getElementById("setOpening").value) || 0;
    state.settings.deliveryFee = Math.max(0, parseInt(document.getElementById("setDeliveryFee").value) || 0);
    state.settings.managerPin = pin;
    state.settings.cancelApproval = document.getElementById("setCancelApproval").checked;
    state.settings.taxEnabled = document.getElementById("setTaxEnabled").checked;
    state.settings.taxRate = Math.max(0, Math.min(30, parseFloat(document.getElementById("setTaxRate").value)||0));
    state.settings.autoDisableByStock = document.getElementById("setAutoOut").checked;
    state.settings.serviceFeeEnabled = document.getElementById("setSvcFee").checked;
    state.settings.bank = {
      enabled: document.getElementById("bankEnabled").checked,
      bankId: document.getElementById("bankId").value,
      accountNumber: document.getElementById("bankAcc").value.trim(),
      accountHolder: document.getElementById("bankHolder").value.trim().toUpperCase(),
      qrImageUrl: document.getElementById("bankQrUrl").value.trim(),
      showOnBill: document.getElementById("bankOnBill").checked
    };
    save(); alert("Đã lưu!"); renderAll();
  };
  const testBtn = document.getElementById("btnTestFb");
  if(testBtn) testBtn.onclick = async ()=>{
    const out = document.getElementById("testFbResult");
    out.textContent = "⏳ Đang kiểm tra...";
    const lines = [];
    lines.push(`📡 URL: ${FIREBASE_CONFIG.databaseURL}`);
    lines.push(`🔌 Đã khởi tạo: ${firebaseReady ? "✅" : "❌"}`);
    lines.push(`🌐 Kết nối: ${fbConnected ? "✅" : "❌"}`);
    try{
      const snap = await fbRef.once("value");
      const v = snap.val();
      lines.push(`📖 Đọc: ✅ ${v ? "Có dữ liệu" : "Trống"}`);
      await fbRef.child("__test__").set(Date.now());
      await fbRef.child("__test__").remove();
      lines.push(`✍️ Ghi: ✅`);
      lines.push(`\n🎉 Firebase hoạt động tốt!`);
    }catch(err){
      lines.push(`\n❌ LỖI: ${err.code || err.message}`);
      if(err.code === "PERMISSION_DENIED"){
        lines.push(`\n👉 Vào Firebase Console → Realtime Database → Rules\nDán:\n{\n  "rules": {\n    ".read": true,\n    ".write": true\n  }\n}\nBấm Publish.`);
      }
    }
    out.textContent = lines.join("\n");
  };
  const fsBtn = document.getElementById("btnForceSync");
  if(fsBtn) fsBtn.onclick = async ()=>{
    if(!firebaseReady){ alert("Firebase chưa khởi tạo"); return; }
    try{
      const snap = await fbRef.once("value");
      const remote = snap.val();
      if(remote){
        suppressWrite = true;
        state = migrateState(remote);
        applyImagesCache();
        saveLocal();
        renderAll();
        setTimeout(()=>{ suppressWrite = false; }, 500);
        alert("✓ Đã kéo dữ liệu mới từ Firebase");
      } else {
        await fbRef.set(stripImagesForSync(migrateState(JSON.parse(JSON.stringify(state)))));
        state.menu.forEach(m=>{ if(m.imgData) saveMenuImage(m.id, m.imgData); });
        alert("✓ Đã đẩy dữ liệu local lên Firebase");
      }
    }catch(err){
      alert("Lỗi: " + (err.code || err.message));
    }
  };
  document.getElementById("btnExport").onclick = ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ocnuong-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };
  document.getElementById("btnImport").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const data = JSON.parse(r.result);
        if(!confirm("Ghi đè dữ liệu?")) return;
        state = migrateState(data); save(); renderAll();
      }catch(err){ alert("File không hợp lệ!"); }
    };
    r.readAsText(f);
  };
  document.getElementById("btnReset").onclick = ()=>{
    if(!confirm("XÓA TOÀN BỘ dữ liệu?")) return;
    state = seed(); save(); renderAll();
  };
}
function addNewCategory(){
  const name = prompt("Tên danh mục mới:");
  if(!name || !name.trim()) return;
  const c = name.trim();
  if(getCats().includes(c)){ alert("Đã tồn tại!"); return; }
  const m = {id:uid("m"),name:"(Chưa đặt tên)",cat:c,price:0,prep:5,prio:1,available:true,tag:"",emoji:"🍽️",img:"",imgData:"",laborCost:0,otherCost:0,recipe:[]};
  state.menu.push(m); save();
  openMenuEditor(m.id);
}
function openMenuEditor(id){
  if(!isManager()){ alert("Chỉ QL sửa được menu."); return; }
  const isNew = !id;
  const existing = id ? state.menu.find(x=>x.id === id) : null;
  if(id && !existing){ alert("Không tìm thấy món!"); return; }
  const m = existing ? {...existing, recipe:(existing.recipe||[]).map(r=>({...r}))}
    : {id:uid("m"),name:"",cat:getCats()[0],price:0,prep:8,prio:1,available:true,tag:"",
       emoji:"🍽️",img:"",imgData:"",laborCost:0,otherCost:0,recipe:[]};
  const root = document.getElementById("modalRoot");
  modalLocked = true;
  const cats = getCats();
  let tempImgData = m.imgData || "";
  function recipeRowHtml(r){
    const ingOptions = state.ingredients.map(i=>`<option value="${i.id}" ${r.ingId===i.id?"selected":""}>${esc(i.name)}</option>`).join("");
    const ing = state.ingredients.find(i=>i.id === r.ingId);
    return `<div class="recipe-row" data-rid="${esc(r.ingId)}">
      <select data-rf="ingId">${ingOptions}</select>
      <input type="number" step="0.001" min="0" data-rf="qty" value="${r.qty}">
      <span class="unit" data-unit>${ing?esc(ing.unit):""}</span>
      <button type="button" class="pillbtn x" data-rrm>✕</button>
    </div>`;
  }
  root.innerHTML = `<div class="modal-back" id="mb"><div class="modal">
    <button class="close-x" id="mc">✕</button>
    <h3>${isNew ? "➕ Thêm món" : "✏️ Sửa món"}</h3>
    <div style="display:flex;gap:.6rem;align-items:center;margin-top:.6rem;padding:.5rem;background:var(--bg);border-radius:10px">
      <div id="mmPreview" style="width:80px;height:80px;border-radius:10px;background:linear-gradient(135deg,#f5d4a8,#e8b878);display:flex;align-items:center;justify-content:center;font-size:2.4rem;flex-shrink:0;overflow:hidden"></div>
      <div style="flex:1;min-width:0">
        <div class="tiny muted">Ảnh món</div>
        <div style="display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem">
          <label class="btn small" style="cursor:pointer;background:var(--primary);color:#fff;border:none">📁 Upload
            <input type="file" id="mmImgUpload" accept="image/*" style="display:none">
          </label>
          ${(m.imgData||tempImgData)?`<button class="btn secondary small" id="mmImgRemove" type="button">🗑️ Xoá</button>`:''}
        </div>
      </div>
    </div>
    <label class="fl">Emoji <input id="mmEmoji" value="${esc(m.emoji||"🍽️")}" maxlength="8"></label>
    <details style="margin-top:.4rem"><summary class="tiny muted" style="cursor:pointer">Hoặc dán URL ảnh</summary>
      <input id="mmImg" value="${esc(m.img||"")}" placeholder="https://...jpg" style="margin-top:.4rem">
    </details>
    <label class="fl">Tên món<input id="mmName" value="${esc(m.name)}"></label>
    <label class="fl">Danh mục <input id="mmCat" list="catList" value="${esc(m.cat)}"></label>
    <datalist id="catList">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <label class="fl">Giá bán <input type="number" id="mmPrice" value="${m.price}" min="0" step="1000"></label>
    <label class="fl">Tiền công <input type="number" id="mmLabor" value="${m.laborCost||0}" min="0" step="1000"></label>
    <label class="fl">Chi phí khác / phần <input type="number" id="mmOther" value="${m.otherCost||0}" min="0" step="500"></label>
    <label class="fl">Số lon / thùng <input type="number" id="mmCase" value="${m.caseSize||""}" min="0" step="1" placeholder="VD: 24"></label>
    <label class="fl">Thời gian CB (phút) <input type="number" id="mmPrep" value="${m.prep}" min="1"></label>
    <label class="fl">Ưu tiên (1-5) <input type="number" id="mmPrio" value="${m.prio}" min="1" max="5"></label>
    <label class="fl">Tag <select id="mmTag">
      <option value="" ${!m.tag?"selected":""}>— Không —</option>
      <option value="best" ${m.tag==="best"?"selected":""}>🔥 BEST</option>
      <option value="good" ${m.tag==="good"?"selected":""}>👍 GOOD</option>
    </select></label>
    <label class="fl" style="margin-top:.5rem"><input type="checkbox" id="mmAvail" ${m.available?"checked":""} style="width:auto"> Đang bán</label>
    <div style="margin-top:.9rem;background:var(--bg);padding:.5rem .7rem;border-radius:8px">
      <div class="row"><span>Tiền NL:</span><b id="costIng">0đ</b></div>
      <div class="row"><span>Tiền công:</span><b id="costLabor">0đ</b></div>
      <div class="row"><span>Chi phí khác:</span><b id="costOther">0đ</b></div>
      <div class="row" style="border-top:1px solid var(--border);padding-top:.3rem;margin-top:.3rem"><b>GIÁ GỐC:</b><b id="costTotal" style="color:var(--primary-d)">0đ</b></div>
      <div class="row"><span>Lợi nhuận DK:</span><b id="costProfit" style="color:var(--ok)">0đ</b></div>
    </div>
    <div style="margin-top:.8rem"><b>📦 BOM — Định lượng NL</b>
      <div id="recipeList" style="margin-top:.4rem">${(m.recipe||[]).map(recipeRowHtml).join("")}</div>
      <button type="button" class="btn secondary small" id="btnAddIng2">+ Thêm NL</button>
    </div>
    <div class="row" style="margin-top:.9rem">
      <button class="btn" id="mmSave">💾 Lưu</button>
      ${isNew ? "" : `<button class="btn secondary" id="mmDel" style="color:var(--danger);border-color:var(--danger)">🗑️ Xóa</button>`}
    </div>
  </div></div>`;
  const closeEditor = ()=>{ modalLocked = false; root.innerHTML = ""; };
  document.getElementById("mc").onclick = closeEditor;
  document.getElementById("mb").onclick = e=>{ if(e.target.id === "mb") closeEditor(); };
  const updatePreview = ()=>{
    const emoji = document.getElementById("mmEmoji").value.trim() || "🍽️";
    const raw = tempImgData || document.getElementById("mmImg").value.trim();
    const prev = document.getElementById("mmPreview");
    if(raw) prev.innerHTML = `<img src="${esc(proxiedImgUrl(raw))}" style="width:100%;height:100%;object-fit:cover" referrerpolicy="no-referrer" onerror="this.parentElement.textContent='${esc(emoji)}'">`;
    else prev.textContent = emoji;
  };
  document.getElementById("mmImgUpload").onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      const d = await readImageAsResizedDataUrl(f, 800, 800, 0.82);
      tempImgData = d; updatePreview();
    }catch(err){ alert("Lỗi đọc ảnh"); }
  };
  const rmBtn = document.getElementById("mmImgRemove");
  if(rmBtn) rmBtn.onclick = ()=>{
    if(!confirm("Xoá ảnh?")) return;
    tempImgData = ""; document.getElementById("mmImg").value = "";
    closeEditor(); openMenuEditor(existing ? existing.id : null);
  };
  document.getElementById("mmEmoji").oninput = updatePreview;
  document.getElementById("mmImg").oninput = updatePreview;
  updatePreview();
  const recalc = ()=>{
    const price = Math.max(0, parseInt(document.getElementById("mmPrice").value)||0);
    const labor = Math.max(0, parseInt(document.getElementById("mmLabor").value)||0);
    const other = Math.max(0, parseInt(document.getElementById("mmOther").value)||0);
    let ing = 0;
    root.querySelectorAll("#recipeList .recipe-row").forEach(r=>{
      const ingId = r.querySelector("select[data-rf='ingId']").value;
      const qty = parseFloat(r.querySelector("input[data-rf='qty']").value) || 0;
      const i = state.ingredients.find(x=>x.id === ingId);
      if(i) ing += i.price * qty;
    });
    const total = ing + labor + other;
    document.getElementById("costIng").textContent = VND(ing);
    document.getElementById("costLabor").textContent = VND(labor);
    document.getElementById("costOther").textContent = VND(other);
    document.getElementById("costTotal").textContent = VND(total);
    document.getElementById("costProfit").textContent = VND(price - total);
  };
  const bindRecipe = ()=>{
    const list = document.getElementById("recipeList");
    list.querySelectorAll("[data-rrm]").forEach(b=>b.onclick = ()=>{ b.closest(".recipe-row").remove(); recalc(); });
    list.querySelectorAll("select[data-rf='ingId']").forEach(sel=>{
      sel.onchange = ()=>{
        const ing = state.ingredients.find(i=>i.id === sel.value);
        const u = sel.closest(".recipe-row").querySelector("[data-unit]");
        if(u) u.textContent = ing ? ing.unit : "";
        recalc();
      };
    });
    list.querySelectorAll("input[data-rf='qty']").forEach(inp=>inp.oninput = recalc);
  };
  bindRecipe();
  document.getElementById("btnAddIng2").onclick = ()=>{
    if(!state.ingredients.length){ alert("Chưa có NL"); return; }
    const list = document.getElementById("recipeList");
    const tmp = document.createElement("div");
    tmp.innerHTML = recipeRowHtml({ingId: state.ingredients[0].id, qty: 0.1});
    list.appendChild(tmp.firstChild);
    bindRecipe(); recalc();
  };
  document.getElementById("mmPrice").oninput = recalc;
  document.getElementById("mmLabor").oninput = recalc;
  document.getElementById("mmOther").oninput = recalc;
  recalc();
  document.getElementById("mmSave").onclick = ()=>{
    const name = document.getElementById("mmName").value.trim();
    if(!name){ alert("Nhập tên món"); return; }
    let cat = document.getElementById("mmCat").value.trim() || getCats()[0];
    if(!getCats().includes(cat) && !confirm(`Tạo danh mục "${cat}"?`)) return;
    const recipe = [];
    document.querySelectorAll("#recipeList .recipe-row").forEach(r=>{
      const ingId = r.querySelector("select[data-rf='ingId']").value;
      const qty = parseFloat(r.querySelector("input[data-rf='qty']").value) || 0;
      if(ingId && qty > 0) recipe.push({ingId, qty});
    });
    m.name = name; m.cat = cat;
    m.price = Math.max(0, parseInt(document.getElementById("mmPrice").value)||0);
    m.laborCost = Math.max(0, parseInt(document.getElementById("mmLabor").value)||0);
    m.otherCost = Math.max(0, parseInt(document.getElementById("mmOther").value)||0);
    const caseVal = parseInt(document.getElementById("mmCase").value)||0;
    if(caseVal > 0) m.caseSize = caseVal; else delete m.caseSize;
    m.prep = Math.max(1, parseInt(document.getElementById("mmPrep").value)||5);
    m.prio = Math.min(5, Math.max(1, parseInt(document.getElementById("mmPrio").value)||1));
    m.tag = document.getElementById("mmTag").value;
    m.emoji = document.getElementById("mmEmoji").value.trim() || "🍽️";
    m.img = document.getElementById("mmImg").value.trim();
    m.imgData = tempImgData || "";
    m.available = document.getElementById("mmAvail").checked;
    m.recipe = recipe;
    if(isNew) state.menu.push(m);
    else { const idx = state.menu.findIndex(x=>x.id === m.id); if(idx >= 0) state.menu[idx] = m; }
    save();
    saveMenuImage(m.id, m.imgData); // ảnh đồng bộ riêng, không làm nặng state chính
    closeEditor(); alert("Đã lưu món!"); renderAll();
  };
  const del = document.getElementById("mmDel");
  if(del) del.onclick = ()=>{
    if(!confirm(`Xóa món "${m.name}"?`)) return;
    state.menu = state.menu.filter(x=>x.id !== m.id);
    save(); closeEditor(); renderAll();
  };
}

/* ============================================================
   RENDER ALL
   ============================================================ */
function renderAll(opts){
  opts = opts || {};
  if(modalLocked){ renderHeader(); renderLowStockBanner(); renderCallBanner(); return; }
  renderHeader(); renderNav(); showSection();
  renderLowStockBanner(); renderCallBanner(); renderCallButton();
  if(!opts.skipKhach) renderKhach();
  if(!opts.skipModal) renderModal();
  if(MODE === "staff"){
    renderPV(); renderBep(); renderQl();
  }
}
initFirebase();
renderAll();
// Auto-retry nếu mất kết nối
let retryCount = 0;
setInterval(()=>{
  if(firebaseReady && !fbConnected && retryCount < 30){
    retryCount++;
    console.log("[Firebase] Thử kết nối lại lần", retryCount);
    try{ if(fbRef) fbRef.off(); initFirebase(); }catch(e){ console.error(e); }
  } else if(fbConnected) retryCount = 0;
}, 10000);
setInterval(()=>{
  if(modalLocked) return;
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT");
  const inModal = ae && ae.closest && ae.closest("#modalRoot");
  if(typing || inModal) return;
  renderAll();
}, 20000);
</script>
